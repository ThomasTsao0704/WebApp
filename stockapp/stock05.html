    <script>
        // ========== 簡易CSV解析器 ==========
        function parseCSV(text) {
            const lines = text.split('\n');
            const result = [];
            const headers = lines[0].split(',').map(h => h.trim());
            
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i].trim()) continue;
                
                const values = lines[i].split(',');
                const row = {};
                
                headers.forEach((header, index) => {
                    row[header] = values[index] ? values[index].trim() : '';
                });
                
                result.push(row);
            }
            
            return result;
        }

        // ========== 數據存儲 ==========
        let appData = {
            dailyJournals: [],
            rawTrades: [],
            monthlyData: {},
            strategies: [
                {
                    id: 1,
                    name: '突破買進策略',
                    description: '當股價突破前高且量能放大時買進',
                    successRate: 60,
                    avgProfit: 3500,
                    totalPnL: 18500,
                    trades: 15
                }
            ],
            mistakes: []
        };

        // ========== CSV上傳與解析 ==========
        function renderUpload() {
            const content = `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-gray-800">📤 上傳交易CSV</h1>

                    <div class="bg-white rounded-xl shadow-lg p-8">
                        <h2 class="text-xl font-bold text-gray-800 mb-4">上傳您的交易記錄</h2>
                        <p class="text-gray-600 mb-6">支持券商匯出的CSV格式,系統會自動分析並整合到各個模組中</p>
                        
                        <div id="fileDropZone" class="border-4 border-dashed border-blue-300 rounded-xl p-12 text-center cursor-pointer bg-blue-50 transition-all">
                            <input type="file" id="csvFileInput" accept=".csv" class="hidden" onchange="handleFileSelect(event)">
                            <label for="csvFileInput" class="cursor-pointer">
                                <svg class="mx-auto text-blue-500 mb-4" xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                                <p class="text-xl font-semibold text-gray-700 mb-2">點擊或拖放CSV文件</p>
                                <p class="text-sm text-gray-500">支持格式:CSV(與您上傳的券商格式相同)</p>
                            </label>
                        </div>

                        <div id="uploadStatus" class="mt-6"></div>
                    </div>

                    ${appData.rawTrades.length > 0 ? `
                        <div class="bg-white rounded-xl shadow-lg p-8">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">📊 已上傳的數據</h2>
                            <div class="grid md:grid-cols-3 gap-4">
                                <div class="bg-blue-50 p-4 rounded-lg">
                                    <p class="text-sm text-blue-700 mb-1">總交易筆數</p>
                                    <p class="text-3xl font-bold text-blue-900">${appData.rawTrades.length}</p>
                                </div>
                                <div class="bg-green-50 p-4 rounded-lg">
                                    <p class="text-sm text-green-700 mb-1">交易月份</p>
                                    <p class="text-3xl font-bold text-green-900">${Object.keys(appData.monthlyData).length}</p>
                                </div>
                                <div class="bg-purple-50 p-4 rounded-lg">
                                    <p class="text-sm text-purple-700 mb-1">交易股票</p>
                                    <p class="text-3xl font-bold text-purple-900">${getUniqueStocks().length}</p>
                                </div>
                            </div>
                            
                            <div class="mt-6">
                                <h3 class="font-bold text-gray-800 mb-3">按月份顯示</h3>
                                <div class="space-y-2">
                                    ${Object.keys(appData.monthlyData).sort().reverse().map(month => {
                                        const data = appData.monthlyData[month];
                                        return `
                                            <div class="bg-gray-50 p-4 rounded-lg flex justify-between items-center">
                                                <div>
                                                    <p class="font-bold text-gray-800">${formatMonth(month)}</p>
                                                    <p class="text-sm text-gray-600">${data.trades}筆交易</p>
                                                </div>
                                                <div class="text-right">
                                                    <p class="text-lg font-bold ${data.totalPnL >= 0 ? 'text-green-600' : 'text-red-600'}">
                                                        ${data.totalPnL >= 0 ? '+' : ''}$${data.totalPnL.toLocaleString()}
                                                    </p>
                                                    <p class="text-sm text-gray-600">勝率 ${data.winRate.toFixed(1)}%</p>
                                                </div>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-gradient-blue-purple-lr rounded-xl p-6 border-l-4 border-blue-500">
                        <h3 class="font-bold text-blue-900 mb-2">💡 使用說明</h3>
                        <ul class="space-y-2 text-blue-800">
                            <li>• 上傳CSV後,系統會自動分析您的交易記錄</li>
                            <li>• 可以上傳多個月份的CSV,系統會自動整合</li>
                            <li>• 分析結果會顯示在「數據分析」模組中</li>
                            <li>• 支持的欄位:交易日期、商品、數量、單價、應收付金額等</li>
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = content;
            setupDragAndDrop();
        }

        function setupDragAndDrop() {
            const dropZone = document.getElementById('fileDropZone');
            if (!dropZone) return;

            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, preventDefaults, false);
            });

            function preventDefaults(e) {
                e.preventDefault();
                e.stopPropagation();
            }

            ['dragenter', 'dragover'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.add('dragover');
                }, false);
            });

            ['dragleave', 'drop'].forEach(eventName => {
                dropZone.addEventListener(eventName, () => {
                    dropZone.classList.remove('dragover');
                }, false);
            });

            dropZone.addEventListener('drop', (e) => {
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFile(files[0]);
                }
            }, false);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                handleFile(file);
            }
        }

        function handleFile(file) {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = `
                <div class="bg-blue-100 p-4 rounded-lg">
                    <p class="text-blue-800 font-semibold">⏳ 正在解析文件:${file.name}</p>
                </div>
            `;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const csvData = parseCSV(e.target.result);
                    processCSVData(csvData);
                    statusDiv.innerHTML = `
                        <div class="bg-green-100 p-4 rounded-lg">
                            <p class="text-green-800 font-semibold">✅ 成功解析 ${csvData.length} 筆交易記錄!</p>
                            <button onclick="switchModule('analysis')" class="mt-3 px-4 py-2 bg-green-600 text-white rounded-lg">
                                查看分析結果 →
                            </button>
                        </div>
                    `;
                    saveData();
                    renderUpload();
                } catch (error) {
                    statusDiv.innerHTML = `
                        <div class="bg-red-100 p-4 rounded-lg">
                            <p class="text-red-800 font-semibold">❌ 解析失敗:${error.message}</p>
                        </div>
                    `;
                }
            };
            reader.readAsText(file);
        }

        function processCSVData(data) {
            data.forEach(row => {
                const cleanRow = {};
                Object.keys(row).forEach(key => {
                    cleanRow[key.trim()] = row[key];
                });

                if (!cleanRow['櫃員序號'] && cleanRow['類別'] === '現股當沖') {
                    const pnl = parseFloat(cleanRow['應收付金額']?.replace(/,/g, '') || 0);
                    const date = cleanRow['交易日期'];
                    const stock = cleanRow['商品'];
                    
                    if (date && stock) {
                        appData.rawTrades.push({
                            date: formatDate(date),
                            stock: stock,
                            pnl: pnl,
                            market: cleanRow['市場別'],
                            type: cleanRow['類別']
                        });
                    }
                }
            });

            organizeByMonth();
        }

        function organizeByMonth() {
            appData.monthlyData = {};
            
            appData.rawTrades.forEach(trade => {
                const month = trade.date.substring(0, 7);
                
                if (!appData.monthlyData[month]) {
                    appData.monthlyData[month] = {
                        trades: 0,
                        totalPnL: 0,
                        wins: 0,
                        losses: 0,
                        winRate: 0,
                        stocks: new Set()
                    };
                }
                
                const monthData = appData.monthlyData[month];
                monthData.trades++;
                monthData.totalPnL += trade.pnl;
                monthData.stocks.add(trade.stock);
                
                if (trade.pnl > 0) {
                    monthData.wins++;
                } else if (trade.pnl < 0) {
                    monthData.losses++;
                }
                
                monthData.winRate = (monthData.wins / monthData.trades) * 100;
            });
        }

        function formatDate(dateStr) {
            const str = dateStr.toString();
            return `${str.substring(0, 4)}-${str.substring(4, 6)}-${str.substring(6, 8)}`;
        }

        function formatMonth(monthStr) {
            const [year, month] = monthStr.split('-');
            return `${year}年${parseInt(month)}月`;
        }

        function getUniqueStocks() {
            const stocks = new Set();
            appData.rawTrades.forEach(trade => stocks.add(trade.stock));
            return Array.from(stocks);
        }

                                            <div class="text-sm text-gray-600 mt-1">${mistake.date} · ${mistake.stock}</div>
                                        </div>
                                        <div class="text-2xl font-bold text-red-600">${mistake.loss.toLocaleString()}</div>
                                    </div>
                                    <div class="space-y-3">
                                        <div>
                                            <div class="text-sm text-gray-600 mb-1">錯誤描述</div>
                                            <div class="bg-red-50 p-3 rounded-lg text-red-900">${mistake.description}</div>
                                        </div>
                                        <div>
                                            <div class="text-sm text-gray-600 mb-1">💡 學到的教訓</div>
                                            <div class="bg-yellow-50 p-3 rounded-lg text-yellow-900 font-semibold">${mistake.lesson}</div>
                                        </div>
                                        <div>
                                            <div class="text-sm text-gray-600 mb-1">🛡️ 預防措施</div>
                                            <div class="bg-green-50 p-3 rounded-lg text-green-900 font-semibold">${mistake.prevention}</div>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
            document.getElementById('mainContent').innerHTML = content;
        }

        // ========== 設定 ==========
        function renderSettings() {
            const content = `
                <div class="space-y-6">
                    <h1 class="text-3xl font-bold text-gray-800">⚙️ 設定與工具</h1>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">🔥 資料管理</h2>
                            <div class="space-y-3">
                                <button onclick="exportData()" class="w-full bg-blue-500 text-white p-4 rounded-lg text-left">
                                    <p class="font-bold">匯出所有數據</p>
                                    <p class="text-sm text-blue-100">JSON格式備份</p>
                                </button>
                                <button onclick="clearData()" class="w-full bg-red-500 text-white p-4 rounded-lg text-left">
                                    <p class="font-bold">清除所有數據</p>
                                    <p class="text-sm text-red-100">恢復到初始狀態</p>
                                </button>
                            </div>
                        </div>

                        <div class="bg-white rounded-xl shadow-lg p-6">
                            <h2 class="text-xl font-bold text-gray-800 mb-4">ℹ️ 系統資訊</h2>
                            <div class="space-y-3">
                                <div class="flex justify-between">
                                    <span class="text-gray-700">版本</span>
                                    <span class="font-bold">2.0.0</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-700">交易筆數</span>
                                    <span class="font-bold">${appData.rawTrades.length}筆</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-700">交易日誌</span>
                                    <span class="font-bold">${appData.dailyJournals.length}筆</span>
                                </div>
                                <div class="flex justify-between">
                                    <span class="text-gray-700">交易月份</span>
                                    <span class="font-bold">${Object.keys(appData.monthlyData).length}個月</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-gradient-blue-purple-r rounded-xl p-8 text-white">
                        <h2 class="text-2xl font-bold mb-4">💼 完整交易分析管理系統 v2.0</h2>
                        <p class="text-blue-100 mb-4">新增功能:CSV上傳與自動分析</p>
                        <ul class="text-blue-100 space-y-2">
                            <li>✅ 支持上傳多個月份的CSV文件</li>
                            <li>✅ 自動分析並整合交易數據</li>
                            <li>✅ 月度對比與趨勢分析</li>
                            <li>✅ 數據自動保存在瀏覽器中</li>
                        </ul>
                    </div>
                </div>
            `;
            document.getElementById('mainContent').innerHTML = content;
        }

        // ========== 數據持久化 ==========
        function loadData() {
            const saved = localStorage.getItem('tradingAppData');
            if (saved) {
                const parsed = JSON.parse(saved);
                appData = parsed;
                
                // 恢復Set對象
                Object.keys(appData.monthlyData).forEach(month => {
                    if (appData.monthlyData[month].stocks && Array.isArray(appData.monthlyData[month].stocks)) {
                        appData.monthlyData[month].stocks = new Set(appData.monthlyData[month].stocks);
                    }
                });
            }
        }

        function saveData() {
            const dataToSave = JSON.parse(JSON.stringify(appData));
            
            // 將Set轉換為Array以便JSON序列化
            Object.keys(dataToSave.monthlyData).forEach(month => {
                if (dataToSave.monthlyData[month].stocks instanceof Set) {
                    dataToSave.monthlyData[month].stocks = Array.from(dataToSave.monthlyData[month].stocks);
                }
            });
            
            localStorage.setItem('tradingAppData', JSON.stringify(dataToSave));
        }

        function exportData() {
            const dataToExport = JSON.parse(JSON.stringify(appData));
            
            // 將Set轉換為Array
            Object.keys(dataToExport.monthlyData).forEach(month => {
                if (dataToExport.monthlyData[month].stocks instanceof Set) {
                    dataToExport.monthlyData[month].stocks = Array.from(dataToExport.monthlyData[month].stocks);
                }
            });
            
            const dataStr = JSON.stringify(dataToExport, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'trading_data_backup_' + new Date().toISOString().split('T')[0] + '.json';
            link.click();
            alert('數據已匯出!');
        }

        function clearData() {
            if (confirm('確定要清除所有數據嗎?此操作無法恢復!')) {
                localStorage.removeItem('tradingAppData');
                location.reload();
            }
        }

        // ========== 初始化 ==========
        loadData();
        switchModule('dashboard');
    </script>
</body>
</html>
