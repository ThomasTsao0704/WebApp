<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>歷史匯率計算機</title>
  <link rel="manifest" href="manifest.json">
  <style>
    @import url(//fonts.googleapis.com/css?family=Montserrat:9000);

    *:before,
    *:after {
      box-sizing: border-box;
      padding: 0;
      margin: 0;
    }

    body {
      font-family: Arial, "Hiragino Kaku Gothic Pro W3", Meiryo, sans-serif;
      background-color: #fff;
      color: #999;
      text-align: center;
    }

    body a,
    body a:visited {
      color: #999;
      text-decoration: none;
    }

    body a:hover {
      color: #777;
    }

    h1 {
      font-size: 36px;
      font-family: "Montserrat", sans-serif;
      color: #53E2E4;
      margin: 10px auto 30px;
    }

    .filter-controls {
      text-align: center;
      margin-bottom: 30px;
    }

    .filter-controls .control {
      display: inline-block;
      width: 240px;
      margin: 0 10px;
    }

    .filter-controls .control * {
      box-sizing: border-box;
    }

    .filter-controls .control .form-control {
      width: 100%;
      height: 40px;
      padding: 0 20px;
      border: 2px solid #ccc;
      border-radius: 3px;
      background-color: #fff;
      color: #666;
      font-size: 16px;
      cursor: pointer;
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    .filter-controls .control .form-control:focus {
      outline: 0;
      border-color: #0CAAF5;
    }

    .grid {
      position: relative;
      width: 878px;
      max-width: 100%;
      margin: 0 auto;
    }

    .item {
      position: absolute;
      width: 99px;
      height: 99px;
      margin: 5px;
      z-index: 1;
      transition: transform 0.6s ease;
      cursor: move;
    }

    .item.blue .custom-content {
      border-color: #0CAAF5;
      color: #0CAAF5;
    }

    .item.red .custom-content {
      border-color: #F54487;
      color: #F54487;
    }

    .item.green .custom-content {
      border-color: #00DE73;
      color: #00DE73;
    }

    .item.w2 {
      width: 208px;
    }

    .item.h2 {
      height: 208px;
    }

    .item-content {
      position: relative;
      width: 100%;
      height: 100%;
      display: table;
    }

    .custom-content {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
      background: #fff;
      color: #666;
      border: 2px solid;
      border-radius: 3px;
    }

    .item.muuri-item-dragging {
      z-index: 3;
      transition: none;
    }

    .item.muuri-item-releasing {
      z-index: 2;
    }

    @media (max-width: 877px) {
      .item {
        width: calc(33.33% - 11px);
        height: calc(33.33vw - 11px);
      }

      .item.w2 {
        width: calc(33.33% - 11px);
      }

      .item.h2 {
        height: calc(33.33vw - 11px);
      }
    }

    @media (max-width: 640px) {
      .item {
        width: calc(50% - 10px);
        height: calc(50vw - 10px);
      }

      .item.w2 {
        width: calc(50% - 10px);
      }

      .item.h2 {
        height: calc(50vw - 10px);
      }
    }
  </style>
</head>

<body>
  <h1>Grid Layout by Muuri.js</h1>

  <section class="grid-wrapper">
    <div class="filter-controls">
      <div class="control">Search
        <input class="search-field form-control" type="text" name="search" placeholder="Enter the fruit name">
      </div>
      <div class="control">Filter
        <select class="filter-field form-control">
          <option value="">None</option>
          <option value="red">Red</option>
          <option value="blue">Blue</option>
          <option value="green">Green</option>
        </select>
      </div>
      <div class="control">Sort
        <select class="sort-field form-control">
          <option value="order">None</option>
          <option value="title">Order by fruit name</option>
          <option value="color">Order by color name</option>
        </select>
      </div>
    </div>

    <div class="grid">
      <!-- Items will be injected from items.csv -->
    </div>


    <script>
      document.addEventListener('DOMContentLoaded', function () {
        var grid = null,
          wrapper = document.querySelector('.grid-wrapper'),
          searchField = wrapper.querySelector('.search-field'),
          filterField = wrapper.querySelector('.filter-field'),
          sortField = wrapper.querySelector('.sort-field'),
          gridElem = wrapper.querySelector('.grid'),
          searchAttr = 'data-title',
          filterAttr = 'data-color',
          searchFieldValue,
          filterFieldValue,
          sortFieldValue,
          dragOrder = [];

        function parseCSV(text) {
          var lines = text.split(/\r?\n/).filter(function (line) {
            return line.trim().length > 0;
          });
          if (!lines.length) {
            return [];
          }

          var headers = lines.shift().split(',').map(function (header) {
            return header.trim();
          });

          return lines.map(function (line) {
            var values = line.split(',');
            var row = {};
            headers.forEach(function (header, index) {
              row[header] = (values[index] || '').trim();
            });
            return row;
          });
        }

        function createItem(row) {
          var item = document.createElement('div');
          item.classList.add('item');
          if (row.Color) {
            item.classList.add(row.Color);
            item.setAttribute('data-color', row.Color);
          }
          if (row.Width) {
            item.classList.add(row.Width);
          }
          if (row.Height) {
            item.classList.add(row.Height);
          }
          if (row.Title) {
            item.setAttribute('data-title', row.Title);
          }

          var itemContent = document.createElement('div');
          itemContent.className = 'item-content';

          var customContent = document.createElement('div');
          customContent.className = 'custom-content';
          if (row.Item) {
            customContent.appendChild(document.createTextNode(row.Item));
          }

          if (row.Title) {
            customContent.appendChild(document.createElement('br'));
            customContent.appendChild(document.createTextNode('(' + row.Title + ')'));
          }

          itemContent.appendChild(customContent);
          item.appendChild(itemContent);

          return item;
        }

        function loadItems() {
          return fetch('items.csv')
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Failed to load items.csv');
              }
              return response.text();
            })
            .then(function (text) {
              var rows = parseCSV(text);
              gridElem.innerHTML = '';
              rows.forEach(function (row) {
                gridElem.appendChild(createItem(row));
              });
            });
        }

        loadItems().then(function () {
          // Init the grid layout after items are rendered.
          grid = new Muuri(gridElem, {
            dragEnabled: true
          });

          // Set initial search query, active filter, active sort value and active layout.
          searchFieldValue = searchField.value.toLowerCase();
          filterFieldValue = filterField.value;
          sortFieldValue = sortField.value;

          // Search field event binding
          searchField.addEventListener('keyup', function () {
            var newSearch = searchField.value.toLowerCase();
            if (searchFieldValue !== newSearch) {
              searchFieldValue = newSearch;
              filter();
            }
          });

          // Filter field event binding
          filterField.addEventListener('change', filter);

          // Sort field event binding
          sortField.addEventListener('change', sort);

        // Filtering
          function filter() {
            filterFieldValue = filterField.value;
            grid.filter(function (item) {
              var element = item.getElement(),
                isSearchMatch = !searchFieldValue ? true : (element.getAttribute(searchAttr) || '').toLowerCase().indexOf(searchFieldValue) > -1,
                isFilterMatch = !filterFieldValue ? true : (element.getAttribute(filterAttr) || '') === filterFieldValue;
              return isSearchMatch && isFilterMatch;
            });
          }

        // Sorting
          function sort() {
            // Do nothing if sort value did not change.
            var currentSort = sortField.value;
            if (sortFieldValue === currentSort) {
              return;
            }

            // If we are changing from "order" sorting to something else
            // let's store the drag order.
            if (sortFieldValue === 'order') {
              dragOrder = grid.getItems();
            }

            // Sort the items.
            grid.sort(
              currentSort === 'title' ? compareItemTitle :
                currentSort === 'color' ? compareItemColor :
                  dragOrder
            );
            sortFieldValue = currentSort;
          }

        // Compare data-title
          function compareItemTitle(a, b) {
            var aVal = a.getElement().getAttribute(searchAttr) || '';
            var bVal = b.getElement().getAttribute(searchAttr) || '';
            return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;

          }

        // Compare data-color
          function compareItemColor(a, b) {
            var aVal = a.getElement().getAttribute(filterAttr) || '';
            var bVal = b.getElement().getAttribute(filterAttr) || '';
            return aVal < bVal ? -1 : aVal > bVal ? 1 : compareItemTitle(a, b);
          }
        }).catch(function (error) {
          console.error(error);
        });
      });</script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/web-animations/2.3.1/web-animations.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/muuri/0.5.4/muuri.min.js"></script>
    </body>

</html>
