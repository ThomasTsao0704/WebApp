<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Thomas 日本大阪旅遊行程規劃 - 可離線使用的旅遊助手">
    <meta name="keywords" content="大阪,日本,旅遊,行程規劃,PWA,離線">
    <meta name="author" content="Thomas">
    <meta name="theme-color" content="#1A2A4E">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="大阪旅遊">
    
    <title>Thomas Japan Travel - 大阪旅遊助手</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🇯🇵</text></svg>">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="header-content">
            <h1>🇯🇵 Thomas 大阪之旅</h1>
            <div class="header-subtitle">完整旅遊助手 · 可離線使用</div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="root">
        <div class="loading-container">
            <div class="spinner"></div>
            <p>載入旅遊資料中...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
            <p>© 2024 Thomas Japan Travel</p>
            <p class="footer-links">
                <a href="https://github.com" target="_blank" rel="noopener">GitHub</a>
                <span>·</span>
                <a href="#" id="install-btn" style="display:none;">安裝 APP</a>
            </p>
        </div>
    </footer>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- App Script -->
    <script src="app.js"></script>
    
    <!-- PWA Registration -->
    <script>
        // Service Worker 註冊
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker 註冊成功:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Service Worker 註冊失敗:', error);
                    });
            });
        }

        // PWA 安裝提示
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) {
                installBtn.style.display = 'inline';
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    console.log(`User response: ${outcome}`);
                    deferredPrompt = null;
                } else {
                    alert('請使用瀏覽器的"加入主畫面"功能來安裝此應用程式');
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            console.log('✅ PWA 已安裝');
            deferredPrompt = null;
        });
    </script>
</body>
</html>
