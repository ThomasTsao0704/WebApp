<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>沉澱 · 清空腦袋</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300;1,6..72,400&family=Space+Mono:wght@400&display=swap" rel="stylesheet" />
<style>
  :root{
    --abyss:#0e1517;      /* 最深的靜水 */
    --deep:#16232a;       /* 水面上緣的微光 */
    --ink:#e9e5d9;        /* 暖白的墨 */
    --mist:#6f8083;       /* 霧一般的次要文字 */
    --foam:#a6c4bf;       /* 極低彩度的海沫綠，只用在微光與微粒 */
    --faint:rgba(233,229,217,.14);
    --hair:rgba(233,229,217,.09);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(120% 90% at 50% -10%, var(--deep) 0%, var(--abyss) 55%, #0b1113 100%);
    color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }

  /* 中央緩慢呼吸的微光，讓空白也有生命 */
  .ambient{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(38% 46% at 50% 46%, rgba(166,196,191,.10), rgba(166,196,191,0) 70%);
    opacity:.7;
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{opacity:.55; transform:scale(1)}
    50%{opacity:.85; transform:scale(1.05)}
  }

  .stage{
    position:relative; z-index:2;
    width:100%;
    max-width:640px;
    padding:clamp(28px,6vw,64px) clamp(22px,5vw,40px);
    display:flex;
    flex-direction:column;
  }

  #pad{
    width:100%;
    min-height:44dvh;
    background:transparent;
    border:0; outline:0; resize:none;
    color:var(--ink);
    caret-color:var(--foam);
    font-family:inherit;
    font-weight:400;
    font-size:clamp(1.06rem,1rem + 1vw,1.35rem);
    line-height:1.95;
    letter-spacing:.005em;
    overflow:hidden;
    transition:opacity .5s ease;
  }
  #pad::placeholder{
    color:var(--mist);
    font-style:italic;
    opacity:.85;
  }
  #pad.dissolving{opacity:0; transition:opacity .28s ease}

  .bar{
    margin-top:clamp(20px,4vw,34px);
    padding-top:16px;
    border-top:1px solid var(--hair);
    display:flex; align-items:center; justify-content:space-between; gap:16px;
  }
  .count{
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:.72rem; letter-spacing:.14em;
    color:var(--mist);
    font-variant-numeric:tabular-nums;
    transition:color .4s ease;
  }
  .count.ready{color:var(--foam)}

  .release{
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:.82rem; letter-spacing:.42em; text-indent:.42em;
    color:var(--mist);
    background:transparent;
    border:1px solid var(--faint);
    border-radius:999px;
    padding:.62em 1.5em .62em 1.5em;
    cursor:pointer;
    transition:color .35s ease,border-color .35s ease,box-shadow .35s ease,opacity .45s ease,transform .35s ease;
    opacity:.35; pointer-events:none;
  }
  .release.live{opacity:1; pointer-events:auto; color:var(--ink)}
  .release.live:hover{
    border-color:rgba(166,196,191,.55);
    color:#fff;
    box-shadow:0 0 0 1px rgba(166,196,191,.12), 0 0 34px -8px rgba(166,196,191,.5);
  }
  .release:focus-visible{
    outline:none;
    border-color:var(--foam);
    box-shadow:0 0 0 2px rgba(166,196,191,.35);
  }
  .release:active{transform:translateY(1px)}

  .hint{
    margin:22px 0 0;
    text-align:center;
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:.66rem; letter-spacing:.26em;
    color:var(--faint); color:rgba(233,229,217,.28);
    transition:opacity .5s ease;
  }
  @media (max-width:560px){ .hint{display:none} }

  /* 釋放後浮上水面的一句話 */
  .whisper{
    position:fixed; left:0; right:0; top:50%; z-index:6;
    transform:translateY(-50%);
    text-align:center; pointer-events:none;
    font-style:italic; font-weight:300;
    font-size:clamp(1.3rem,4vw,1.9rem);
    letter-spacing:.06em;
    color:var(--foam);
    opacity:0;
  }
  .whisper.show{animation:surface 2.6s ease forwards}
  @keyframes surface{
    0%{opacity:0; transform:translateY(-46%) scale(.98); filter:blur(4px)}
    26%{opacity:.9; transform:translateY(-50%) scale(1); filter:blur(0)}
    72%{opacity:.9}
    100%{opacity:0; transform:translateY(-54%) scale(1.01); filter:blur(2px)}
  }

  /* 微粒畫布：覆蓋全螢幕，只負責溶解動畫 */
  #fx{
    position:fixed; inset:0; z-index:5;
    width:100vw; height:100dvh;
    pointer-events:none;
  }

  @media (prefers-reduced-motion:reduce){
    .ambient{animation:none; opacity:.6}
    .whisper.show{animation-duration:2.6s}
  }
</style>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="stage">
    <textarea id="pad"
      placeholder="想到什麼，就往這裡放……"
      autocomplete="off" autocapitalize="off" spellcheck="false"
      aria-label="把腦中的思緒寫在這裡"></textarea>

    <div class="bar">
      <span class="count" id="count" aria-live="polite">0 字</span>
      <button class="release" id="release" type="button" aria-label="沉澱並釋放這些文字">沉澱</button>
    </div>

    <p class="hint" id="hint"></p>
  </main>

  <p class="whisper" id="whisper" aria-hidden="true"></p>

<script>
(() => {
  const pad     = document.getElementById('pad');
  const count   = document.getElementById('count');
  const release = document.getElementById('release');
  const hint    = document.getElementById('hint');
  const whisper = document.getElementById('whisper');
  const canvas  = document.getElementById('fx');
  const ctx     = canvas.getContext('2d');

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform || navigator.userAgent);
  hint.textContent = (isMac ? '⌘' : 'Ctrl') + ' + Enter　釋放';

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let busy = false;

  function sizeCanvas(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
  }
  sizeCanvas();
  addEventListener('resize', () => { if (!busy) sizeCanvas(); });

  // 自動長高 + 字數 + 按鈕狀態
  function refresh(){
    pad.style.height = 'auto';
    pad.style.height = pad.scrollHeight + 'px';
    const n = Array.from(pad.value.trim()).length;
    count.textContent = n + ' 字';
    count.classList.toggle('ready', n > 0);
    release.classList.toggle('live', n > 0 && !busy);
  }
  pad.addEventListener('input', refresh);

  addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter'){
      e.preventDefault();
      startRelease();
    }
  });
  release.addEventListener('click', startRelease);

  function showWhisper(text){
    whisper.textContent = text;
    whisper.classList.remove('show');
    void whisper.offsetWidth;      // 重播動畫
    whisper.classList.add('show');
  }

  function finish(){
    pad.value = '';
    pad.classList.remove('dissolving');
    refresh();
    busy = false;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    showWhisper('放下了');
    pad.focus();
  }

  function startRelease(){
    if (busy) return;
    if (Array.from(pad.value.trim()).length === 0) return;
    busy = true;
    release.classList.remove('live');

    if (reduceMotion){
      pad.classList.add('dissolving');
      setTimeout(finish, 380);
      return;
    }
    dissolve();
  }

  // 以逗點分行、逐字換行（適合中英文混排），把 textarea 的文字繪到畫布上
  function wrapLines(c, text, maxWidth){
    const lines = [];
    for (const para of text.split('\n')){
      if (para === ''){ lines.push(''); continue; }
      let line = '';
      for (const ch of para){
        const test = line + ch;
        if (line !== '' && c.measureText(test).width > maxWidth){
          lines.push(line);
          line = ch;
        } else {
          line = test;
        }
      }
      lines.push(line);
    }
    return lines;
  }

  async function dissolve(){
    if (document.fonts && document.fonts.ready) { try { await document.fonts.ready; } catch(_){} }

    const cs   = getComputedStyle(pad);
    const rect = pad.getBoundingClientRect();
    const padL = parseFloat(cs.paddingLeft)  || 0;
    const padT = parseFloat(cs.paddingTop)   || 0;
    const padR = parseFloat(cs.paddingRight) || 0;
    const fontSize = parseFloat(cs.fontSize);
    let lineH = parseFloat(cs.lineHeight);
    if (!lineH || Number.isNaN(lineH)) lineH = fontSize * 1.95;

    const maxWidth = pad.clientWidth - padL - padR;
    const startX = rect.left + padL;
    const startY = rect.top  + padT;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.textBaseline = 'top';
    ctx.font = `${cs.fontStyle} ${cs.fontWeight} ${fontSize}px ${cs.fontFamily}`;
    ctx.fillStyle = '#e9e5d9';

    const lines = wrapLines(ctx, pad.value.replace(/\s+$/,''), maxWidth);
    lines.forEach((ln, i) => { if (ln) ctx.fillText(ln, startX, startY + i * lineH); });

    // 讓覆蓋在畫布下的真文字先淡出
    pad.classList.add('dissolving');

    // 取樣像素 → 微粒
    const W = canvas.width, H = canvas.height;
    let img;
    try { img = ctx.getImageData(0, 0, W, H); }
    catch(_){ pad.classList.remove('dissolving'); pad.style.opacity=''; finish(); return; }
    const data = img.data;

    const step = Math.max(2, Math.round(2.1 * dpr));
    const particles = [];
    let sx = 0, sy = 0, cnt = 0;
    for (let y = 0; y < H; y += step){
      for (let x = 0; x < W; x += step){
        const a = data[(y * W + x) * 4 + 3];
        if (a > 90){
          const px = x / dpr, py = y / dpr;
          particles.push({ px, py, a: a / 255 });
          sx += px; sy += py; cnt++;
        }
      }
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (cnt === 0){ pad.classList.remove('dissolving'); finish(); return; }

    const cx = sx / cnt, cy = sy / cnt;   // 文字重心，用來讓微粒向外綻開
    const HOLD = 0.34, SPREAD = 1.05;

    for (const p of particles){
      let dx = p.px - cx, dy = p.py - cy;
      const d = Math.hypot(dx, dy) || 1;
      const bloom = 12 + Math.random() * 22;
      p.vx = (Math.random() - 0.5) * 46 + (dx / d) * bloom;
      p.vy = -(18 + Math.random() * 40) + (dy / d) * bloom * 0.4;
      p.ay = -9 - Math.random() * 12;                 // 緩緩加速上浮
      p.delay = HOLD + Math.random() * SPREAD + p.py * 0.00035;
      p.life = 1.7 + Math.random() * 0.9;
      p.swayA = 3 + Math.random() * 9;
      p.swayF = (0.5 + Math.random() * 0.9) * Math.PI * 2;
      p.phase = Math.random() * Math.PI * 2;
      p.size = 1.15 + Math.random() * 0.75;
      p.foam = Math.random() < 0.09;
      p.base = p.a * 0.92;
    }

    const t0 = performance.now();
    const END = HOLD + SPREAD + 2.7;

    function frame(now){
      const t = (now - t0) / 1000;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of particles){
        const lt = t - p.delay;
        if (lt < 0){
          ctx.globalAlpha = p.base;
          ctx.fillStyle = '#e9e5d9';
          ctx.fillRect(p.px, p.py, p.size, p.size);
          continue;
        }
        const prog = lt / p.life;
        if (prog >= 1) continue;

        const x = p.px + p.vx * lt + Math.sin(t * p.swayF + p.phase) * p.swayA * prog;
        const y = p.py + p.vy * lt + 0.5 * p.ay * lt * lt;
        const alpha = p.base * Math.pow(1 - prog, 1.5);
        const s = p.size * (1 + prog * 0.6);

        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.foam ? '#a6c4bf' : '#e9e5d9';
        ctx.fillRect(x, y, s, s);
      }
      ctx.globalAlpha = 1;

      if (t < END) requestAnimationFrame(frame);
      else finish();
    }
    requestAnimationFrame(frame);
  }

  refresh();
  // 進站時輕輕聚焦
  setTimeout(() => pad.focus(), 120);
})();
</script>
</body>
</html>
