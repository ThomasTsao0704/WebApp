<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>隔日多空評估系統 · TWSE</title>
<style>
:root{
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;
  --bg:#f1f5f9;--surface:#fff;--border:#e2e8f0;
  --g:#059669;--g2:#d1fae5;--g3:#ecfdf5;
  --r:#dc2626;--r2:#fecaca;--r3:#fef2f2;
  --b:#2563eb;--b2:#bfdbfe;--b3:#eff6ff;
  --am:#d97706;--am2:#fde68a;--am3:#fffbeb;
  --rad:8px;--sh:0 1px 4px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;}

/* ── HEADER ── */
.hdr{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
.hdr-ico{font-size:26px;}
.hdr-info h1{font-size:1.1rem;font-weight:700;}
.hdr-info p{font-size:11px;color:#94a3b8;margin-top:1px;}
.hdr-chips{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.ch-b{background:#1d4ed8;color:#bfdbfe;}
.ch-g{background:#065f46;color:#6ee7b7;}
.ch-r{background:#991b1b;color:#fca5a5;}
.ch-am{background:#92400e;color:#fde68a;}
.meta{background:#1e293b;font-size:11px;color:#64748b;padding:4px 28px;}

/* ── KPI ── */
.kpi-row{display:flex;gap:10px;padding:12px 28px;overflow-x:auto;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--rad);padding:11px 15px;min-width:148px;flex-shrink:0;box-shadow:var(--sh);}
.kpi .kl{font-size:10px;color:var(--ink3);font-weight:500;margin-bottom:3px;}
.kpi .kv{font-size:1.35rem;font-weight:800;letter-spacing:-.5px;line-height:1;}
.kpi .ks{font-size:10px;color:var(--ink4);margin-top:2px;}
.kc-g{color:var(--g);} .kc-r{color:var(--r);} .kc-b{color:var(--b);} .kc-am{color:var(--am);}

/* ── TOOLBAR ── */
.toolbar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 28px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:30;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.toolbar input,.toolbar select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--b);}
#qS{width:170px;}
.tab-g{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.tab{padding:5px 11px;background:#fff;border:none;font-size:12px;cursor:pointer;color:var(--ink3);font-weight:500;}
.tab.on-all{background:var(--b);color:#fff;}
.tab.on-long{background:var(--g);color:#fff;}
.tab.on-short{background:var(--r);color:#fff;}
.tab.on-warn{background:var(--am);color:#fff;}
.btn{padding:5px 13px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;}
.btn:hover{opacity:.83;}
.btn-blue{background:var(--b);color:#fff;}
.right{margin-left:auto;display:flex;gap:8px;align-items:center;}
.st{font-size:11px;color:var(--ink3);}

/* ── TOP RANKINGS ── */
.rank-wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);margin-bottom:1px;}
@media(max-width:900px){.rank-wrap{grid-template-columns:1fr;}}
.rank-col{background:var(--surface);}
.rank-hd{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border);}
.rank-hd h2{font-size:12px;font-weight:700;flex:1;}
.rank-list{display:flex;flex-direction:column;}
.rank-row{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .1s;}
.rank-row:hover{background:var(--bg);}
.rno{width:20px;height:20px;border-radius:50%;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rno-g{background:var(--g2);color:#065f46;}
.rno-r{background:var(--r2);color:#991b1b;}
.rno-gold{background:var(--g);color:#fff;}
.rno-red0{background:var(--r);color:#fff;}
.r-info{flex:1;min-width:0;}
.r-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.r-code{font-size:10px;color:var(--ink4);font-family:monospace;}
.r-score-wrap{display:flex;align-items:center;gap:6px;}
.score-num{font-size:14px;font-weight:800;min-width:30px;text-align:right;}
.r-signals{display:flex;gap:3px;flex-wrap:wrap;}
.sig-ico{font-size:12px;cursor:default;}

/* ── MAIN TABLE ── */
.tbl-wrap{background:var(--surface);overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{padding:8px 10px;background:#f8fafc;border-bottom:2px solid var(--border);color:var(--ink3);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:2;}
thead th:hover{background:#f1f5f9;}
thead th.asc::after{content:" ▲";font-size:9px;}
thead th.desc::after{content:" ▼";font-size:9px;}
tbody tr{border-bottom:1px solid #f8fafc;cursor:pointer;transition:background .1s;}
tbody tr:hover{background:#f8fafc;}
tbody tr.sel{background:var(--b3)!important;}
td{padding:7px 10px;white-space:nowrap;}
td.cd{font-family:monospace;font-weight:700;color:var(--b);font-size:11px;}
td.nm{font-weight:600;max-width:80px;overflow:hidden;text-overflow:ellipsis;}
td.nr{text-align:right;font-variant-numeric:tabular-nums;}

/* score cell */
.sc-cell{display:flex;align-items:center;gap:5px;}
.sc-bar-w{width:40px;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;flex-shrink:0;}
.sc-bar{height:100%;border-radius:3px;}
.sc-num{font-weight:800;min-width:24px;text-align:right;}

/* grade badge */
.gb{display:inline-block;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:700;white-space:nowrap;}
.gb-b3{background:var(--g);color:#fff;}
.gb-b2{background:var(--g2);color:#065f46;}
.gb-b1{background:#d1fae5;color:#047857;}
.gb-n {background:#f1f5f9;color:var(--ink3);}
.gb-s1{background:#fde8e8;color:#b91c1c;}
.gb-s2{background:var(--r2);color:#991b1b;}
.gb-s3{background:var(--r);color:#fff;}

/* mini signal bar */
.sig-row{display:flex;gap:3px;flex-wrap:nowrap;}

/* pct cell */
.up{color:var(--g);font-weight:700;}
.dn{color:var(--r);font-weight:700;}
.fl{color:var(--ink3);}
.warn-row{background:#fffbeb!important;}
.warn-row:hover{background:#fef3c7!important;}

/* ── DETAIL MODAL ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:center;justify-content:center;}
.modal-bg.show{display:flex;}
.modal{background:var(--surface);border-radius:12px;width:min(680px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.25);}
.modal-hdr{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:#fff;padding:16px 20px;border-radius:12px 12px 0 0;display:flex;align-items:flex-start;gap:12px;}
.modal-hdr .mcode{font-family:monospace;font-size:11px;color:#60a5fa;font-weight:700;}
.modal-hdr h2{font-size:1.1rem;font-weight:700;margin:2px 0 4px;}
.modal-hdr .msub{font-size:11px;color:#94a3b8;}
.modal-close{margin-left:auto;background:rgba(255,255,255,.1);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:16px 20px;}

/* grade gauge */
.gauge-wrap{display:flex;align-items:center;gap:14px;background:var(--bg);border-radius:var(--rad);padding:14px;margin-bottom:14px;}
.gauge-circle{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;border:3px solid;}
.gauge-circle .g-num{font-size:1.6rem;line-height:1;}
.gauge-circle .g-max{font-size:9px;opacity:.7;}
.gauge-info h3{font-size:1rem;font-weight:700;margin-bottom:4px;}
.gauge-info p{font-size:12px;color:var(--ink2);line-height:1.6;}

/* signal breakdown */
.sig-sect{margin-bottom:14px;}
.sig-sect h4{font-size:11px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.sig-item{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #f8fafc;}
.sig-item:last-child{border:none;}
.sig-item .s-ico{font-size:14px;width:20px;flex-shrink:0;text-align:center;}
.sig-item .s-txt{flex:1;font-size:12px;color:var(--ink2);}
.sig-item .s-pt{font-size:12px;font-weight:700;min-width:36px;text-align:right;}
.s-bar-w{width:60px;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;}
.s-bar{height:100%;border-radius:3px;}

/* metrics grid */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.m-card{background:var(--bg);border-radius:6px;padding:10px 12px;border:1px solid var(--border);}
.m-card .ml{font-size:10px;color:var(--ink4);margin-bottom:3px;}
.m-card .mv{font-size:1.05rem;font-weight:700;}
.m-card .ms{font-size:10px;margin-top:2px;}

/* advice box */
.advice{border-radius:var(--rad);padding:12px 16px;margin-bottom:8px;}
.advice h4{font-size:12px;font-weight:700;margin-bottom:6px;}
.advice p{font-size:12px;line-height:1.65;color:var(--ink2);}
.adv-bull{background:var(--g3);border-left:4px solid var(--g);}
.adv-bear{background:var(--r3);border-left:4px solid var(--r);}
.adv-neut{background:var(--b3);border-left:4px solid var(--b);}
.adv-warn{background:var(--am3);border-left:4px solid var(--am);}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--ink3);}
.spin{width:30px;height:30px;border:3px solid var(--border);border-top-color:var(--b);border-radius:50%;animation:spin .7s linear infinite;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-ico">⚡</div>
  <div class="hdr-info">
    <h1>隔日多空評估系統</h1>
    <p>處置股票 × 融資融券 × 日成交 · 三源合一評分</p>
  </div>
  <div class="hdr-chips">
    <span class="chip ch-b">punish</span>
    <span class="chip ch-b">MI_MARGN</span>
    <span class="chip ch-b">STOCK_DAY_ALL</span>
    <span class="chip ch-g" id="chipLong">做多候選 —</span>
    <span class="chip ch-r" id="chipShort">做空候選 —</span>
    <span class="chip ch-am" id="chipWarn">⚠ 處置中 —</span>
  </div>
</div>
<div class="meta" id="metaLine">載入中…</div>

<div class="kpi-row">
  <div class="kpi"><div class="kl">分析日期</div><div class="kv kc-b" id="k-date">—</div><div class="ks">最新資料日</div></div>
  <div class="kpi"><div class="kl">分析股票數</div><div class="kv" id="k-n">—</div><div class="ks">上市個股</div></div>
  <div class="kpi"><div class="kl">⭐ 強烈做多</div><div class="kv kc-g" id="k-b3">—</div><div class="ks">評分 ≥ 6</div></div>
  <div class="kpi"><div class="kl">✅ 偏多</div><div class="kv kc-g" id="k-b2">—</div><div class="ks">評分 3~5</div></div>
  <div class="kpi"><div class="kl">❌ 偏空</div><div class="kv kc-r" id="k-s2">—</div><div class="ks">評分 -3~-5</div></div>
  <div class="kpi"><div class="kl">⛔ 強烈做空</div><div class="kv kc-r" id="k-s3">—</div><div class="ks">評分 ≤ -6</div></div>
  <div class="kpi"><div class="kl">🚨 處置中</div><div class="kv kc-am" id="k-warn">—</div><div class="ks">避免操作</div></div>
  <div class="kpi"><div class="kl">市場多空比</div><div class="kv" id="k-ratio">—</div><div class="ks">做多 / 做空 公司數</div></div>
</div>

<div class="toolbar">
  <input id="qS" type="text" placeholder="代號 / 公司名稱"/>
  <select id="selSort">
    <option value="score-d">評分 高→低</option>
    <option value="score-a">評分 低→高</option>
    <option value="chg-d">漲跌幅 高→低</option>
    <option value="vol-d">成交量 高→低</option>
    <option value="mchg-d">融資增幅 高→低</option>
    <option value="schg-d">融券增幅 高→低</option>
  </select>
  <div class="tab-g">
    <button class="tab on-all"  id="tabAll"   onclick="setTab('all')">全部</button>
    <button class="tab"         id="tabLong"  onclick="setTab('long')">📈 做多</button>
    <button class="tab"         id="tabShort" onclick="setTab('short')">📉 做空</button>
    <button class="tab"         id="tabWarn"  onclick="setTab('warn')">🚨 處置</button>
  </div>
  <div class="right">
    <span class="st" id="stTxt"></span>
    <button class="btn btn-blue" id="refreshBtn">↻ 更新</button>
  </div>
</div>

<!-- Top Rankings -->
<div class="rank-wrap" id="rankWrap"></div>

<!-- Full Table -->
<div class="tbl-wrap">
  <div id="tblArea"><div class="loading"><div class="spin"></div>載入資料中，請稍候…</div></div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" id="modalBox"></div>
</div>

<script>
const W = "https://cors-proxy.s01yg3642.workers.dev/";
const APIs = {
  punish : "https://openapi.twse.com.tw/v1/announcement/punish",
  margn  : "https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN",
  stock  : "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
};

let analyzed = [], curTab = 'all', sortK = 'score-d', selIdx = -1;

/* ── helpers ── */
const pn  = s => parseFloat(String(s??'').replace(/,/g,''))||0;
const pi  = s => parseInt(String(s??'').replace(/,/g,''))||0;
const pct = (n,d=2) => (n>=0?'+':'')+n.toFixed(d)+'%';
const rocToStr = s => {
  const str=String(s||'');
  if(str.length===7) return `${parseInt(str.slice(0,3))+1911}/${str.slice(3,5)}/${str.slice(5,7)}`;
  return s;
};
const fmt = n => {
  const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(1)+'B';
  if(a>=1e6) return (n/1e6).toFixed(1)+'M';
  if(a>=1e3) return (n/1e3).toFixed(0)+'K';
  return n.toLocaleString();
};

/* ── SCORING ── */
function scoreStock(s, m, punishRec){
  let score = 0;
  const signals = [];

  const open  = pn(s.OpeningPrice), high = pn(s.HighestPrice);
  const low   = pn(s.LowestPrice),  close= pn(s.ClosingPrice);
  const change= pn(s.Change);
  const range = high - low;
  const chgPct= (open>0 && range>0) ? (close-open)/open*100 : 0;

  /* 1. K線型態 */
  if(close > open){
    if(chgPct>=6)     {score+=4; signals.push({cat:'K線',ico:'🔥',txt:`大陽線 +${chgPct.toFixed(1)}%`,pt:+4});}
    else if(chgPct>=3){score+=3; signals.push({cat:'K線',ico:'📈',txt:`陽線 +${chgPct.toFixed(1)}%`,pt:+3});}
    else if(chgPct>=1){score+=2; signals.push({cat:'K線',ico:'↑' ,txt:`小陽線 +${chgPct.toFixed(1)}%`,pt:+2});}
    else              {score+=1; signals.push({cat:'K線',ico:'↑' ,txt:`微漲 +${chgPct.toFixed(1)}%`,pt:+1});}
  } else if(close < open){
    if(chgPct<=-6)    {score-=4; signals.push({cat:'K線',ico:'💥',txt:`大陰線 ${chgPct.toFixed(1)}%`,pt:-4});}
    else if(chgPct<=-3){score-=3;signals.push({cat:'K線',ico:'📉',txt:`陰線 ${chgPct.toFixed(1)}%`,pt:-3});}
    else if(chgPct<=-1){score-=2;signals.push({cat:'K線',ico:'↓' ,txt:`小陰線 ${chgPct.toFixed(1)}%`,pt:-2});}
    else               {score-=1;signals.push({cat:'K線',ico:'↓' ,txt:`微跌 ${chgPct.toFixed(1)}%`,pt:-1});}
  }

  /* 影線分析 */
  if(range > 0){
    const lower  = close - low;   // 下影線
    const upper  = high - close;  // 上影線
    const lRatio = lower/range;
    const uRatio = upper/range;
    if(lRatio > 0.55 && lower > pn(s.ClosingPrice)*0.01){
      score+=1; signals.push({cat:'K線',ico:'⬇️',txt:`長下影線（支撐強，回測後反彈）`,pt:+1});
    }
    if(uRatio > 0.55 && upper > pn(s.ClosingPrice)*0.01){
      score-=1; signals.push({cat:'K線',ico:'⬆️',txt:`長上影線（賣壓重，上方阻力大）`,pt:-1});
    }
  }

  /* 2. 融資訊號 */
  if(m){
    const mT = pi(m['融資今日餘額']), mP = pi(m['融資前日餘額']);
    const sT = pi(m['融券今日餘額']), sP = pi(m['融券前日餘額']);
    const sL = pi(m['融券限額'])||1;
    const mB = pi(m['融資買進']), mS = pi(m['融資賣出']);
    const sB = pi(m['融券買進']), sSell = pi(m['融券賣出']);
    const sRate = sL>0 ? sT/sL*100 : 0;

    const mChg = mP>0 ? (mT-mP)/mP*100 : 0;
    if(mP>0){
      if(mChg>10)     {score+=2;signals.push({cat:'融資',ico:'💹',txt:`融資大增 +${mChg.toFixed(1)}%（多頭加碼）`,pt:+2});}
      else if(mChg>3) {score+=1;signals.push({cat:'融資',ico:'↑' ,txt:`融資增加 +${mChg.toFixed(1)}%`,pt:+1});}
      else if(mChg<-10){score-=2;signals.push({cat:'融資',ico:'💸',txt:`融資大減 ${mChg.toFixed(1)}%（多頭撤退）`,pt:-2});}
      else if(mChg<-3){score-=1;signals.push({cat:'融資',ico:'↓' ,txt:`融資減少 ${mChg.toFixed(1)}%`,pt:-1});}
    }

    /* 3. 融券訊號 */
    const sChg = sP>0 ? (sT-sP)/sP*100 : 0;
    if(sP>0){
      if(sChg>15)     {score-=2;signals.push({cat:'融券',ico:'🐻',txt:`融券大增 +${sChg.toFixed(1)}%（空頭大量放空）`,pt:-2});}
      else if(sChg>5) {score-=1;signals.push({cat:'融券',ico:'↓' ,txt:`融券增加 +${sChg.toFixed(1)}%（空頭布局）`,pt:-1});}
      else if(sChg<-15){score+=2;signals.push({cat:'融券',ico:'🐂',txt:`融券大量回補 ${Math.abs(sChg).toFixed(1)}%（空頭認敗）`,pt:+2});}
      else if(sChg<-5){score+=1;signals.push({cat:'融券',ico:'↑' ,txt:`融券回補 ${Math.abs(sChg).toFixed(1)}%`,pt:+1});}
    }
    /* 當日新增融券 */
    if(sSell > mB*0.3 && sSell > 100){
      score-=1;signals.push({cat:'融券',ico:'⚠️',txt:`當日融券賣出 ${sSell.toLocaleString()} 張（顯著放空行為）`,pt:-1});
    }
    /* 融券使用率 */
    if(sRate>60){score-=2;signals.push({cat:'融券',ico:'🚩',txt:`融券使用率高達 ${sRate.toFixed(0)}%（空頭勢力強）`,pt:-2});}
    else if(sRate>30){score-=1;signals.push({cat:'融券',ico:'⚠️',txt:`融券使用率 ${sRate.toFixed(0)}%（需注意）`,pt:-1});}
  }

  /* 4. 處置訊號 */
  if(punishRec){
    const num=parseInt(punishRec.NumberOfAnnouncement)||1;
    const pts = num>=3 ? -6 : num>=2 ? -5 : -3;
    score+=pts;
    signals.push({cat:'處置',ico:'🚨',txt:`處置第 ${num} 次（${punishRec.ReasonsOfDisposition}）限制交易風險極高`,pt:pts});
    signals.push({cat:'處置',ico:'⛔',txt:`處置期間：${punishRec.DispositionPeriod}`,pt:0});
  }

  return {score, signals};
}

/* ── GRADE ── */
function grade(sc){
  if(sc>=6)  return {lbl:'⭐⭐⭐ 強多',cls:'gb-b3',dir:'bull',col:'#059669',bg:'#ecfdf5',tip:'技術面 + 籌碼面同步走強，建議積極做多。'};
  if(sc>=3)  return {lbl:'⭐⭐ 偏多', cls:'gb-b2',dir:'bull',col:'#047857',bg:'#d1fae5',tip:'多項指標偏多，可考慮做多，注意設停損。'};
  if(sc>=1)  return {lbl:'⭐ 輕多',  cls:'gb-b1',dir:'bull',col:'#065f46',bg:'#f0fdf4',tip:'略偏多，輕倉試多，等待確認訊號。'};
  if(sc===0) return {lbl:'○ 中性',  cls:'gb-n', dir:'neut',col:'#475569',bg:'#f8fafc',tip:'訊號混沌，建議觀望。'};
  if(sc>=-2) return {lbl:'▼ 輕空',  cls:'gb-s1',dir:'bear',col:'#b91c1c',bg:'#fef2f2',tip:'略偏空，輕倉試空或保守觀望。'};
  if(sc>=-5) return {lbl:'▼▼ 偏空', cls:'gb-s2',dir:'bear',col:'#991b1b',bg:'#fecaca',tip:'多項指標偏空，可考慮做空或減碼多單。'};
  return      {lbl:'▼▼▼ 強空',cls:'gb-s3',dir:'bear',col:'#7f1d1d',bg:'#fca5a5',tip:'技術面 + 籌碼面同步走弱，建議做空或迴避。'};
}

/* ── LOAD ── */
async function load(){
  document.getElementById('refreshBtn').textContent='⟳ 載入中…';
  document.getElementById('tblArea').innerHTML='<div class="loading"><div class="spin"></div>同時載入三個資料源，請稍候…</div>';
  document.getElementById('rankWrap').innerHTML='';
  try{
    const [p,mg,sd]=await Promise.all([
      fetch(W+'?url='+encodeURIComponent(APIs.punish)).then(r=>r.json()),
      fetch(W+'?url='+encodeURIComponent(APIs.margn )).then(r=>r.json()),
      fetch(W+'?url='+encodeURIComponent(APIs.stock )).then(r=>r.json()),
    ]);
    const punishArr = Array.isArray(p)?p:[];
    const margnArr  = Array.isArray(mg)?mg:[];
    const stockArr  = Array.isArray(sd)?sd:[];

    // maps
    const punishMap={}, margnMap={};
    punishArr.forEach(r=>{ punishMap[r.Code]=r; });
    margnArr.forEach(r=>{ margnMap[r['股票代號']]=r; });

    // analyze
    analyzed = stockArr
      .filter(s=>s.Code && pn(s.ClosingPrice)>0 && pn(s.OpeningPrice)>0)
      .map(s=>{
        const m=margnMap[s.Code]||null;
        const pu=punishMap[s.Code]||null;
        const {score,signals}=scoreStock(s,m,pu);
        const g=grade(score);
        const mT=m?pi(m['融資今日餘額']):0, mP=m?pi(m['融資前日餘額']):0;
        const sT=m?pi(m['融券今日餘額']):0, sP=m?pi(m['融券前日餘額']):0;
        const mChg=mP>0?(mT-mP)/mP*100:0;
        const sChg=sP>0?(sT-sP)/sP*100:0;
        const chgPct=pn(s.OpeningPrice)>0?(pn(s.ClosingPrice)-pn(s.OpeningPrice))/pn(s.OpeningPrice)*100:0;
        return {s,m,pu,score,signals,g,mChg,sChg,chgPct,
          close:pn(s.ClosingPrice),open:pn(s.OpeningPrice),
          high:pn(s.HighestPrice),low:pn(s.LowestPrice),
          vol:pi(s.TradeVolume),change:pn(s.Change)};
      });
    analyzed.sort((a,b)=>b.score-a.score);

    updateKPI(stockArr, punishArr);
    renderRanks();
    renderTable();

    const date=rocToStr(stockArr[0]?.Date||'');
    document.getElementById('metaLine').textContent=`資料日期：${date} ｜ 分析 ${analyzed.length} 檔 ｜ 處置 ${punishArr.length} 檔 ｜ 融資融券 ${margnArr.length} 檔 ｜ 更新：${new Date().toLocaleString('zh-TW')}`;
    document.getElementById('k-date').textContent=date;
  }catch(e){
    document.getElementById('tblArea').innerHTML=`<div class="loading">❌ 載入失敗：${e.message}</div>`;
  }finally{
    document.getElementById('refreshBtn').textContent='↻ 更新';
  }
}

/* ── KPI ── */
function updateKPI(stockArr,punishArr){
  const b3=analyzed.filter(a=>a.score>=6).length;
  const b2=analyzed.filter(a=>a.score>=3&&a.score<6).length;
  const s2=analyzed.filter(a=>a.score<=-3&&a.score>-6).length;
  const s3=analyzed.filter(a=>a.score<=-6).length;
  const warn=punishArr.length;
  const bull=analyzed.filter(a=>a.score>0).length;
  const bear=analyzed.filter(a=>a.score<0).length;
  document.getElementById('k-n').textContent=analyzed.length;
  document.getElementById('k-b3').textContent=b3;
  document.getElementById('k-b2').textContent=b2;
  document.getElementById('k-s2').textContent=s2;
  document.getElementById('k-s3').textContent=s3;
  document.getElementById('k-warn').textContent=warn;
  const ratio=bear>0?(bull/bear).toFixed(2):'∞';
  document.getElementById('k-ratio').textContent=ratio;
  const rc=document.getElementById('k-ratio');
  rc.className='kv '+(bull>=bear?'kc-g':'kc-r');
  document.getElementById('chipLong').textContent=`做多候選 ${b3+b2}`;
  document.getElementById('chipShort').textContent=`做空候選 ${s2+s3}`;
  document.getElementById('chipWarn').textContent=`⚠ 處置中 ${warn}`;
}

/* ── RANKINGS ── */
function renderRanks(){
  const top15=[...analyzed].sort((a,b)=>b.score-a.score).slice(0,15);
  const bot15=[...analyzed].sort((a,b)=>a.score-b.score).slice(0,15);

  function rowHtml(a,i,isLong){
    const icns=a.signals.slice(0,4).map(s=>`<span class="sig-ico" title="${s.txt}">${s.ico}</span>`).join('');
    const scoreTxt=a.score>0?`+${a.score}`:String(a.score);
    const noCls=i===0?(isLong?'rno rno-gold':'rno rno-red0'):(isLong?'rno rno-g':'rno rno-r');
    const col=isLong?'var(--g)':'var(--r)';
    return `<div class="rank-row" data-code="${a.s.Code}">
      <div class="${noCls}">${i+1}</div>
      <div class="r-info">
        <div class="r-name">${a.s.Name}</div>
        <div class="r-code">${a.s.Code}</div>
      </div>
      <div class="r-score-wrap">
        <div class="r-signals">${icns}</div>
        <div class="score-num" style="color:${col}">${scoreTxt}</div>
      </div>
    </div>`;
  }

  document.getElementById('rankWrap').innerHTML=`
  <div class="rank-col">
    <div class="rank-hd" style="border-top:3px solid var(--g)">
      <span style="font-size:18px">📈</span>
      <h2 style="color:var(--g)">做多候選 TOP 15</h2>
      <span style="font-size:10px;color:var(--ink3)">評分由高到低</span>
    </div>
    <div class="rank-list">${top15.map((a,i)=>rowHtml(a,i,true)).join('')}</div>
  </div>
  <div class="rank-col">
    <div class="rank-hd" style="border-top:3px solid var(--r)">
      <span style="font-size:18px">📉</span>
      <h2 style="color:var(--r)">做空候選 TOP 15</h2>
      <span style="font-size:10px;color:var(--ink3)">評分由低到高</span>
    </div>
    <div class="rank-list">${bot15.map((a,i)=>rowHtml(a,i,false)).join('')}</div>
  </div>`;

  document.querySelectorAll('.rank-row').forEach(el=>{
    el.addEventListener('click',()=>{
      const code=el.dataset.code;
      const idx=analyzed.findIndex(a=>a.s.Code===code);
      if(idx>=0) openModal(analyzed[idx]);
    });
  });
}

/* ── FILTER / SORT ── */
function getFiltered(){
  const q=document.getElementById('qS').value.trim().toLowerCase();
  let list=[...analyzed];
  if(q) list=list.filter(a=>a.s.Code.toLowerCase().includes(q)||a.s.Name.toLowerCase().includes(q));
  if(curTab==='long')  list=list.filter(a=>a.score>0 && !a.pu);
  if(curTab==='short') list=list.filter(a=>a.score<0);
  if(curTab==='warn')  list=list.filter(a=>!!a.pu);
  const s=sortK;
  if(s==='score-d')  list.sort((a,b)=>b.score-a.score);
  else if(s==='score-a') list.sort((a,b)=>a.score-b.score);
  else if(s==='chg-d')   list.sort((a,b)=>b.chgPct-a.chgPct);
  else if(s==='vol-d')   list.sort((a,b)=>b.vol-a.vol);
  else if(s==='mchg-d')  list.sort((a,b)=>b.mChg-a.mChg);
  else if(s==='schg-d')  list.sort((a,b)=>b.sChg-a.sChg);
  return list;
}

/* ── TABLE ── */
function renderTable(){
  const list=getFiltered();
  document.getElementById('stTxt').textContent=`${list.length} 檔`;
  if(!list.length){
    document.getElementById('tblArea').innerHTML='<div class="loading">無符合條件的股票</div>';
    return;
  }
  const rows=list.map((a,i)=>{
    const g=a.g;
    const scoreTxt=a.score>0?`+${a.score}`:String(a.score);
    const scWidth=Math.min(Math.abs(a.score)/10*100,100);
    const scColor=a.score>0?'var(--g)':'var(--r)';
    const chgCls=a.chgPct>0?'up':a.chgPct<0?'dn':'fl';
    const mCls=a.mChg>0?'up':a.mChg<0?'dn':'fl';
    const sCls=a.sChg>0?'dn':a.sChg<0?'up':'fl'; // 融券增=負號
    const icns=a.signals.slice(0,5).map(s=>`<span title="${s.txt}" style="font-size:12px;cursor:default">${s.ico}</span>`).join('');
    const warnCls=a.pu?' warn-row':'';
    const puTag=a.pu?`<span style="font-size:10px;background:var(--am2);color:#92400e;padding:1px 5px;border-radius:8px;font-weight:700">🚨處置</span>`:'';
    return `<tr class="${warnCls}" data-i="${analyzed.indexOf(a)}">
      <td class="cd">${a.s.Code}</td>
      <td class="nm" title="${a.s.Name}">${a.s.Name}${puTag}</td>
      <td>
        <div class="sc-cell">
          <div class="sc-bar-w"><div class="sc-bar" style="width:${scWidth}%;background:${scColor}"></div></div>
          <span class="sc-num" style="color:${scColor}">${scoreTxt}</span>
          <span class="gb ${g.cls}">${g.lbl}</span>
        </div>
      </td>
      <td class="nr">${a.close.toFixed(2)}</td>
      <td class="${chgCls} nr">${a.chgPct.toFixed(2)}%</td>
      <td class="nr">${fmt(a.vol)}</td>
      <td class="${mCls} nr">${a.mChg?pct(a.mChg,1):'—'}</td>
      <td class="${sCls} nr">${a.sChg?pct(a.sChg,1):'—'}</td>
      <td><div class="sig-row">${icns}</div></td>
    </tr>`;
  }).join('');

  document.getElementById('tblArea').innerHTML=`
  <table>
    <thead><tr>
      <th>代號</th><th>公司</th>
      <th>評分 / 評級</th>
      <th style="text-align:right">收盤</th>
      <th style="text-align:right">漲跌幅</th>
      <th style="text-align:right">成交量</th>
      <th style="text-align:right">融資變化</th>
      <th style="text-align:right">融券變化</th>
      <th>訊號明細</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;

  document.querySelectorAll('tbody tr[data-i]').forEach(tr=>{
    tr.addEventListener('click',()=>{
      const idx=parseInt(tr.dataset.i);
      openModal(analyzed[idx]);
    });
  });
}

/* ── MODAL ── */
function openModal(a){
  const g=a.g;
  const s=a.s, m=a.m, pu=a.pu;
  const scoreTxt=a.score>0?`+${a.score}`:String(a.score);
  const mT=m?pi(m['融資今日餘額']):0,mP=m?pi(m['融資前日餘額']):0;
  const sT=m?pi(m['融券今日餘額']):0,sP=m?pi(m['融券前日餘額']):0;
  const sL=m?pi(m['融券限額']):0;
  const sRate=sL>0?sT/sL*100:0;

  // signals by category
  const kSigs=a.signals.filter(x=>x.cat==='K線');
  const mSigs=a.signals.filter(x=>x.cat==='融資'||x.cat==='融券');
  const pSigs=a.signals.filter(x=>x.cat==='處置');

  function sigRows(arr){
    if(!arr.length) return '<div style="font-size:12px;color:#94a3b8;padding:4px 0">無此類訊號</div>';
    return arr.map(x=>{
      const ptTxt=x.pt>0?`<span style="color:var(--g);font-weight:700">+${x.pt}</span>`:x.pt<0?`<span style="color:var(--r);font-weight:700">${x.pt}</span>`:`<span style="color:#94a3b8">—</span>`;
      const bw=x.pt?Math.abs(x.pt)/4*100:0;
      const bc=x.pt>0?'var(--g)':'var(--r)';
      return `<div class="sig-item">
        <span class="s-ico">${x.ico}</span>
        <span class="s-txt">${x.txt}</span>
        <div class="s-bar-w"><div class="s-bar" style="width:${bw}%;background:${bc}"></div></div>
        ${ptTxt}
      </div>`;
    }).join('');
  }

  // 操作建議
  let advCls='adv-neut', advTitle='⚪ 觀望', advTxt='目前訊號混沌，建議等待更明確方向後再行操作。';
  if(pu){
    advCls='adv-warn';
    advTitle='⚠️ 危險！處置中 — 嚴禁操作';
    advTxt=`此股票目前被交易所列為處置股票（${pu.ReasonsOfDisposition}），處置期間 ${pu.DispositionPeriod}，交易限制嚴格，流動性極差，嚴禁任何方向的操作，避免被套牢或無法出場。`;
  } else if(a.score>=6){
    advCls='adv-bull';
    advTitle='📈 建議做多 — 積極進場';
    advTxt=`評分 ${scoreTxt}，多項指標同步看多。${a.mChg>3?'融資增加，散戶看好後市；':''} ${a.sChg<-5?'融券大量回補，空頭認敗；':''}${a.chgPct>3?'當日出現強勢陽線，動能充足。':''}建議於隔日開盤後觀察買盤是否延續，適當位置分批做多，停損設於今日最低點附近。`;
  } else if(a.score>=3){
    advCls='adv-bull';
    advTitle='✅ 偏多操作 — 輕倉試多';
    advTxt=`評分 ${scoreTxt}，整體偏多但強度中等。建議輕倉試多，待確認多方動能後可加碼。${a.mChg>0?'融資小幅增加，散戶有買進意願。':''} 停損設於今日最低點。`;
  } else if(a.score<=-6){
    advCls='adv-bear';
    advTitle='📉 建議做空 — 積極放空';
    advTxt=`評分 ${scoreTxt}，空方訊號強烈。${a.sChg>10?'融券大量增加，空頭積極布局；':''} ${a.mChg<-5?'融資快速撤退，多頭信心崩潰；':''}${a.chgPct<-3?'出現大陰線，跌勢明確。':''}建議隔日觀察是否繼續走弱，可考慮於反彈時放空，停損設於今日最高點。`;
  } else if(a.score<=-3){
    advCls='adv-bear';
    advTitle='❌ 偏空操作 — 輕倉試空';
    advTxt=`評分 ${scoreTxt}，整體偏空但尚未確認趨勢。建議輕倉試空或迴避多單。${a.sChg>5?'融券有所增加，有空頭布局跡象。':''}`;
  }

  document.getElementById('modalBox').innerHTML=`
  <div class="modal-hdr">
    <div style="flex:1">
      <div class="mcode">${s.Code}</div>
      <h2>${s.Name}</h2>
      <div class="msub">${rocToStr(s.Date)} 收盤 ${a.close.toFixed(2)} | 漲跌 ${a.chgPct>0?'+':''}${a.chgPct.toFixed(2)}%</div>
    </div>
    <button class="modal-close" onclick="closeModal()">✕</button>
  </div>
  <div class="modal-body">

    <!-- Score Gauge -->
    <div class="gauge-wrap">
      <div class="gauge-circle" style="background:${g.bg};border-color:${g.col};color:${g.col}">
        <div class="g-num">${scoreTxt}</div>
        <div class="g-max">/ ±10</div>
      </div>
      <div class="gauge-info">
        <h3 style="color:${g.col}">${g.lbl}</h3>
        <p>${g.tip}</p>
      </div>
    </div>

    <!-- Key Metrics -->
    <div class="metrics-grid">
      <div class="m-card">
        <div class="ml">開 / 高 / 低 / 收</div>
        <div class="mv" style="font-size:.85rem">${a.open} / ${a.high}</div>
        <div class="ms">${a.low} / <strong>${a.close}</strong></div>
      </div>
      <div class="m-card">
        <div class="ml">融資今日餘額</div>
        <div class="mv ${a.mChg>0?'kc-g':'kc-r'}">${m?pi(m['融資今日餘額']).toLocaleString():'—'}</div>
        <div class="ms" style="color:${a.mChg>0?'var(--g)':'var(--r)'}">${a.mChg?pct(a.mChg,2)+'（vs 昨日）':'—'}</div>
      </div>
      <div class="m-card">
        <div class="ml">融券今日餘額</div>
        <div class="mv ${a.sChg>0?'kc-r':'kc-g'}">${m?pi(m['融券今日餘額']).toLocaleString():'—'}</div>
        <div class="ms" style="color:${a.sChg>0?'var(--r)':'var(--g)'}">${a.sChg?pct(a.sChg,2)+'（vs 昨日）':'—'} · 使用率 ${sRate.toFixed(1)}%</div>
      </div>
      <div class="m-card">
        <div class="ml">成交量</div>
        <div class="mv">${fmt(a.vol)}</div>
        <div class="ms">成交筆數 ${parseInt(s.Transaction||0).toLocaleString()}</div>
      </div>
      <div class="m-card">
        <div class="ml">資券互抵</div>
        <div class="mv">${m?pi(m['資券互抵']).toLocaleString():'—'}</div>
        <div class="ms">張</div>
      </div>
      <div class="m-card">
        <div class="ml">處置狀態</div>
        <div class="mv ${pu?'kc-am':'kc-g'}">${pu?'🚨 處置中':'✅ 正常'}</div>
        <div class="ms">${pu?pu.DispositionPeriod:'無處置記錄'}</div>
      </div>
    </div>

    <!-- Signal Breakdown -->
    <div class="sig-sect">
      <h4>📊 K線型態訊號</h4>${sigRows(kSigs)}
    </div>
    <div class="sig-sect">
      <h4>💹 融資融券訊號</h4>${sigRows(mSigs)}
    </div>
    ${pSigs.length?`<div class="sig-sect"><h4>🚨 處置訊號</h4>${sigRows(pSigs)}</div>`:''}

    <!-- Advice -->
    <div class="advice ${advCls}">
      <h4>${advTitle}</h4>
      <p>${advTxt}</p>
    </div>
    <div style="font-size:10px;color:#94a3b8;text-align:center;margin-top:8px">⚠️ 本分析僅供參考，不構成投資建議。評分模型綜合 K線、融資、融券、處置四維度，滿分 ±10 分。</div>
  </div>`;

  document.getElementById('modalBg').classList.add('show');
}
function closeModal(e){
  if(!e||e.target===document.getElementById('modalBg'))
    document.getElementById('modalBg').classList.remove('show');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ── EVENTS ── */
document.getElementById('refreshBtn').addEventListener('click',load);
document.getElementById('qS').addEventListener('input',renderTable);
document.getElementById('selSort').addEventListener('change',e=>{sortK=e.target.value;renderTable();});
function setTab(t){
  curTab=t;
  document.querySelectorAll('.tab').forEach(b=>b.className='tab');
  const cls={all:'on-all',long:'on-long',short:'on-short',warn:'on-warn'};
  document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add(cls[t]);
  renderTable();
}

load();
</script>
<script src="nav-bar.js"></script>
</body>
</html>
