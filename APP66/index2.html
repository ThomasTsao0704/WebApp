<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom Nails｜線上預約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7EDE6;
    --card:#FFFCFA;
    --ink:#34222E;
    --ink-soft:#6B5A64;
    --rose:#B85C7A;
    --rose-deep:#8C3F5B;
    --rose-pale:#F0DCE1;
    --sage:#7C8F6E;
    --sage-deep:#5E7052;
    --line:#E4D2CB;
    --danger:#B23A3A;
    --radius:20px;
    --shadow: 0 20px 50px -20px rgba(52,34,46,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #FBEFE9 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #F3E2E9 0%, transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100vh;
    padding:48px 20px 80px;
  }
  .wrap{ max-width:680px; margin:0 auto; }

  /* ---------- Hero ---------- */
  .hero{ text-align:center; margin-bottom:36px; }
  .hero .mark{
    display:inline-flex; align-items:center; gap:10px;
    font-family:'Fraunces', serif; font-style:italic; font-weight:600;
    font-size:2.4rem; color:var(--ink); letter-spacing:0.5px;
  }
  .hero .mark svg{ width:34px; height:34px; flex:none; }
  .hero p{
    margin:10px 0 0; color:var(--ink-soft); font-size:0.98rem;
    font-weight:500;
  }

  /* ---------- Stepper (signature element) ---------- */
  .stepper{
    display:flex; align-items:center; justify-content:center;
    gap:6px; margin-bottom:28px; flex-wrap:wrap;
  }
  .step-dot-group{ display:flex; align-items:center; gap:6px; }
  .step-line{ width:28px; height:2px; background:var(--line); border-radius:2px; }
  .step-line.done{ background:var(--rose); }
  .bud{
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--card); border:2px solid var(--line);
    color:var(--ink-soft); font-family:'JetBrains Mono', monospace;
    font-size:0.75rem; font-weight:600;
    transition:border-color .3s ease, background .3s ease, transform .3s ease;
    position:relative;
  }
  .bud.active{ border-color:var(--rose); color:var(--rose-deep); transform:scale(1.08); }
  .bud.done{ border-color:var(--rose); background:var(--rose); }
  .bud.done svg{ width:16px; height:16px; }
  .bud .num{ display:block; }
  .bud svg{ display:none; }
  .bud.done .num{ display:none; }
  .bud.done svg{ display:block; animation:bloom .5s ease; }
  @keyframes bloom{ from{ transform:scale(.2) rotate(-25deg); opacity:0; } to{ transform:scale(1) rotate(0); opacity:1; } }
  .step-label{
    text-align:center; font-size:0.78rem; color:var(--ink-soft);
    font-weight:600; margin-top:-16px; margin-bottom:22px; letter-spacing:0.3px;
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--card); border-radius:var(--radius);
    box-shadow:var(--shadow); border:1px solid var(--line);
    padding:32px clamp(20px,5vw,40px);
  }
  .panel{ display:none; }
  .panel.active{ display:block; animation:fadeUp .35s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  h2.panel-title{
    font-family:'Fraunces', serif; font-weight:600; font-size:1.5rem;
    margin:0 0 6px;
  }
  .panel-sub{ color:var(--ink-soft); font-size:0.92rem; margin:0 0 24px; }

  /* Designer / service choice cards */
  .choice-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  @media (max-width:520px){ .choice-grid{ grid-template-columns:1fr; } }
  .choice{
    border:2px solid var(--line); border-radius:14px; padding:16px 14px;
    background:#fff; cursor:pointer; text-align:left;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
    font-family:'Manrope', sans-serif;
  }
  .choice:hover{ transform:translateY(-2px); border-color:#D9B7C2; }
  .choice.selected{ border-color:var(--rose); background:var(--rose-pale); }
  .choice .c-name{ font-weight:700; font-size:1.02rem; margin-bottom:4px; }
  .choice .c-meta{ font-size:0.8rem; color:var(--ink-soft); font-family:'JetBrains Mono',monospace; }

  /* Date */
  input[type="date"]{
    width:100%; padding:14px 16px; border-radius:12px;
    border:2px solid var(--line); font-family:'JetBrains Mono', monospace;
    font-size:1rem; color:var(--ink); background:#fff;
  }
  input[type="date"]:focus, input[type="text"]:focus{
    outline:3px solid #E9C3D0; outline-offset:1px; border-color:var(--rose);
  }
  input[type="text"]{
    width:100%; padding:14px 16px; border-radius:12px;
    border:2px solid var(--line); font-family:'Manrope', sans-serif;
    font-size:1rem; color:var(--ink); background:#fff;
  }
  label.field-label{
    display:block; font-size:0.82rem; font-weight:700; color:var(--ink-soft);
    margin-bottom:8px; letter-spacing:0.3px;
  }

  /* Slot grid */
  .slot-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr));
    gap:10px; margin-top:6px;
  }
  .slot{
    border:2px solid var(--line); background:#fff; border-radius:12px;
    padding:10px 6px; font-family:'JetBrains Mono', monospace; font-size:0.86rem;
    font-weight:600; cursor:pointer; color:var(--ink);
    transition:all .18s ease; text-align:center;
  }
  .slot:hover:not(.booked){ border-color:var(--rose); transform:translateY(-1px); }
  .slot.selected{
    background:var(--rose); border-color:var(--rose); color:#fff;
  }
  .slot.selected::before{ content:"✿ "; }
  .slot.booked{
    color:#B8A7AE; text-decoration:line-through; cursor:not-allowed;
    background:#F5EFEC; border-color:#F5EFEC;
  }
  .slot-empty{ color:var(--ink-soft); font-size:0.9rem; padding:20px 0; text-align:center; }

  /* Multi-select summary + simultaneous toggle */
  .simul-row{ margin-top:16px; }
  .simul-label{
    display:flex; align-items:flex-start; gap:10px; cursor:pointer;
    background:var(--rose-pale); border:1px solid #E7C6D0; border-radius:12px;
    padding:12px 14px; font-size:0.86rem; color:var(--ink); line-height:1.5;
  }
  .simul-label input{ width:18px; height:18px; margin-top:1px; flex:none; accent-color:var(--rose); cursor:pointer; }
  .svc-summary{
    margin-top:16px; background:#FBF5F2; border:1px solid var(--line);
    border-radius:12px; padding:14px 16px; font-size:0.88rem; line-height:1.8; color:var(--ink);
  }
  .svc-summary .sum-total{ color:var(--rose-deep); font-weight:700; }
  .svc-summary .sum-part{ color:var(--ink-soft); font-family:'JetBrains Mono',monospace; font-size:0.82rem; }

  /* Per-position designer blocks */
  .pos-block{ margin-bottom:18px; }
  .pos-block:last-child{ margin-bottom:0; }
  .pos-title{
    font-size:0.86rem; font-weight:700; color:var(--ink); margin-bottom:10px;
    padding-left:10px; border-left:3px solid var(--rose);
  }
  .choice.dim{ opacity:0.38; cursor:not-allowed; }
  .choice.dim:hover{ transform:none; border-color:var(--line); }

  /* 14-day calendar — 一週一列，日期橫向、時段縱向 */
  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:14px; }
  .cal-week:last-child{ margin-bottom:0; }
  .cal-col{ min-width:0; }
  .cal-colhead{
    text-align:center; padding:6px 2px 8px; border-bottom:2px solid var(--line); margin-bottom:8px;
  }
  .cal-colhead.today{ border-bottom-color:var(--rose); }
  .cal-dow{ font-size:0.68rem; color:var(--ink-soft); font-weight:600; }
  .cal-dom{ font-size:0.82rem; color:var(--ink); font-weight:700; font-family:'JetBrains Mono',monospace; margin-top:2px; }
  .cal-colhead.today .cal-dom{ color:var(--rose-deep); }
  .cal-slots{ display:flex; flex-direction:column; gap:6px; }
  .cal-slots .slot{ padding:7px 2px; font-size:0.74rem; }
  .cal-slots .slot.selected::before{ content:""; }
  .cal-none{ text-align:center; color:#C9BAC0; font-size:0.8rem; padding:8px 0; }

  /* Buttons */
  .row-actions{ display:flex; gap:10px; margin-top:28px; }
  .btn{
    font-family:'Manrope', sans-serif; font-weight:700; font-size:0.95rem;
    padding:13px 22px; border-radius:12px; border:none; cursor:pointer;
    transition:transform .15s ease, background .2s ease;
  }
  .btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .btn-primary{ background:var(--rose); color:#fff; flex:1; }
  .btn-primary:hover:not(:disabled){ background:var(--rose-deep); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:2px solid var(--line); }
  .btn-ghost:hover{ border-color:#D9B7C2; }
  .btn:active:not(:disabled){ transform:scale(0.98); }

  .error-msg{
    background:#FBEAEA; color:var(--danger); border:1px solid #F0C9C9;
    padding:10px 14px; border-radius:10px; font-size:0.85rem; margin-top:16px;
  }

  /* Confirmation */
  .confirm-icon{
    width:64px; height:64px; margin:0 auto 18px; display:block;
    animation:bloom .6s ease;
  }
  .confirm-box{ text-align:center; }
  .confirm-summary{
    background:#FBF5F2; border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin:20px 0; text-align:left;
    font-size:0.92rem; line-height:1.9;
  }
  .confirm-summary b{ color:var(--rose-deep); }
  .confirm-status{
    display:inline-block; font-size:0.78rem; font-weight:700;
    background:#FDECC8; color:#8A6A1B; padding:3px 10px; border-radius:20px;
    font-family:'JetBrains Mono',monospace;
  }

  /* Footer / admin link */
  .footer{ text-align:center; margin-top:26px; }
  .admin-link{
    background:none; border:none; color:var(--ink-soft); font-size:0.82rem;
    cursor:pointer; text-decoration:underline; font-family:'Manrope',sans-serif;
  }

  /* Admin modal */
  .modal-backdrop{
    display:none; position:fixed; inset:0; background:rgba(52,34,46,0.45);
    align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-backdrop.active{ display:flex; }
  .modal{
    background:var(--card); border-radius:20px; padding:28px clamp(18px,5vw,32px);
    max-width:560px; width:100%; max-height:86vh; overflow-y:auto;
    box-shadow:var(--shadow);
  }
  .modal h3{ font-family:'Fraunces',serif; font-weight:600; margin:0 0 4px; font-size:1.3rem; }
  .modal .modal-sub{ color:var(--ink-soft); font-size:0.85rem; margin:0 0 20px; }
  .modal-close{
    float:right; background:none; border:none; font-size:1.1rem; cursor:pointer;
    color:var(--ink-soft);
  }
  .appt-row{
    display:flex; justify-content:space-between; align-items:center;
    border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:8px;
    font-size:0.88rem; gap:10px; flex-wrap:wrap;
  }
  .appt-row .appt-time{ font-family:'JetBrains Mono',monospace; font-weight:700; }
  .appt-row .appt-status{
    font-size:0.72rem; font-weight:700; padding:2px 8px; border-radius:20px;
    background:var(--rose-pale); color:var(--rose-deep); white-space:nowrap;
  }
  .cancel-btn{
    background:none; border:1px solid var(--danger); color:var(--danger);
    padding:4px 10px; border-radius:8px; font-size:0.76rem; cursor:pointer; font-weight:700;
  }
  hr.divider{ border:none; border-top:1px dashed var(--line); margin:22px 0; }
  .grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .grid-2{ grid-template-columns:1fr; } }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(72 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(144 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(216 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(288 12 12)"/><circle cx="12" cy="12" r="2.3" fill="#7C8F6E"/></svg>
      Bloom Nails
    </div>
    <p>在你的指尖，種一朵花 — 線上預約美甲時段</p>
  </div>

  <div class="stepper" id="stepper"></div>
  <div class="step-label" id="stepLabel"></div>

  <div class="card">

    <!-- STEP 1: Service -->
    <div class="panel" data-step="1">
      <h2 class="panel-title">選擇服務項目</h2>
      <p class="panel-sub">可複選多項服務；同部位的時間會累加，不同部位可勾「同時進行」由兩位美甲師一起完成。</p>
      <div class="choice-grid" id="serviceGrid"></div>
      <div id="simulRow" class="simul-row" style="display:none;">
        <label class="simul-label">
          <input type="checkbox" id="simulCheck">
          <span>同時進行 — 不同部位請兩位美甲師一起做，總時間以最長的部位計。</span>
        </label>
      </div>
      <div id="svcSummary" class="svc-summary" style="display:none;"></div>
      <div class="row-actions">
        <button class="btn btn-primary" id="toStep2" disabled>下一步</button>
      </div>
    </div>

    <!-- STEP 2: Designer (per position) -->
    <div class="panel" data-step="2">
      <h2 class="panel-title">選擇設計師</h2>
      <p class="panel-sub" id="designerSub">請為每個部位指派一位美甲師。</p>
      <div id="designerGrid"></div>
      <div class="row-actions">
        <button class="btn btn-ghost" data-back="1">上一步</button>
        <button class="btn btn-primary" id="toStep3" disabled>下一步</button>
      </div>
    </div>

    <!-- STEP 3: Time slot (14-day calendar) -->
    <div class="panel" data-step="3">
      <h2 class="panel-title">選擇預約時段</h2>
      <p class="panel-sub" id="slotSub">以下為近兩週、依美甲師空檔整理的可預約時段，點選即可。</p>
      <div id="slotArea"><div class="slot-empty">請先完成前面的選擇</div></div>
      <div class="row-actions">
        <button class="btn btn-ghost" data-back="2">上一步</button>
        <button class="btn btn-primary" id="toStep4" disabled>下一步</button>
      </div>
    </div>

    <!-- STEP 4: Contact + confirm -->
    <div class="panel" data-step="4">
      <h2 class="panel-title">留下您的姓名</h2>
      <p class="panel-sub">確認以下資訊無誤後即可完成預約。</p>
      <label class="field-label" for="nameInput">姓名 / 稱呼</label>
      <input type="text" id="nameInput" placeholder="請輸入姓名">
      <div class="confirm-summary" id="reviewBox"></div>
      <div id="bookError"></div>
      <div class="row-actions">
        <button class="btn btn-ghost" data-back="3">上一步</button>
        <button class="btn btn-primary" id="submitBooking">確認預約</button>
      </div>
    </div>

    <!-- STEP 5: Success -->
    <div class="panel" data-step="5">
      <div class="confirm-box">
        <svg class="confirm-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(72 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(144 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(216 12 12)"/><path d="M12 2c1.2 2 1.2 4 0 6-1.2-2-1.2-4 0-6Z" fill="#B85C7A" transform="rotate(288 12 12)"/><circle cx="12" cy="12" r="2.3" fill="#7C8F6E"/></svg>
        <h2 class="panel-title">預約已送出</h2>
        <p class="panel-sub">我們已收到您的預約申請。</p>
        <div class="confirm-summary" id="successBox"></div>
        <button class="btn btn-primary" id="restartBtn" style="width:100%">再預約一筆</button>
      </div>
    </div>

  </div>

  <div class="footer">
    <button class="admin-link" id="openAdmin">店家後台管理</button>
  </div>
</div>

<!-- Admin modal -->
<div class="modal-backdrop" id="adminBackdrop">
  <div class="modal">
    <button class="modal-close" id="closeAdmin">✕</button>
    <div id="adminPinView">
      <h3>後台登入</h3>
      <p class="modal-sub">請輸入管理 PIN 碼</p>
      <label class="field-label" for="pinInput">PIN 碼</label>
      <input type="text" id="pinInput" placeholder="••••••">
      <div id="pinError"></div>
      <div class="row-actions">
        <button class="btn btn-primary" id="pinSubmit" style="width:100%">登入</button>
      </div>
    </div>

    <div id="adminMainView" style="display:none">
      <h3>預約管理</h3>
      <p class="modal-sub">查詢與管理指定日期、設計師的預約狀況</p>
      <div class="grid-2">
        <div>
          <label class="field-label" for="adminDesigner">設計師</label>
          <select id="adminDesigner" style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-family:'Manrope',sans-serif;"></select>
        </div>
        <div>
          <label class="field-label" for="adminDate">日期</label>
          <input type="date" id="adminDate">
        </div>
      </div>
      <div class="row-actions">
        <button class="btn btn-primary" id="adminQuery" style="width:100%">查詢</button>
      </div>
      <div id="adminError"></div>
      <div id="adminList" style="margin-top:18px;"></div>

      <hr class="divider">
      <h3 style="font-size:1.05rem;">手動加單</h3>
      <p class="modal-sub">供電話 / 現場預約使用，不做衝突檢查</p>
      <label class="field-label">姓名</label>
      <input type="text" id="addName" placeholder="客人姓名">
      <div class="grid-2" style="margin-top:12px;">
        <div>
          <label class="field-label">服務</label>
          <select id="addService" style="width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);font-family:'Manrope',sans-serif;"></select>
        </div>
        <div>
          <label class="field-label">開始時間</label>
          <input type="text" id="addStart" placeholder="例如 14:00">
        </div>
      </div>
      <div id="addError"></div>
      <div class="row-actions">
        <button class="btn btn-primary" id="addSubmit" style="width:100%">新增預約</button>
      </div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   設定：請將下方 SCRIPT_URL 換成你部署後的 Apps Script 網址
   （部署 → 網頁應用程式 → 複製網址）
   ========================================================= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXbx5aCEIaOuyY8moK_XxMjtid1WVsbhSZkxxYg21H0kizGa0iIHmCXOKlXqBoPV4X/exec";

// 設計師與服務項目改由後端提供（config 動作），開場載入
let DESIGNERS = [];   // [{ id, designer }]
let SERVICES  = [];   // [{ id, position, service, longtime, introduction, designer, price }]
const WORK_START = 10 * 60;
const WORK_END   = 20 * 60;
const SLOT_MIN   = 30;

const state = {
  step: 1,
  date: null,
  startTime: null,
  name: "",
  services: [],        // 已選服務物件陣列
  simultaneous: false, // 是否同時進行（各部位由不同美甲師並行）
  assign: {}           // 每個部位指派的美甲師：{ position: designer }
};

const STEP_LABELS = { 1:"服務項目", 2:"設計師", 3:"時段", 4:"完成預約" };

/* ---------- helpers ---------- */
function toMins(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
function fromMins(m){ return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function generateAllSlots(){
  const slots = [];
  for(let m = WORK_START; m < WORK_END; m += SLOT_MIN) slots.push(fromMins(m));
  return slots;
}
function computeAvailable(bookedRanges, durationMins){
  const blocked = {};
  bookedRanges.forEach(r=>{
    const s = toMins(r.startTime), e = toMins(r.endTime);
    for(let m=s; m<e; m+=SLOT_MIN) blocked[m]=true;
  });
  return generateAllSlots().filter(slot=>{
    const startM = toMins(slot);
    const endM = startM + durationMins;
    if(endM > WORK_END) return false;
    for(let m=startM; m<endM; m+=SLOT_MIN) if(blocked[m]) return false;
    return true;
  });
}
function todayStr(){
  const d = new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
async function callApi(action, params){
  if(!SCRIPT_URL || SCRIPT_URL.indexOf("YOUR_DEPLOYED") === 0){
    throw new Error("尚未設定 SCRIPT_URL，請先在程式碼中填入部署後的 Apps Script 網址");
  }
  // 一律用 GET + 網址參數呼叫，避免 Apps Script 302 導向把 POST body 弄丟的問題
  const qs = new URLSearchParams(Object.assign({ action }, params || {})).toString();
  const res = await fetch(SCRIPT_URL + "?" + qs);
  const data = await res.json();
  if(!data.ok) throw new Error(data.message || "發生錯誤");
  return data;
}

/* ---------- 服務分組 / 時間計算 ---------- */
function groupByPosition(services){
  const byPos = {};
  services.forEach(s=>{
    const p = String(s.position);
    (byPos[p] = byPos[p] || []).push(s);
  });
  return byPos;
}
function positionCount(){ return Object.keys(groupByPosition(state.services)).length; }
function partTime(list){ return list.reduce((sum,s)=> sum + Number(s.longtime||0), 0); }

/** 總時間：同部位相加；多部位時，同時進行取最長、否則全部相加 */
function computeDuration(){
  const byPos = groupByPosition(state.services);
  const posTimes = Object.keys(byPos).map(p=> partTime(byPos[p]));
  if(posTimes.length === 0) return 0;
  if(posTimes.length === 1) return posTimes[0];
  return state.simultaneous ? Math.max.apply(null, posTimes)
                            : posTimes.reduce((a,b)=>a+b,0);
}
function computePrice(){
  return state.services.reduce((sum,s)=>{ const n = Number(s.price); return sum + (isNaN(n)?0:n); }, 0);
}
function isServiceSelected(id){ return state.services.some(s=> s.id === id); }

/* 部位排序：兩者皆數字則比數字，否則比字串 */
function positionCompare(a,b){
  const na = Number(a), nb = Number(b);
  if(!isNaN(na) && !isNaN(nb)) return na - nb;
  return String(a) < String(b) ? -1 : String(a) > String(b) ? 1 : 0;
}
function orderedPositions(){ return Object.keys(groupByPosition(state.services)).sort(positionCompare); }
function positionServices(pos){ return state.services.filter(s=> String(s.position) === String(pos)); }

/* ---------- STEP 1: service（複選）---------- */
function renderServiceGrid(){
  const grid = document.getElementById("serviceGrid");
  grid.innerHTML = "";
  if(!SERVICES.length){
    grid.innerHTML = `<div class="slot-empty">尚無可預約的服務項目</div>`;
    return;
  }
  SERVICES.forEach(svc=>{
    const el = document.createElement("button");
    el.type = "button";
    el.className = "choice" + (isServiceSelected(svc.id) ? " selected" : "");
    const priceLine = svc.price !== "" ? `<div class="c-meta" style="margin-top:4px;">NT$ ${svc.price}</div>` : "";
    el.innerHTML = `<div class="c-name">${svc.service}</div><div class="c-meta">部位 ${svc.position}・約 ${svc.longtime} 分鐘</div><div class="c-meta" style="margin-top:4px;">${svc.introduction}</div>${priceLine}`;
    el.addEventListener("click", ()=> toggleService(svc));
    grid.appendChild(el);
  });
  refreshServiceUI();
}

function toggleService(svc){
  const idx = state.services.findIndex(s=> s.id === svc.id);
  if(idx >= 0) state.services.splice(idx, 1);
  else state.services.push(svc);
  // 服務變動 → 部位可能改變，清空指派並鎖住後續
  state.assign = {};
  document.getElementById("toStep3").disabled = true;
  renderServiceGrid();
}

/** 更新「同時進行」勾選列與摘要，並控制下一步是否可按 */
function refreshServiceUI(){
  const simulRow = document.getElementById("simulRow");
  const summary  = document.getElementById("svcSummary");
  const multiPart = positionCount() >= 2;

  simulRow.style.display = multiPart ? "block" : "none";
  if(!multiPart){                    // 少於兩個部位不能同時進行
    state.simultaneous = false;
    document.getElementById("simulCheck").checked = false;
  }

  if(state.services.length === 0){
    summary.style.display = "none";
    document.getElementById("toStep2").disabled = true;
    return;
  }

  const byPos = groupByPosition(state.services);
  const partLines = Object.keys(byPos).map(p=>{
    const names = byPos[p].map(s=>s.service).join("、");
    return `<div class="sum-part">部位 ${p}：${names}（${partTime(byPos[p])} 分）</div>`;
  }).join("");
  const dur = computeDuration();
  const price = computePrice();
  const modeNote = multiPart
    ? (state.simultaneous ? "・兩位美甲師同時進行" : "・單一美甲師依序完成")
    : "";
  summary.style.display = "block";
  summary.innerHTML =
    partLines +
    `<div style="margin-top:8px;">預估總時間：<span class="sum-total">${dur} 分鐘</span>${modeNote}</div>` +
    (price > 0 ? `<div>費用小計：<span class="sum-total">NT$ ${price}</span></div>` : "");

  document.getElementById("toStep2").disabled = false;
}

/* ---------- STEP 3: designer（每部位指派一位）---------- */
// 該部位可施作的美甲師：需能做該部位「所有」已選服務（各服務 designer 限制的交集；留空＝全部）
function candidateDesigners(pos){
  let names = DESIGNERS.map(d=> d.designer);
  positionServices(pos).forEach(s=>{
    if(s.designer){
      const allow = s.designer.split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
      if(allow.length){
        const f = names.filter(n=> allow.indexOf(n) !== -1);
        if(f.length) names = f;
      }
    }
  });
  return names;
}
// 同時進行時，某美甲師是否已被指派到其他部位
function isDesignerUsedElsewhere(pos, name){
  return orderedPositions().some(p=> p !== pos && state.assign[p] === name);
}

function updateDesignerStep(){
  document.getElementById("designerSub").textContent = state.simultaneous
    ? "同時進行：請為每個部位各指派一位不同的美甲師。"
    : "請為每個部位指派一位美甲師。";
  renderDesignerGrid();
}

function renderDesignerGrid(){
  const wrap = document.getElementById("designerGrid");
  wrap.innerHTML = "";
  const posList = orderedPositions();
  if(posList.length === 0){
    wrap.innerHTML = `<div class="slot-empty">請先選擇服務項目</div>`;
    document.getElementById("toStep3").disabled = true;
    return;
  }
  posList.forEach(pos=>{
    const block = document.createElement("div");
    block.className = "pos-block";
    const svcNames = positionServices(pos).map(s=>s.service).join("、");
    const title = document.createElement("div");
    title.className = "pos-title";
    title.textContent = `部位 ${pos}：${svcNames}`;
    block.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "choice-grid";
    const cands = candidateDesigners(pos);
    if(cands.length === 0){
      const empty = document.createElement("div");
      empty.className = "slot-empty";
      empty.textContent = "這個部位目前沒有可施作的美甲師";
      grid.appendChild(empty);
    } else {
      cands.forEach(name=>{
        const dimmed = state.simultaneous && isDesignerUsedElsewhere(pos, name);
        const el = document.createElement("button");
        el.type = "button";
        el.className = "choice" + (state.assign[pos] === name ? " selected" : "") + (dimmed ? " dim" : "");
        el.innerHTML = `<div class="c-name">${name}</div><div class="c-meta">美甲設計師</div>`;
        el.addEventListener("click", ()=>{
          if(state.simultaneous && isDesignerUsedElsewhere(pos, name)) return; // 同時進行不可重複指派
          state.assign[pos] = name;
          renderDesignerGrid();
        });
        grid.appendChild(el);
      });
    }
    block.appendChild(grid);
    wrap.appendChild(block);
  });
  updateDesignerNext();
}

function updateDesignerNext(){
  const posList = orderedPositions();
  let ok = posList.length > 0 && posList.every(p=> !!state.assign[p]);
  if(ok && state.simultaneous){
    const used = posList.map(p=> state.assign[p]);
    ok = new Set(used).size === used.length;   // 各部位須為不同美甲師
  }
  document.getElementById("toStep3").disabled = !ok;
}

/* ---------- STEP 4: slots ---------- */
/* 依部位建立工作項：{designer, offset(分), duration(分)} */
function buildTasks(){
  const posList = orderedPositions();
  const times = posList.map(p=> partTime(positionServices(p)));
  const tasks = [];
  let cum = 0;
  posList.forEach((p, i)=>{
    tasks.push({ designer: state.assign[p], offset: state.simultaneous ? 0 : cum, duration: times[i] });
    cum += times[i];
  });
  return tasks;
}
/* 對每個候選開始時間，檢查各部位美甲師在各自子時段是否有空 */
function computeAvailableMulti(tasks, bookedByDesigner){
  const total = Math.max.apply(null, tasks.map(t=> t.offset + t.duration));
  const out = [];
  for(let S = WORK_START; S + total <= WORK_END; S += SLOT_MIN){
    let ok = true;
    for(const t of tasks){
      const ws = S + t.offset, we = ws + t.duration;
      const ranges = bookedByDesigner[t.designer] || [];
      if(ranges.some(r=> ws < r[1] && r[0] < we)){ ok = false; break; }
    }
    if(ok) out.push(fromMins(S));
  }
  return out;
}

/* ---------- STEP 3: 14 天行事曆時段 ---------- */
function pad2(n){ return ('0'+n).slice(-2); }
function dateStr(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function next14Dates(){
  const arr = [];
  const base = new Date(); base.setHours(0,0,0,0);
  for(let i=0;i<14;i++){ const d = new Date(base); d.setDate(base.getDate()+i); arr.push(d); }
  return arr;
}
const WEEK = ['日','一','二','三','四','五','六'];

async function loadCalendar(){
  const area = document.getElementById("slotArea");
  area.innerHTML = `<div class="slot-empty">載入中…</div>`;
  document.getElementById("toStep4").disabled = true;
  state.date = null; state.startTime = null;
  try{
    const tasks = buildTasks();
    const distinct = tasks.map(t=>t.designer).filter((v,i,a)=> a.indexOf(v)===i);
    const dates = next14Dates();
    const startDate = dateStr(dates[0]);

    // 每位美甲師整段 14 天的預約，只抓一次
    const rangeByDesigner = {};
    for(const dz of distinct){
      const data = await callApi("slots_range", { designer: dz, date: startDate, days: "14" });
      rangeByDesigner[dz] = data.bookedByDate || {};
    }

    const now = new Date();
    const todayS = dateStr(now);
    const nowMin = now.getHours()*60 + now.getMinutes();

    area.innerHTML = "";
    let anyAvail = false;
    const clearSel = ()=> area.querySelectorAll(".slot.selected").forEach(c=> c.classList.remove("selected"));

    // 一週（最多 7 天）一列；每天：上方日期、下方縱向時段
    for(let w = 0; w < dates.length; w += 7){
      const week = document.createElement("div");
      week.className = "cal-week";

      dates.slice(w, w + 7).forEach(d=>{
        const ds = dateStr(d);
        const bookedByDesigner = {};
        distinct.forEach(dz=>{
          bookedByDesigner[dz] = (rangeByDesigner[dz][ds] || []).map(r=> [toMins(r.startTime), toMins(r.endTime)]);
        });
        let avail = computeAvailableMulti(tasks, bookedByDesigner);
        if(ds === todayS) avail = avail.filter(t=> toMins(t) > nowMin);  // 今天只留未來時段

        const col = document.createElement("div");
        col.className = "cal-col";

        const head = document.createElement("div");
        head.className = "cal-colhead" + (ds === todayS ? " today" : "");
        head.innerHTML = `<div class="cal-dow">週${WEEK[d.getDay()]}</div><div class="cal-dom">${d.getMonth()+1}/${d.getDate()}</div>`;
        col.appendChild(head);

        const slots = document.createElement("div");
        slots.className = "cal-slots";
        if(avail.length === 0){
          const none = document.createElement("div");
          none.className = "cal-none"; none.textContent = "—";
          slots.appendChild(none);
        } else {
          anyAvail = true;
          avail.forEach(slot=>{
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "slot";
            btn.textContent = slot;
            btn.addEventListener("click", ()=>{
              state.date = ds; state.startTime = slot;
              document.getElementById("toStep4").disabled = false;
              clearSel();
              btn.classList.add("selected");
            });
            slots.appendChild(btn);
          });
        }
        col.appendChild(slots);
        week.appendChild(col);
      });

      area.appendChild(week);
    }

    if(!anyAvail){
      area.innerHTML = `<div class="slot-empty">近兩週都已額滿，請稍後再試或直接聯繫店家。</div>`;
    }
  }catch(e){
    area.innerHTML = `<div class="error-msg">${e.message}</div>`;
  }
}

    document.getElementById("addStart").value = "";
    queryAdmin();
  }catch(e){
    errEl.innerHTML = `<div class="error-msg">${e.message}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "新增預約";
  }
});
</script>
</body>
