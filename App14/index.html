  </script>  <script>
  /* =============================================
     App #1: TWSE 處置股卡片面板（自 TWSE.html 整合）
     - 延後一交易日出關
     - 跨年穩健（今年＋明年休市表）
     - 出關徽章
  ==============================================*/
  (()=>{
    // ===== API =====
    const PUNISH_API = 'https://cors-proxy.s01yg3642.workers.dev/?url=' +
      encodeURIComponent('https://openapi.twse.com.tw/v1/announcement/punish');
    const HOLIDAY_API = 'https://cors-proxy.s01yg3642.workers.dev/?url=' +
      encodeURIComponent('https://openapi.twse.com.tw/v1/holidaySchedule/holidaySchedule');

    // ===== 本地存儲最愛 =====
    const FAV_KEY='twse_fav_stocks';
    const getFavorites = () => JSON.parse(localStorage.getItem(FAV_KEY) || '[]');
    const toggleFavorite = (code)=>{ const favs=getFavorites(); const i=favs.indexOf(code); if(i>-1)favs.splice(i,1); else favs.push(code); localStorage.setItem(FAV_KEY, JSON.stringify(favs)); return favs.includes(code); };

    // ===== 日期工具 =====
    const daysBetween=(d1,d2)=>{ const ms=(new Date(d2).setHours(0,0,0,0))-(new Date(d1).setHours(0,0,0,0)); return Math.round(ms/86400000); };
    const normalizeToISO=(s)=>{ if(!s) return null; const str=String(s).trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str; if(/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(str)){ const [y,m,d]=str.split('/').map(n=>parseInt(n,10)); return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;} if(/^\d{3}\/\d{1,2}\/\d{1,2}$/.test(str)){ const [y,m,d]=str.split('/').map(n=>parseInt(n,10)); const yyyy=y+1911; return `${yyyy}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;} const t=new Date(str); if(!isNaN(t)){ const y=t.getFullYear(), m=t.getMonth()+1, d=t.getDate(); return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;} return null; };
    const parsePeriod=(periodRaw)=>{ if(!periodRaw||!periodRaw.includes('～')) return {start:null,end:null,raw:periodRaw||''}; const [s,e]=periodRaw.split('～').map(s=>s.trim()); const rocToAD=(roc)=>{ if(!roc||typeof roc!== 'string') return null; const [y,m,d]=roc.split('/').map(v=>parseInt(v,10)); if(!y||!m||!d) return null; return `${y+1911}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }; return { start:rocToAD(s), end:rocToAD(e), raw:periodRaw}; };
    const inferIntervalBadge=(measure)=>{ if(!measure) return null; const text=String(measure); if(text.includes('20')&&text.includes('分鐘')) return '20分盤'; if(text.includes('五分鐘')||(text.includes('5')&&text.includes('分鐘'))) return '5分盤'; if(/人工管制|撮合/i.test(text)) return '人工管制'; return null; };

    // ===== 休市表（跨年穩健＋快取） =====
    const HOLIDAY_CACHE_KEY='twse_holidays_cache_v1'; const HOLIDAY_CACHE_TTL_MS=24*60*60*1000;
    async function fetchHolidaySet(){
      try{ const cached=JSON.parse(localStorage.getItem(HOLIDAY_CACHE_KEY)||'null'); if(cached && (Date.now()-cached.ts)<HOLIDAY_CACHE_TTL_MS && Array.isArray(cached.list)){ return new Set(cached.list); } }catch{}
      let isoList=[]; try{ const res=await fetch(HOLIDAY_API,{cache:'no-store'}); const rows=await res.json(); const arr=Array.isArray(rows)?rows:[]; const thisYear=new Date().getFullYear(); const nextYear=thisYear+1; for(const r of arr){ const rawDate=r.date||r.HolidayDate||r.holidayDate||r['日期']||r['Date']||''; const isOpenVal=(r.isOpen ?? r.Open ?? r.open ?? r['是否開市'] ?? r['IsOpen']); const isOpen=String(isOpenVal).toLowerCase()==='y' || String(isOpenVal).toLowerCase()==='true'; const iso=normalizeToISO(rawDate); if(!iso) continue; const y=parseInt(iso.slice(0,4),10); if((y===thisYear||y===nextYear) && !isOpen) isoList.push(iso); } }catch(e){ console.warn('Holiday API 失敗，將退回週末判斷：', e); isoList=[]; }
      try{ localStorage.setItem(HOLIDAY_CACHE_KEY, JSON.stringify({ts:Date.now(), list:isoList})); }catch{}
      return new Set(isoList);
    }
    function isTradingDay(date, holidays){ const wk=date.getDay(); if(wk===0||wk===6) return false; const iso=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`; return !holidays.has(iso); }
    function nextTradingDayFromEnd(endDate, holidays){ const d=new Date(endDate); d.setHours(0,0,0,0); d.setDate(d.getDate()+1); while(!isTradingDay(d,holidays)){ d.setDate(d.getDate()+1);} return d; }
    const formatISO=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const makeCountdownLabel=(today,start,out)=>{ const toStart=daysBetween(today,start); const toOut=daysBetween(today,out); if(toOut<0) return '✅ 已出關'; if(toOut===0) return '🎉 本日出關'; if(toStart>0) return `⏳ ${toStart} 日後開始`; return `⏱️ ${toOut} 日後出關`; };

    // ===== 模擬即時行情（可替換為真實 API） =====
    const fetchMarketData=async(codes)=>{ const mock={}; for(const code of codes){ if(Math.random()>0.3){ mock[code]={ price:(Math.random()*200+50).toFixed(2), chg:(Math.random()*10-5).toFixed(2), chgPct:(Math.random()*10-5).toFixed(2), turnover:(Math.random()*5).toFixed(2)+'億', tratio:(Math.random()*2).toFixed(2)+'%' }; } } return mock; };

    async function loadData(){
      const meta=document.getElementById('metaInfo');
      const wrap=document.getElementById('cards');
      const tpl=document.getElementById('card-tpl');
      wrap.innerHTML='<div class="col-span-full text-center py-16 loading text-gray-400">載入中...</div>';
      const holidaySet=await fetchHolidaySet();
      let rows=[]; try{ const res=await fetch(PUNISH_API,{cache:'no-store'}); rows=await res.json(); if(!Array.isArray(rows)) rows=[]; meta.textContent=`共 ${rows.length} 檔（${new Date().toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})}）`; }catch(err){ console.error(err); meta.textContent='載入失敗'; wrap.innerHTML='<div class="col-span-full text-center py-16 text-red-400">⚠️ 載入失敗，請檢查網路或稍後再試</div>'; return; }
      const norm=rows.map(x=>{
        const announce=x.Date||''; const code=String(x.Code||'').trim(); const name=x.Name||''; const reason=x.ReasonsOfDisposition||''; const period=x.DispositionPeriod||''; const measure=x.DispositionMeasures||'';
        const {start,end,raw}=parsePeriod(period); const badge=inferIntervalBadge(measure);
        let announceAD=''; if(announce && announce.length===7){ const y=parseInt(announce.substring(0,3)); const m=announce.substring(3,5); const d=announce.substring(5,7); announceAD=`${y+1911}-${m}-${d}`; }
        let outDateISO='—'; let countdownText='期間未明';
        if(start && end){ const outDate=nextTradingDayFromEnd(new Date(end), holidaySet); outDateISO=formatISO(outDate); countdownText=makeCountdownLabel(new Date(new Date().setHours(0,0,0,0)), new Date(start), outDate); }
        return { announce_roc:announce, announce_ad:announceAD, code, name, reason, period_raw:raw, start, end, measure, intervalBadge:badge, outDateISO, countdownText };
      });
      norm.sort((a,b)=>{ const aKey=a.outDateISO && a.outDateISO!=='—' ? new Date(a.outDateISO).getTime() : Infinity; const bKey=b.outDateISO && b.outDateISO!=='—' ? new Date(b.outDateISO).getTime() : Infinity; return aKey-bKey; });
      const codes=norm.map(r=>r.code).filter(Boolean); const marketData=await fetchMarketData(codes); const favorites=getFavorites();
      wrap.innerHTML='';
      for(const row of norm){ const $=tpl.content.cloneNode(true); $.querySelector('.stock-name').textContent=row.name||'—'; $.querySelector('.stock-code').textContent=row.code||'—'; $.querySelector('.announce-date').textContent=row.announce_ad||'—'; $.querySelector('.reason-text').textContent=row.reason||'—'; $.querySelector('.measure').textContent=row.measure||'—'; $.querySelector('.period').textContent=row.period_raw||'—';
        const cb=$.querySelector('.countdown-badge'); cb.textContent=row.countdownText; const outBadge=$.querySelector('.outdate-badge'); outBadge.textContent=row.outDateISO!=='—'?`出關日：${row.outDateISO}`:'出關日：—';
        if(row.intervalBadge){ const ib=$.querySelector('[data-badge="interval"]'); ib.textContent=row.intervalBadge; ib.classList.remove('hidden'); }
        const extra=marketData[row.code]||null; const priceEl=$.querySelector('.price'); const chgEl=$.querySelector('.chg'); const tEl=$.querySelector('.turnover'); const rEl=$.querySelector('.tratio');
        if(extra){ priceEl.textContent=extra.price; tEl.textContent=extra.turnover; rEl.textContent=extra.tratio; const chgNum=parseFloat(extra.chg); const arrow=chgNum>=0?'▲':'▼'; chgEl.textContent=`${arrow}${Math.abs(chgNum)} (${Math.abs(parseFloat(extra.chgPct)).toFixed(2)}%)`; if(chgNum>0){ priceEl.style.color='var(--up)'; chgEl.style.color='var(--up)'; } else if(chgNum<0){ priceEl.style.color='var(--down)'; chgEl.style.color='var(--down)'; } } else { priceEl.textContent='—'; chgEl.textContent='無行情'; tEl.textContent='—'; rEl.textContent='—'; }
        const heartBtn=$.querySelector('.heart-btn'); heartBtn.dataset.code=row.code; if(favorites.includes(row.code)) heartBtn.classList.add('fav');
        document.getElementById('cards').appendChild($);
      }
      if(!norm.length){ wrap.innerHTML='<div class="col-span-full text-center text-gray-400 py-16">目前沒有處置股票資料</div>'; }
    }

    document.getElementById('cards').addEventListener('click',(e)=>{ const btn=e.target.closest('.heart-btn'); if(btn){ const code=btn.dataset.code; const isFav=toggleFavorite(code); btn.classList.toggle('fav', isFav); }});
    document.getElementById('refreshBtn').addEventListener('click', ()=> loadData());
    // load immediately when tab is visible on first render
    loadData();
  })();

  (()=>{

    const updateClock=()=>{ const el=document.getElementById('lastUpdate'); if(!el) return; el.textContent='最後更新：'+ new Date().toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}); };
    const toNum=v=> Number(String(v ?? '').replace(/[\,\s%]/g,'')) || 0;
    const rocToISO=(s)=>{ const m=String(s).match(/(\d{2,3})[\/年.-](\d{1,2})[\/月.-](\d{1,2})/); if(!m) return ''; const y=(+m[1]+1911).toString().padStart(4,'0'); const mm=m[2].padStart(2,'0'); const dd=m[3].padStart(2,'0'); return `${y}-${mm}-${dd}`; };

    // 資料來源（官方 HTML）
    const URL_TPEX='https://www.tpex.org.tw/www/zh-tw/intraday/fee?id=&response=html';
    const URL_TWSE='https://www.twse.com.tw/rwd/zh/dayTrading/BFIF8U?response=html';

    async function fetchHTML(url){
      try{ const r=await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(`HTTP ${r.status}`); return await r.text(); }
      catch(e){ const proxy='https://api.allorigins.win/raw?url='+encodeURIComponent(url); const r2=await fetch(proxy,{cache:'no-store'}); if(!r2.ok) throw new Error(`Proxy HTTP ${r2.status}`); return await r2.text(); }
    }

    function parseFeeTable(htmlText, source){
      const doc=new DOMParser().parseFromString(htmlText,'text/html');
      const tables=Array.from(doc.querySelectorAll('table'));
      let table=tables.find(t=> /券差日期/.test(t.textContent) && /證券代號/.test(t.textContent));
      if(!table) return [];
      const headerTr=Array.from(table.querySelectorAll('thead tr, tr')).find(tr=>{ const ths=Array.from(tr.querySelectorAll('th')); if(ths.length<4) return false; if(ths.some(th=>th.hasAttribute('colspan'))) return false; const text=ths.map(th=>th.textContent.trim()).join(','); return /券差日期/.test(text) && /證券代號/.test(text); });
      if(!headerTr) return [];
      const headers=Array.from(headerTr.querySelectorAll('th')).map(th=>th.textContent.trim());
      const idx=(re)=> headers.findIndex(h=>re.test(h));
      const iDate=idx(/券差日期/), iCode=idx(/證券代號/), iName=idx(/證券名稱/), iQty=idx(/(投資人)?借券股數/), iFee=idx(/(投資人)?借券費率/);
      const bodyTrs = Array.from(table.querySelectorAll('tbody tr')).length ? Array.from(table.querySelectorAll('tbody tr')) : Array.from(table.querySelectorAll('tr')).filter(tr=> tr.querySelectorAll('td').length);
      const rows=[]; for(const tr of bodyTrs){ const tds=Array.from(tr.querySelectorAll('td,th')).map(td=>td.textContent.trim()); if(!tds.length) continue; const dateStr=tds[iDate]||''; const code=tds[iCode]||''; const name=tds[iName]||''; const qty=toNum(tds[iQty]); let feeRaw=(tds[iFee]??'').replace('%','').trim(); const fee = feeRaw===''? null : Number(feeRaw); if(!dateStr || !code) continue; const iso=rocToISO(dateStr); rows.push({ date:dateStr, dateISO:iso, source, code, name, qty, fee }); }
      return rows;
    }

    // 狀態
    let ALL_ROWS=[]; let AVAILABLE_DATES=[]; let TOP10_DATA=[]; let CURRENT_DATE_ISO='';

    function computeTop10ByDate(dateISO){
      const rows=ALL_ROWS.filter(r=>r.dateISO===dateISO);
      const codeMap=new Map();
      for(const row of rows){ if(!codeMap.has(row.code)){ codeMap.set(row.code,{ code:row.code, name:row.name, totalQty:0, fees:[], sources:new Set()}); }
        const item=codeMap.get(row.code); item.totalQty+=row.qty; if(row.fee!==null) item.fees.push(row.fee); item.sources.add(row.source);
      }
      TOP10_DATA = Array.from(codeMap.values()).map(item=>({ ...item, avgFee:item.fees.length? item.fees.reduce((a,b)=>a+b,0)/item.fees.length : null, sourcesText:Array.from(item.sources).join(', ') })).sort((a,b)=> b.totalQty - a.totalQty).slice(0,10);
    }

    function renderTable(){
      const tbody=document.getElementById('tbody');
      const dateInfo=document.getElementById('dateInfo');
      const displayStr=AVAILABLE_DATES.find(d=>d.iso===CURRENT_DATE_ISO)?.display || CURRENT_DATE_ISO;
      dateInfo.textContent=`資料日期：${displayStr}（共 ${TOP10_DATA.length} 名）`;
      tbody.innerHTML = TOP10_DATA.map((item, i)=>{ const rank=i+1; const rankClass=rank<=3? 'rank top3':'rank'; const feeText=item.avgFee!==null? `${item.avgFee.toFixed(2)}%`:'-'; return `
        <tr>
          <td><div class="${rankClass}">${rank}</div></td>
          <td><strong>${item.code}</strong></td>
          <td>${item.name || '-'}</td>
          <td style="text-align:right;" class="qty">${nf.format(item.totalQty)}</td>
          <td style="text-align:right;" class="fee">${feeText}</td>
          <td style="text-align:center; font-size:12px; color:#666;">${item.sourcesText}</td>
        </tr>`; }).join('');
      document.getElementById('loadingMsg').style.display='none';
      document.getElementById('tableSection').style.display='block';
    }

    function exportCSV(){
      if(TOP10_DATA.length===0){ showAlert('沒有可匯出的資料','error'); return; }
      const header=['排名','證券代號','證券名稱','借券股數','平均費率(%)','來源'];
      const rows=TOP10_DATA.map((item,i)=>[ i+1, item.code, item.name||'', item.totalQty, item.avgFee!==null? item.avgFee.toFixed(2):'', item.sourcesText ]);
      const csv=[ header.join(','), ...rows.map(r=> r.map(cell=> typeof cell==='string' && cell.includes(',') ? `"${cell.replace(/"/g,'""')}"` : cell ).join(',')) ].join('\n');
      const blob=new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
      const displayStr=AVAILABLE_DATES.find(d=>d.iso===CURRENT_DATE_ISO)?.display?.replace(/[\/年月]/g,'-').replace(/日/,'') || CURRENT_DATE_ISO;
      a.download=`當沖券差Top10_${displayStr}.csv`; document.body.appendChild(a); a.click(); a.remove(); showAlert('已匯出 CSV 檔案','success');
    }

    function buildDateSelect(){
      const sel=document.getElementById('dateSelect');
      sel.innerHTML = AVAILABLE_DATES.map(d=>`<option value="${d.iso}">${d.display}</option>`).join('');
      sel.value=CURRENT_DATE_ISO;
      sel.onchange=()=>{ CURRENT_DATE_ISO=sel.value; computeTop10ByDate(CURRENT_DATE_ISO); renderTable(); };
    }

    async function loadData(){
      const loading=document.getElementById('loadingMsg');
      const table=document.getElementById('tableSection');
      loading.style.display='block'; table.style.display='none';
      try{
        const [tpexHTML, twseHTML] = await Promise.all([ fetchHTML(URL_TPEX), fetchHTML(URL_TWSE) ]);
        const tpexRows = parseFeeTable(tpexHTML, 'TPEx');
        const twseRows = parseFeeTable(twseHTML, 'TWSE');
        ALL_ROWS=[...tpexRows, ...twseRows];
        if(!ALL_ROWS.length) throw new Error('未取得任何資料');
        const dateSet=new Map();
        for(const r of ALL_ROWS){ if(r.dateISO) dateSet.set(r.dateISO, r.date); }
        AVAILABLE_DATES = Array.from(dateSet.entries()).map(([iso,display])=>({iso, display})).sort((a,b)=> a.iso < b.iso ? 1 : -1);
        if(!AVAILABLE_DATES.length) throw new Error('找不到有效日期');
        CURRENT_DATE_ISO=AVAILABLE_DATES[0].iso; // 預設最新
        computeTop10ByDate(CURRENT_DATE_ISO); buildDateSelect(); renderTable(); updateClock();
        showAlert(`載入成功！共 ${ALL_ROWS.length} 筆原始列，日期數：${AVAILABLE_DATES.length}`,'success');
      }catch(e){ console.error(e); showAlert('載入失敗：'+e.message,'error'); document.getElementById('loadingMsg').innerHTML='<div style="color:#c62828;">❌ 載入失敗</div>'; }
    }

    // 綁定
    document.addEventListener('DOMContentLoaded', ()=>{
      document.getElementById('btnRefresh').addEventListener('click', loadData);
      document.getElementById('btnExport').addEventListener('click', exportCSV);
      // 預先載入一次（切到此分頁即可直接用）
      loadData();
    });
  })();
  </script></body>
</html>
