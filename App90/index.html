    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .control-group label {
            font-weight: 600;
            color: #333;
        }

        .control-group input[type="file"] {
            padding: 8px 16px;
            background: white;
            border: 2px solid #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
        }

        .control-group button {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s;
        }

        .control-group button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .control-group button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chart-container {
            padding: 30px;
            min-height: 600px;
        }

        #stockChart {
            width: 100%;
            height: 700px;
        }

        .info-panel {
            padding: 20px 30px;
            background: #f8f9fa;
            border-top: 1px solid #e9ecef;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-item .label {
            font-size: 0.85em;
            color: #666;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 1.3em;
            font-weight: 700;
            color: #333;
        }

        .legend {
            padding: 20px 30px;
            background: white;
        }

        .legend h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .legend-line {
            width: 40px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-line.solid {
            background: currentColor;
        }

        .legend-line.dashed {
            background: repeating-linear-gradient(
                to right,
                currentColor 0px,
                currentColor 8px,
                transparent 8px,
                transparent 16px
            );
        }

        .legend-text {
            font-size: 0.9em;
            color: #333;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 50px;
            color: #667eea;
            font-size: 1.2em;
        }

        .loading.active {
            display: block;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                align-items: stretch;
            }

            .control-group {
                flex-direction: column;
                align-items: stretch;
            }

            #stockChart {
                height: 500px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 股票走勢圖與技術指標</h1>
            <p>K線圖 + 移動平均線分析</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>上傳CSV檔案:</label>
                <input type="file" id="fileInput" accept=".csv">
            </div>
            <div class="control-group">
                <button id="loadBtn" disabled>載入圖表</button>
                <button id="resetBtn">重置縮放</button>
            </div>
        </div>

        <div class="loading" id="loading">
            正在處理資料...
        </div>

        <div class="chart-container">
            <div id="stockChart"></div>
        </div>

        <div class="legend">
            <h3>📊 圖例說明</h3>
            <div class="legend-grid">
                <div class="legend-item">
                    <div class="legend-line solid" style="background: rgba(0, 150, 0, 0.8); height: 8px;"></div>
                    <span class="legend-text">K線圖(綠色上漲/紅色下跌)</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line dashed" style="color: #1f77b4;"></div>
                    <span class="legend-text">均價[0] - 虛線</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line dashed" style="color: #ff7f0e;"></div>
                    <span class="legend-text">均價[0+1] - 虛線</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line dashed" style="color: #2ca02c;"></div>
                    <span class="legend-text">均價[0+1+2] - 虛線</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line solid" style="background: #d62728;"></div>
                    <span class="legend-text">均價[1+2] - 實線</span>
                </div>
                <div class="legend-item">
                    <div class="legend-line solid" style="background: #9467bd;"></div>
                    <span class="legend-text">均價[1+2+3] - 實線</span>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-grid" id="infoGrid">
                <div class="info-item">
                    <div class="label">資料點數</div>
                    <div class="value" id="dataPoints">-</div>
                </div>
                <div class="info-item">
                    <div class="label">日期範圍</div>
                    <div class="value" id="dateRange">-</div>
                </div>
                <div class="info-item">
                    <div class="label">最高價</div>
                    <div class="value" id="highestPrice">-</div>
                </div>
                <div class="info-item">
                    <div class="label">最低價</div>
                    <div class="value" id="lowestPrice">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let csvData = null;
        let chartData = null;

        const fileInput = document.getElementById('fileInput');
        const loadBtn = document.getElementById('loadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const loading = document.getElementById('loading');

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                loadBtn.disabled = false;
            }
        });

        loadBtn.addEventListener('click', function() {
            const file = fileInput.files[0];
            if (!file) return;

            loading.classList.add('active');
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    parseAndDisplayData(text);
                } catch (error) {
                    alert('解析CSV檔案時發生錯誤: ' + error.message);
                } finally {
                    loading.classList.remove('active');
                }
            };
            reader.readAsText(file, 'UTF-8');
        });

        resetBtn.addEventListener('click', function() {
            if (chartData) {
                createChart(chartData);
            }
        });

        function parseCSV(text) {
            const lines = text.trim().split('\n');
            const headers = lines[0].replace(/^\ufeff/, '').split(',').map(h => h.trim());
            
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const values = line.split(',').map(v => v.trim());
                const row = {};
                
                headers.forEach((header, index) => {
                    row[header] = values[index];
                });
                
                data.push(row);
            }
            
            return data;
        }

        function parseAndDisplayData(csvText) {
            csvData = parseCSV(csvText);
            
            // 在不同日期間自動插入 null 來斷開連線
            csvData = addNullsBetweenDays(csvData);
            
            // 準備圖表資料
            const dates = [];
            const open = [];
            const high = [];
            const low = [];
            const close = [];
            const ma0 = [];
            const ma01 = [];
            const ma12 = [];
            const ma123 = [];
            const ma012 = [];

            csvData.forEach(row => {
                // 如果是 null 分隔行，插入 null
                if (!row['日期']) {
                    dates.push(null);
                    open.push(null);
                    high.push(null);
                    low.push(null);
                    close.push(null);
                    ma0.push(null);
                    ma01.push(null);
                    ma12.push(null);
                    ma123.push(null);
                    ma012.push(null);
                    return;
                }
                
                const dateTime = `${row['日期']} ${row['時間']}`;
                dates.push(dateTime);
                
                open.push(parseFloat(row['開盤價']));
                high.push(parseFloat(row['最高價']));
                low.push(parseFloat(row['最低價']));
                close.push(parseFloat(row['收盤價']));
                ma0.push(parseFloat(row['均價[0]']));
                ma01.push(parseFloat(row['均價[0+1]']));
                ma12.push(parseFloat(row['均價[1+2]']));
                ma123.push(parseFloat(row['均價[1+2+3]']));
                ma012.push(parseFloat(row['均價[0+1+2]']));
            });

            chartData = {
                dates, open, high, low, close,
                ma0, ma01, ma12, ma123, ma012
            };

            createChart(chartData);
            updateInfo(chartData);
        }

        // 新增函數: 在不同日期間插入 null
        function addNullsBetweenDays(data) {
            const result = [];
            let lastDate = null;
            
            data.forEach(row => {
                const currentDate = row['日期'];
                
                if (lastDate && currentDate !== lastDate) {
                    // 插入 null 分隔行
                    const nullRow = {};
                    Object.keys(row).forEach(key => {
                        nullRow[key] = null;
                    });
                    result.push(nullRow);
                }
                
                result.push(row);
                lastDate = currentDate;
            });
            
            return result;
        }

        function createChart(data) {
            const traces = [];

            // K線圖
            const candlestick = {
                type: 'candlestick',
                x: data.dates,
                open: data.open,
                high: data.high,
                low: data.low,
                close: data.close,
                name: 'K線',
                increasing: {
                    line: { color: '#cc0000', width: 1 },
                    fillcolor: 'rgba(204, 0, 0, 0.7)'
                },
                decreasing: {
                    line: { color: '#00aa00', width: 1 },
                    fillcolor: 'rgba(0, 170, 0, 0.7)'
                },
                whiskerwidth: 0.5,
                hoverinfo: 'x+y'
            };
            traces.push(candlestick);

            // 虛線 - 均價[0]
            traces.push({
                type: 'scatter',
                mode: 'lines',
                x: data.dates,
                y: data.ma0,
                name: '均價[0]',
                line: {
                    color: '#9df8fc',
                    width: 2,
                    dash: 'dash'
                },
                hovertemplate: '%{y:.2f}<extra>均價[0]</extra>',
                connectgaps: false
            });

            // 虛線 - 均價[0+1]
            traces.push({
                type: 'scatter',
                mode: 'lines',
                x: data.dates,
                y: data.ma01,
                name: '均價[0+1]',
                line: {
                    color: '#25c3f7',
                    width: 2,
                    dash: 'dash'
                },
                hovertemplate: '%{y:.2f}<extra>均價[0+1]</extra>',
                connectgaps: false
            });

            // 虛線 - 均價[0+1+2]
            traces.push({
                type: 'scatter',
                mode: 'lines',
                x: data.dates,
                y: data.ma012,
                name: '均價[0+1+2]',
                line: {
                    color: '#083bc7',
                    width: 2,
                    dash: 'dash'
                },
                hovertemplate: '%{y:.2f}<extra>均價[0+1+2]</extra>',
                connectgaps: false
            });

            // 實線 - 均價[1+2]
            traces.push({
                type: 'scatter',
                mode: 'lines',
                x: data.dates,
                y: data.ma12,
                name: '均價[1+2]',
                line: {
                    color: '#95ff8a',
                    width: 2.5,
                    dash: 'solid'
                },
                hovertemplate: '%{y:.2f}<extra>均價[1+2]</extra>',
                connectgaps: false
            });

            // 實線 - 均價[1+2+3]
            traces.push({
                type: 'scatter',
                mode: 'lines',
                x: data.dates,
                y: data.ma123,
                name: '均價[1+2+3]',
                line: {
                    color: '#159c06',
                    width: 2.5,
                    dash: 'solid'
                },
                hovertemplate: '%{y:.2f}<extra>均價[1+2+3]</extra>',
                connectgaps: false
            });

            const layout = {
                title: {
                    text: '股票走勢圖與技術指標',
                    font: { size: 20, family: 'Microsoft JhengHei' }
                },
                xaxis: {
                    title: '日期時間',
                    rangeslider: { visible: false },
                    type: 'category',
                    gridcolor: '#e9ecef',
                    showgrid: true
                },
                yaxis: {
                    title: '價格',
                    gridcolor: '#e9ecef',
                    showgrid: true,
                    fixedrange: false
                },
                hovermode: 'x unified',
                showlegend: true,
                legend: {
                    orientation: 'h',
                    y: -0.15,
                    x: 0.5,
                    xanchor: 'center'
                },
                paper_bgcolor: 'white',
                plot_bgcolor: '#fafafa',
                margin: { t: 60, r: 40, b: 120, l: 60 },
                dragmode: 'zoom'
            };

            const config = {
                responsive: true,
                displayModeBar: true,
                modeBarButtonsToAdd: ['drawline', 'drawopenpath', 'eraseshape'],
                modeBarButtonsToRemove: ['lasso2d', 'select2d'],
                displaylogo: false,
                toImageButtonOptions: {
                    format: 'png',
                    filename: '股票走勢圖',
                    height: 1000,
                    width: 1600,
                    scale: 2
                }
            };

            Plotly.newPlot('stockChart', traces, layout, config);
        }

        function updateInfo(data) {
            document.getElementById('dataPoints').textContent = data.dates.length;
            document.getElementById('dateRange').textContent = 
                `${data.dates[0]} ~ ${data.dates[data.dates.length - 1]}`;
            
            const allPrices = [...data.high, ...data.low];
            const highest = Math.max(...allPrices);
            const lowest = Math.min(...allPrices);
            
            document.getElementById('highestPrice').textContent = highest.toFixed(2);
            document.getElementById('lowestPrice').textContent = lowest.toFixed(2);
        }

        // 自動載入預設檔案(如果有的話)
        window.addEventListener('load', function() {
            // 可以在這裡添加自動載入邏輯
        });
    </script>

        window.addEventListener('load', function() {
            setTimeout(function() {
                csvData = preloadedData;
                
                const dates = [];
                const open = [];
                const high = [];
                const low = [];
                const close = [];
                const ma0 = [];
                const ma01 = [];
                const ma12 = [];
                const ma123 = [];
                const ma012 = [];

                csvData.forEach(row => {
                    // 如果是 null 分隔行
                    if (!row['日期']) {
                        dates.push(null);
                        open.push(null);
                        high.push(null);
                        low.push(null);
                        close.push(null);
                        ma0.push(null);
                        ma01.push(null);
                        ma12.push(null);
                        ma123.push(null);
                        ma012.push(null);
                        return;
                    }
                    
                    const dateTime = `${row['日期']} ${row['時間']}`;
                    dates.push(dateTime);
                    
                    open.push(parseFloat(row['開盤價']));
                    high.push(parseFloat(row['最高價']));
                    low.push(parseFloat(row['最低價']));
                    close.push(parseFloat(row['收盤價']));
                    ma0.push(parseFloat(row['均價[0]']));
                    ma01.push(parseFloat(row['均價[0+1]']));
                    ma12.push(parseFloat(row['均價[1+2]']));
                    ma123.push(parseFloat(row['均價[1+2+3]']));
                    ma012.push(parseFloat(row['均價[0+1+2]']));
                });

                chartData = {
                    dates, open, high, low, close,
                    ma0, ma01, ma12, ma123, ma012
                };

                createChart(chartData);
                updateInfo(chartData);
            }, 500);
        });
    </script>
