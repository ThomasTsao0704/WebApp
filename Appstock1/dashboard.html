<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀表板 - 股票分析系統</title>
    <style>
        :root {
            --bg-gradient-start: #667eea; --bg-gradient-end: #764ba2; --page-bg: #ffffff;
            --panel-bg: #ffffff; --panel-border: rgba(0, 0, 0, 0.05); --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --header-text: #ffffff; --text-main: #333; --text-dim: #666; --btn-bg-start: #667eea;
            --btn-bg-end: #764ba2; --btn-text: #ffffff; --section-bg: #f8f9fa;
            --trend-pos: #e74c3c; --trend-neg: #27ae60;
        }
        body.dark {
            --bg-gradient-start: #1f2937; --bg-gradient-end: #111827; --page-bg: #1e1e2e;
            --panel-bg: #2a2a3a; --panel-border: rgba(255, 255, 255, 0.07);
            --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); --header-text: #f0f0f0;
            --text-main: #f0f0f0; --text-dim: #a0a0b8; --btn-bg-start: #4f46e5;
            --btn-bg-end: #6d28d9; --section-bg: #3a3a4a; --trend-pos: #ff6b6b; --trend-neg: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; padding: 20px; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--panel-bg); border-radius: 15px;
            padding: 30px; box-shadow: var(--panel-shadow); border: 1px solid var(--panel-border); }
        .header { background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px; border-radius: 10px; color: var(--header-text); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.8em; }
        .btn-back { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .section { background: var(--section-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .dashboard-widget { background: var(--page-bg); padding: 20px; border-radius: 8px;
            border-left: 4px solid var(--btn-bg-start); }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0;
            border-bottom: 1px solid var(--panel-border); }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: var(--text-dim); font-size: 14px; }
        .stat-value { font-weight: 700; color: var(--text-main); }
        .trend-positive { color: var(--trend-pos); }
        .trend-negative { color: var(--trend-neg); }
        .clickable-stock { cursor: pointer; color: var(--btn-bg-start); text-decoration: underline; }
        .muted { color: var(--text-dim); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th { background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: white; padding: 12px; text-align: left; font-weight: 600; }
        table td { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📈 儀表板</h1>
            <a href="index.html" class="btn-back">← 返回首頁</a>
        </div>

        <div class="section" id="dashboardContent">
            <div class="muted">尚未載入市場資料。請先進入「數據上傳」頁面上傳 CSV / Excel。</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stockMarketData_v3';

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            updateDashboard();
        });

        function initTheme() {
            if (localStorage.getItem('theme_dark') === '1') document.body.classList.add('dark');
        }

        function updateDashboard() {
            const marketData = loadMarketData();
            const el = document.getElementById('dashboardContent');

            if (marketData.length === 0) {
                el.innerHTML = '<div class="muted">尚未載入市場資料。請先進入「數據上傳」頁面上傳 CSV / Excel。</div>';
                return;
            }

            const dates = [...new Set(marketData.map(d => d.日期))].sort();
            const latest = dates[dates.length - 1];
            const today = marketData.filter(d => d.日期 === latest);

            const up = today.filter(r => r.漲跌幅 >= 0).length;
            const down = today.length - up;
            const avg = (today.reduce((s, r) => s + (+r.漲跌幅 || 0), 0) / today.length).toFixed(2);

            const topVol = [...today].sort((a,b)=>(b.成交量||0)-(a.成交量||0)).slice(0,5);
            const topGain = [...today].sort((a,b)=>(b.漲跌幅||0)-(a.漲跌幅||0)).slice(0,5);

            el.innerHTML = `
                <div class="dashboard-grid">
                    <div class="dashboard-widget">
                        <h3>📈 今日市場概況 (${latest})</h3>
                        <div class="stat-row"><div class="stat-label">上漲家數</div><div class="stat-value">${up}</div></div>
                        <div class="stat-row"><div class="stat-label">下跌家數</div><div class="stat-value">${down}</div></div>
                        <div class="stat-row"><div class="stat-label">平均漲跌幅</div><div class="stat-value">${avg}%</div></div>
                    </div>
                    <div class="dashboard-widget">
                        <h3>🔥 成交量前五</h3>
                        ${topVol.map(r=>`
                            <div class="stat-row">
                                <div class="stat-label clickable-stock" onclick="jumpAnalyze('${r.代碼}')">${r.代碼} ${r.商品 || ''}</div>
                                <div class="stat-value">${formatNumber(r.成交量)}</div>
                            </div>`).join('')}
                    </div>
                    <div class="dashboard-widget">
                        <h3>🚀 漲幅前五</h3>
                        ${topGain.map(r=>`
                            <div class="stat-row">
                                <div class="stat-label clickable-stock" onclick="jumpAnalyze('${r.代碼}')">${r.代碼} ${r.商品 || ''}</div>
                                <div class="stat-value trend-positive">+${(+r.漲跌幅||0).toFixed(2)}%</div>
                            </div>`).join('')}
                    </div>
                </div>`;
        }

        function loadMarketData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return [];
                const parsed = JSON.parse(stored);
                return parsed?.data ?? (Array.isArray(parsed) ? parsed : []);
            } catch { return []; }
        }

        function formatNumber(n) {
            return n == null ? '—' : (+n).toLocaleString();
        }

        function jumpAnalyze(code) {
            window.location.href = `analyze.html?code=${code}`;
        }
    </script>
</body>
</html>
