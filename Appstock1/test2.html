<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>成交分析 – 強化版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg1: #667eea;
            --bg2: #764ba2;
            --page: #fff;
            --panel: #fff;
            --panel-bd: rgba(0, 0, 0, .06);
            --shadow: 0 20px 60px rgba(0, 0, 0, .3);
            --head: #fff;
            --text: #333;
            --dim: #666;
            --btn1: #667eea;
            --btn2: #764ba2;
            --section: #f8f9fa;
            --ok: #22c55e;
            --warn: #f59e0b
        }

        body.dark {
            --bg1: #1f2937;
            --bg2: #111827;
            --page: #1e1e2e;
            --panel: #2a2a3a;
            --panel-bd: rgba(255, 255, 255, .08);
            --shadow: 0 20px 60px rgba(0, 0, 0, .8);
            --head: #f0f0f0;
            --text: #f0f0f0;
            --dim: #a0a0b8;
            --btn1: #4f46e5;
            --btn2: #6d28d9;
            --section: #3a3a4a
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%)
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--panel-bd);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 28px
        }

        .head {
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--head);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between
        }

        .head h1 {
            font-size: 1.25rem
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--btn1), var(--btn2));
            font-size: 14px
        }

        .btn.secondary {
            background: transparent;
            color: var(--head);
            border: 1px solid rgba(255, 255, 255, .35)
        }

        .sec {
            background: var(--section);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center
        }

        .fg {
            display: grid;
            gap: 6px
        }

        label {
            font-weight: 600;
            color: var(--text)
        }

        input,
        select {
            padding: 8px 10px;
            border: 1px solid var(--panel-bd);
            border-radius: 8px;
            background: var(--page);
            color: var(--text);
            min-width: 160px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--panel-bd);
            background: var(--page);
            cursor: pointer;
            user-select: none
        }

        .chip.active {
            border-color: transparent;
            background: linear-gradient(135deg, var(--btn1), var(--btn2));
            color: #fff
        }

        .stat {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 12px
        }

        .card {
            background: var(--page);
            border: 1px solid var(--panel-bd);
            border-left: 4px solid var(--btn1);
            border-radius: 8px;
            padding: 12px
        }

        .k {
            font-size: 12px;
            color: var(--dim)
        }

        .v {
            font-weight: 700;
            font-size: 18px;
            margin-top: 4px
        }

        .muted {
            color: var(--dim)
        }

        .chart {
            position: relative;
            height: 420px;
            margin-top: 12px
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="head">
            <h1>📊 成交分析（強化版）</h1>
            <div class="actions">
                <button id="copyLink" class="btn secondary">🔗 複製連結</button>
                <a href="index.html" class="btn secondary">← 返回首頁</a>
            </div>
        </div>

        <div class="sec">
            <div class="row">
                <div class="fg">
                    <label for="code">股票代碼</label>
                    <input id="code" list="codes" placeholder="輸入代碼（如 2330）" />
                    <datalist id="codes"></datalist>
                </div>
                <div class="fg">
                    <label>&nbsp;</label>
                    <button id="run" class="btn">📈 分析</button>
                </div>
            </div>
            <div class="row" style="margin-top:12px">
                <div class="fg" style="min-width:240px">
                    <label>區間</label>
                    <div class="chips" id="rangeChips">
                        <div class="chip" data-range="30D">30D</div>
                        <div class="chip" data-range="90D">90D</div>
                        <div class="chip" data-range="180D">180D</div>
                        <div class="chip" data-range="YTD">YTD</div>
                        <div class="chip active" data-range="ALL">ALL</div>
                    </div>
                </div>
                <div class="fg">
                    <label>指標</label>
                    <div class="chips" id="indChips">
                        <div class="chip" data-ind="h52">52H</div>
                        <div class="chip" data-ind="avg3">平均價3[0]</div>
                        <div class="chip" data-ind="avg5">平均價5[1]</div>
                        <div class="chip active" data-ind="vol">成交量</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="out"></div>
    </div>

    <script>
        // ===== 基本設定與工具 =====
        const STORAGE_KEY = 'stockMarketData_v3';
        const SCHEMA = {
            date: ['日期', 'Date', 'date'],
            code: ['代碼', '代號', '股票代碼', 'Code', 'code'],
            open: ['開盤價', 'Open', 'open'],
            high: ['最高價', 'High', 'high'],
            low: ['最低價', 'Low', 'low'],
            close: ['收盤價', 'Close', 'close'],
            volume: ['成交量', 'Volume', 'volume']
        };
        const $ = s => document.querySelector(s);
        let chart;

        const theme = () => ({
            isDark: document.body.classList.contains('dark'),
            line: 'rgb(103,126,234)',
            fill: 'rgba(103,126,234,.12)',
            gridD: 'rgba(255,255,255,.12)',
            gridL: 'rgba(0,0,0,.1)',
            textD: '#f0f0f0',
            textL: '#333'
        });

        const get = (row, keys) => {
            for (const k of keys) {
                if (row != null && row[k] != null && row[k] !== "") return row[k];
            }
            return undefined;
        };
        const toNum = v => (v == null || v === '') ? null : +v;
        const parseDate = (v) => {
            if (v instanceof Date) return v;
            const s = String(v).replace(/-/g, '/').replace(/\./g, '/');
            const p = s.split('/');
            if (p.length === 3) {
                const [y, m, d] = p.map(n => parseInt(n, 10));
                return new Date(y < 100 ? 2000 + y : y, (m || 1) - 1, d || 1);
            }
            const t = Date.parse(s);
            return Number.isNaN(t) ? new Date() : new Date(t);
        };

        // ===== 載入資料與代碼清單 =====
        function loadMarketData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : (parsed?.data ?? []);
            } catch {
                return [];
            }
        }
        function codesFromData() {
            const data = loadMarketData();
            const codes = new Set();
            for (const r of data) {
                const c = get(r, SCHEMA.code);
                if (c != null && String(c).trim()) codes.add(String(c).toUpperCase());
            }
            return [...codes].sort();
        }
        function populateDatalist() {
            const dl = $('#codes');
            if (!dl) return;
            dl.innerHTML = codesFromData().map(c => `<option value="${c}"></option>`).join('');
        }

        // ===== 主流程 =====
        function analyze() {
            const code = String($('#code').value || '').trim().toUpperCase();
            const out = $('#out');
            const data = loadMarketData();

            if (!code || data.length === 0) {
                out.innerHTML = `<div class="sec"><span class="muted">請輸入代碼，且先於首頁載入資料。</span></div>`;
                return;
            }

            // 正規化：加上 h52 / avg3 / avg5
            const norm = data.map(r => ({
                date: parseDate(get(r, SCHEMA.date)),
                code: String(get(r, SCHEMA.code) || '').toUpperCase(),
                open: toNum(get(r, SCHEMA.open)) ?? 0,
                high: toNum(get(r, SCHEMA.high)) ?? 0,
                low: toNum(get(r, SCHEMA.low)) ?? 0,
                close: toNum(get(r, SCHEMA.close)) ?? 0,
                vol: toNum(get(r, SCHEMA.volume)),
                h52: toNum(r['52H'] ?? r['52H價']),
                avg3: toNum(r['平均價3[0]'] ?? r['均價[0+1+2]'] ?? r['平均價3']),
                avg5: toNum(r['平均價5[1]'] ?? r['均價[1+2+3+4+5]'] ?? r['平均價5'])
            }))
                .filter(r => r.code === code && r.date instanceof Date && !Number.isNaN(+r.date))
                .sort((a, b) => a.date - b.date);

            if (norm.length === 0) {
                out.innerHTML = `<div class="sec"><span class="muted">找不到該股票數據。</span></div>`;
                return;
            }

            // 區間
            const range = document.querySelector('.chip[data-range].active')?.dataset.range || 'ALL';
            const sliced = applyRange(norm, range);

            // 指標開關
            const show = indFlags();

            // 資料序列
            const labels = sliced.map(r => r.date.toISOString().slice(0, 10));
            const closes = sliced.map(r => r.close);
            const vols = sliced.map(r => r.vol);
            const h52Arr = sliced.map(r => r.h52);
            const avg3Arr = sliced.map(r => r.avg3);
            const avg5Arr = sliced.map(r => r.avg5);

            const t = theme();
            const textColor = t.isDark ? t.textD : t.textL;
            const gridColor = t.isDark ? t.gridD : t.gridL;

            const first = norm[0];
            const last = norm[norm.length - 1];

            out.innerHTML = `
      <div class="sec">
        <div class="row">
          <div class="card" style="flex:1 1 160px"><div class="k">開盤價（首日）</div><div class="v">${first.open.toFixed(2)}</div></div>
          <div class="card" style="flex:1 1 160px"><div class="k">收盤價（末日）</div><div class="v">${last.close.toFixed(2)}</div></div>
          <div class="card" style="flex:1 1 160px"><div class="k">最高價</div><div class="v">${Math.max(...norm.map(r => r.high)).toFixed(2)}</div></div>
          <div class="card" style="flex:1 1 160px"><div class="k">最低價</div><div class="v">${Math.min(...norm.map(r => r.low)).toFixed(2)}</div></div>
          <div class="card" style="flex:1 1 160px"><div class="k">漲跌幅（首→末）</div><div class="v">${(((last.close - first.open) / Math.max(first.open, 1)) * 100).toFixed(2)}%</div></div>
          <div class="card" style="flex:1 1 160px"><div class="k">筆數</div><div class="v">${norm.length}</div></div>
        </div>
        <div class="chart"><canvas id="c"></canvas></div>
      </div>`;

            // 繪圖
            const ctx = document.getElementById('c').getContext('2d');
            if (chart) {
                chart.destroy();
                chart = null;
            }

            const datasets = [
                {
                    type: 'line',
                    label: '收盤價',
                    data: closes,
                    borderColor: t.line,
                    backgroundColor: t.fill,
                    borderWidth: 2,
                    tension: .35,
                    fill: true,
                    pointRadius: 0
                }
            ];

            if (show.h52 && h52Arr.some(v => v != null)) {
                datasets.push({
                    type: 'line',
                    label: '52H',
                    data: h52Arr,
                    borderWidth: 1.5,
                    borderDash: [4, 3],
                    pointRadius: 0
                });
            }
            if (show.avg3 && avg3Arr.some(v => v != null)) {
                datasets.push({
                    type: 'line',
                    label: '平均價3[0]',
                    data: avg3Arr,
                    borderWidth: 1.5,
                    borderDash: [6, 4],
                    pointRadius: 0
                });
            }
            if (show.avg5 && avg5Arr.some(v => v != null)) {
                datasets.push({
                    type: 'line',
                    label: '平均價5[1]',
                    data: avg5Arr,
                    borderWidth: 1.5,
                    borderDash: [8, 5],
                    pointRadius: 0
                });
            }
            if (show.vol && vols.some(v => v != null)) {
                datasets.push({
                    type: 'bar',
                    label: '成交量',
                    data: vols,
                    yAxisID: 'y2',
                    borderWidth: 0,
                    barThickness: 'flex'
                });
            }

            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: textColor } },
                        tooltip: {
                            callbacks: {
                                label: (ctx) =>
                                    ctx.dataset.type === 'bar'
                                        ? `成交量：${(ctx.parsed.y ?? 0).toLocaleString()}`
                                        : `${ctx.dataset.label}：${(ctx.parsed.y ?? 0).toFixed(2)}`
                            }
                        }
                    },
                    scales: {
                        x: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y: { ticks: { color: textColor }, grid: { color: gridColor } },
                        y2: { position: 'right', grid: { display: false }, ticks: { color: textColor } }
                    }
                }
            });

            // 同步 URL 與本地狀態
            const url = new URL(location.href);
            url.searchParams.set('code', code);
            url.searchParams.set('range', range);
            history.replaceState(null, '', url);
            localStorage.setItem('analyze_last_code', code);
            localStorage.setItem('analyze_last_range', range);
        }

        function applyRange(rows, range) {
            if (range === 'ALL') return rows;
            if (['30D', '90D', '180D'].includes(range)) return rows.slice(-Number(range.replace('D', '')));
            if (range === 'YTD') {
                const y0 = new Date(new Date().getFullYear(), 0, 1);
                return rows.filter(r => r.date >= y0);
            }
            return rows;
        }

        function indFlags() {
            const flags = { h52: false, avg3: false, avg5: false, vol: false };
            document.querySelectorAll('#indChips .chip').forEach(ch => {
                if (ch.classList.contains('active')) flags[ch.dataset.ind] = true;
            });
            return flags;
        }

        // ===== 事件繫結 =====
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme_dark') === '1') document.body.classList.add('dark');
            populateDatalist();

            // 讀 query / 恢復上次
            const p = new URLSearchParams(location.search);
            const code = p.get('code') || localStorage.getItem('analyze_last_code') || '';
            const range = p.get('range') || localStorage.getItem('analyze_last_range') || 'ALL';
            if (code) $('#code').value = code;
            document.querySelectorAll('#rangeChips .chip').forEach(ch => {
                ch.classList.toggle('active', ch.dataset.range === range);
            });

            // 互動
            $('#run').addEventListener('click', analyze);
            $('#code').addEventListener('keydown', e => { if (e.key === 'Enter') analyze(); });
            document.getElementById('rangeChips').addEventListener('click', e => {
                const el = e.target.closest('.chip'); if (!el) return;
                document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active'); analyze();
            });
            document.getElementById('indChips').addEventListener('click', e => {
                const el = e.target.closest('.chip'); if (!el) return;
                el.classList.toggle('active'); analyze();
            });
            document.getElementById('copyLink').addEventListener('click', () => {
                navigator.clipboard.writeText(location.href).then(() => {
                    const b = document.getElementById('copyLink');
                    const txt = b.textContent;
                    b.textContent = '✅ 已複製';
                    setTimeout(() => b.textContent = txt, 900);
                });
            });

            // 若已帶 code 參數，直接分析
            if ($('#code').value) analyze();
        });
    </script>
</body>

</html>
