<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>價格警示 - 股票分析系統</title>
    <style>
        :root {
            --bg-gradient-start: #667eea; --bg-gradient-end: #764ba2; --page-bg: #ffffff;
            --panel-bg: #ffffff; --panel-border: rgba(0, 0, 0, 0.05); --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --header-text: #ffffff; --text-main: #333; --text-dim: #666; --btn-bg-start: #667eea;
            --btn-bg-end: #764ba2; --btn-text: #ffffff; --section-bg: #f8f9fa;
        }
        body.dark {
            --bg-gradient-start: #1f2937; --bg-gradient-end: #111827; --page-bg: #1e1e2e;
            --panel-bg: #2a2a3a; --panel-border: rgba(255, 255, 255, 0.07);
            --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); --header-text: #f0f0f0;
            --text-main: #f0f0f0; --text-dim: #a0a0b8; --btn-bg-start: #4f46e5;
            --btn-bg-end: #6d28d9; --section-bg: #3a3a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; padding: 20px; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--panel-bg); border-radius: 15px;
            padding: 30px; box-shadow: var(--panel-shadow); border: 1px solid var(--panel-border); }
        .header { background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px; border-radius: 10px; color: var(--header-text); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.8em; }
        .btn-back { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: var(--btn-text); border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .section { background: var(--section-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr 100px; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; color: var(--text-main); font-size: 13px; }
        .form-group input { padding: 8px; border: 1px solid var(--panel-border); border-radius: 6px;
            background: var(--page-bg); color: var(--text-main); font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th { background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: white; padding: 12px; text-align: left; font-weight: 600; }
        table td { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
        .muted { color: var(--text-dim); }
        .trend-positive { color: #ff6b6b; }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⏰ 價格警示</h1>
            <a href="index.html" class="btn-back">← 返回首頁</a>
        </div>

        <div class="section">
            <h2>設置價格警示</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>股票代碼</label>
                    <input type="text" id="alertCode" placeholder="如 2330" />
                </div>
                <div class="form-group">
                    <label>≥ 價格</label>
                    <input type="number" id="alertAbove" placeholder="上限" step="0.01" />
                </div>
                <div class="form-group">
                    <label>≤ 價格</label>
                    <input type="number" id="alertBelow" placeholder="下限" step="0.01" />
                </div>
                <div class="form-group" style="justify-content: flex-end;">
                    <button class="btn" onclick="addAlert()" style="width: 100%;">添加</button>
                </div>
            </div>
        </div>

        <div class="section" id="alertsContent">
            <div class="muted">尚未設定任何警示</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stockMarketData_v3';
        const ALERTS_KEY = 'priceAlerts_v3';
        let alerts = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadAlerts();
            updateAlertsDisplay();
        });

        function initTheme() {
            if (localStorage.getItem('theme_dark') === '1') document.body.classList.add('dark');
        }

        function loadAlerts() {
            try {
                alerts = JSON.parse(localStorage.getItem(ALERTS_KEY)) || [];
            } catch { alerts = []; }
        }

        function saveAlerts() {
            localStorage.setItem(ALERTS_KEY, JSON.stringify(alerts));
        }

        function addAlert() {
            const code = document.getElementById('alertCode').value.trim().toUpperCase();
            const above = parseFloat(document.getElementById('alertAbove').value);
            const below = parseFloat(document.getElementById('alertBelow').value);

            if (!code || (isNaN(above) && isNaN(below))) {
                alert('請填寫代碼和至少一個價格');
                return;
            }

            alerts.push({
                code,
                above: isNaN(above) ? null : above,
                below: isNaN(below) ? null : below
            });
            saveAlerts();
            updateAlertsDisplay();
            document.getElementById('alertCode').value = '';
            document.getElementById('alertAbove').value = '';
            document.getElementById('alertBelow').value = '';
        }

        function updateAlertsDisplay() {
            const el = document.getElementById('alertsContent');
            if (!alerts.length) {
                el.innerHTML = '<div class="muted">尚未設定任何警示</div>';
                return;
            }

            const marketData = loadMarketData();
            const lastDate = [...new Set(marketData.map(d=>d.日期))].sort().slice(-1)[0];
            const today = marketData.filter(d=>d.日期===lastDate);
            const map = new Map(today.map(r=>[r.代碼, r]));

            const rows = alerts.map(a=>{
                const m = map.get(a.code);
                const price = m ? (+m.收盤價||0) : NaN;
                const hitAbove = (a.above!=null && !isNaN(price) && price>=a.above);
                const hitBelow = (a.below!=null && !isNaN(price) && price<=a.below);
                const status = (hitAbove||hitBelow) ? '觸發' : '—';
                return { ...a, price, status };
            });

            el.innerHTML = `
                <table>
                    <thead><tr><th>代碼</th><th>現價</th><th>≥</th><th>≤</th><th>狀態</th><th>操作</th></tr></thead>
                    <tbody>
                        ${rows.map((r,i)=>`
                            <tr>
                                <td>${r.code}</td>
                                <td>${isNaN(r.price)?'—':r.price.toFixed(2)}</td>
                                <td>${r.above==null?'—':r.above.toFixed(2)}</td>
                                <td>${r.below==null?'—':r.below.toFixed(2)}</td>
                                <td class="${r.status==='觸發'?'trend-positive':'muted'}">${r.status}</td>
                                <td><button class="btn" onclick="removeAlert(${i})">刪除</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function removeAlert(idx) {
            alerts.splice(idx, 1);
            saveAlerts();
            updateAlertsDisplay();
        }

        function loadMarketData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return [];
                const parsed = JSON.parse(stored);
                return parsed?.data ?? (Array.isArray(parsed) ? parsed : []);
            } catch { return []; }
        }
    </script>
</body>
</html>
