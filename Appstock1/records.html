<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資紀錄 - 股票分析系統</title>
    <style>
        :root {
            --bg-gradient-start: #667eea; --bg-gradient-end: #764ba2; --page-bg: #ffffff;
            --panel-bg: #ffffff; --panel-border: rgba(0, 0, 0, 0.05); --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --header-text: #ffffff; --text-main: #333; --text-dim: #666; --btn-bg-start: #667eea;
            --btn-bg-end: #764ba2; --btn-text: #ffffff; --section-bg: #f8f9fa;
        }
        body.dark {
            --bg-gradient-start: #1f2937; --bg-gradient-end: #111827; --page-bg: #1e1e2e;
            --panel-bg: #2a2a3a; --panel-border: rgba(255, 255, 255, 0.07);
            --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); --header-text: #f0f0f0;
            --text-main: #f0f0f0; --text-dim: #a0a0b8; --btn-bg-start: #4f46e5;
            --btn-bg-end: #6d28d9; --section-bg: #3a3a4a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; padding: 20px; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--panel-bg); border-radius: 15px;
            padding: 30px; box-shadow: var(--panel-shadow); border: 1px solid var(--panel-border); }
        .header { background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px; border-radius: 10px; color: var(--header-text); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.8em; }
        .btn-back { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: var(--btn-text); border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .section { background: var(--section-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; color: var(--text-main); font-size: 14px; }
        .form-group input, .form-group textarea { padding: 8px; border: 1px solid var(--panel-border); border-radius: 6px;
            background: var(--page-bg); color: var(--text-main); font-family: inherit; }
        .form-group textarea { resize: vertical; min-height: 60px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th { background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: white; padding: 12px; text-align: left; font-weight: 600; }
        table td { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
        .muted { color: var(--text-dim); }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 投資紀錄</h1>
            <a href="index.html" class="btn-back">← 返回首頁</a>
        </div>

        <div class="section">
            <h2>新增紀錄</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>日期</label>
                    <input type="date" id="recordDate" />
                </div>
                <div class="form-group">
                    <label>股票代碼</label>
                    <input type="text" id="recordCode" placeholder="如 2330" />
                </div>
            </div>
            <div class="form-group">
                <label>備註</label>
                <textarea id="recordNote" placeholder="輸入分析內容或備註..."></textarea>
            </div>
            <button class="btn" onclick="addRecord()">➕ 新增</button>
        </div>

        <div class="section" id="recordsContent">
            <div class="muted">尚無個人紀錄</div>
        </div>
    </div>

    <script>
        const RECORDS_KEY = 'stockRecords_v3';
        let records = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadRecords();
            setDefaultDate();
            updateRecordsDisplay();
        });

        function initTheme() {
            if (localStorage.getItem('theme_dark') === '1') document.body.classList.add('dark');
        }

        function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('recordDate').value = today;
        }

        function loadRecords() {
            try {
                const stored = localStorage.getItem(RECORDS_KEY);
                if (!stored) return;
                const parsed = JSON.parse(stored);
                records = parsed?.records ?? (Array.isArray(parsed) ? parsed : []);
            } catch { records = []; }
        }

        function saveRecords() {
            const payload = {
                version: '2.0',
                lastUpdate: new Date().toISOString(),
                recordCount: records.length,
                records: records
            };
            localStorage.setItem(RECORDS_KEY, JSON.stringify(payload));
        }

        function addRecord() {
            const date = document.getElementById('recordDate').value;
            const code = document.getElementById('recordCode').value.trim().toUpperCase();
            const note = document.getElementById('recordNote').value.trim();

            if (!date || !code) {
                alert('請填寫日期和代碼');
                return;
            }

            records.push({
                date,
                code,
                note,
                ts: Date.now()
            });

            saveRecords();
            updateRecordsDisplay();
            document.getElementById('recordCode').value = '';
            document.getElementById('recordNote').value = '';
            setDefaultDate();
        }

        function updateRecordsDisplay() {
            const el = document.getElementById('recordsContent');
            if (!records.length) {
                el.innerHTML = '<div class="muted">尚無個人紀錄</div>';
                return;
            }

            const rows = [...records].sort((a,b)=>b.ts-a.ts);
            el.innerHTML = `
                <table>
                    <thead><tr><th>日期</th><th>代碼</th><th>備註</th><th>操作</th></tr></thead>
                    <tbody>
                        ${rows.map((r,i)=>`
                            <tr>
                                <td>${r.date}</td>
                                <td>${r.code}</td>
                                <td>${r.note||'-'}</td>
                                <td><button class="btn" onclick="removeRecord(${i})">刪除</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function removeRecord(idx) {
            const rows = [...records].sort((a,b)=>b.ts-a.ts);
            const record = rows[idx];
            records = records.filter(r => r.ts !== record.ts);
            saveRecords();
            updateRecordsDisplay();
        }
    </script>
</body>
</html>
