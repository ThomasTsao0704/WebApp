<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>K 線圖 – ECharts 版</title>
    <!-- ECharts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        :root {
            --bg1: #667eea;
            --bg2: #764ba2;
            --page: #fff;
            --panel: #fff;
            --panel-bd: rgba(0, 0, 0, .06);
            --shadow: 0 20px 60px rgba(0, 0, 0, .3);
            --head: #fff;
            --text: #333;
            --dim: #666;
            --btn1: #667eea;
            --btn2: #764ba2;
            --section: #f8f9fa;
            --ok: #22c55e;
            --warn: #f59e0b
        }

        body.dark {
            --bg1: #1f2937;
            --bg2: #111827;
            --page: #1e1e2e;
            --panel: #2a2a3a;
            --panel-bd: rgba(255, 255, 255, .08);
            --shadow: 0 20px 60px rgba(0, 0, 0, .8);
            --head: #f0f0f0;
            --text: #f0f0f0;
            --dim: #a0a0b8;
            --btn1: #4f46e5;
            --btn2: #6d28d9;
            --section: #3a3a4a
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%)
        }

        .wrap {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid var(--panel-bd);
            border-radius: 16px;
            box-shadow: var(--shadow);
            padding: 28px
        }

        .head {
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--head);
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between
        }

        .head h1 {
            font-size: 1.25rem
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(135deg, var(--btn1), var(--btn2));
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn.secondary {
            background: transparent;
            color: var(--head);
            border: 1px solid rgba(255, 255, 255, .35)
        }

        .sec {
            background: var(--section);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 16px
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center
        }

        .fg {
            display: grid;
            gap: 6px
        }

        label {
            font-weight: 600;
            color: var(--text)
        }

        input {
            padding: 8px 10px;
            border: 1px solid var(--panel-bd);
            border-radius: 8px;
            background: var(--page);
            color: var(--text);
            min-width: 160px
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .chip {
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid var(--panel-bd);
            background: var(--page);
            cursor: pointer;
            user-select: none;
            font-size: 13px;
        }

        .chip.active {
            border-color: transparent;
            background: linear-gradient(135deg, var(--btn1), var(--btn2));
            color: #fff
        }

        .card {
            background: var(--page);
            border: 1px solid var(--panel-bd);
            border-left: 4px solid var(--btn1);
            border-radius: 8px;
            padding: 12px;
            min-width: 150px;
            flex: 1 1 150px;
        }

        .k {
            font-size: 12px;
            color: var(--dim)
        }

        .v {
            font-weight: 700;
            font-size: 18px;
            margin-top: 4px
        }

        .muted {
            color: var(--dim);
            font-size: 13px;
        }

        .chart {
            position: relative;
            height: 460px;
            margin-top: 12px
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="head">
            <h1>📉 K 線圖（ECharts 版）</h1>
            <div class="actions">
                <button id="copyLink" class="btn secondary">🔗 複製連結</button>
                <!-- 如需連回成交分析頁，可以把 href 改成你的檔名 -->
                <!-- <a href="analyze.html" class="btn secondary">↔ 成交分析（Chart.js）</a> -->
                <a href="index.html" class="btn secondary">← 返回首頁</a>
            </div>
        </div>

        <div class="sec">
            <div class="row">
                <div class="fg">
                    <label for="code">股票代碼</label>
                    <input id="code" list="codes" placeholder="輸入代碼（如 2330）" />
                    <datalist id="codes"></datalist>
                </div>
                <div class="fg">
                    <label>&nbsp;</label>
                    <button id="run" class="btn">📈 繪製 K 線</button>
                </div>
            </div>
            <div class="row" style="margin-top:12px">
                <div class="fg" style="min-width:240px">
                    <label>區間</label>
                    <div class="chips" id="rangeChips">
                        <div class="chip" data-range="30D">30D</div>
                        <div class="chip" data-range="90D">90D</div>
                        <div class="chip" data-range="180D">180D</div>
                        <div class="chip" data-range="YTD">YTD</div>
                        <div class="chip active" data-range="ALL">ALL</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="out"></div>
    </div>

    <script>
        // ===== 設定與工具 =====
        const STORAGE_KEY = 'stockMarketData_v3';
        const SCHEMA = {
            date: ['日期', 'Date', 'date'],
            code: ['代碼', '代號', '股票代碼', 'Code', 'code'],
            open: ['開盤價', 'Open', 'open'],
            high: ['最高價', 'High', 'high'],
            low: ['最低價', 'Low', 'low'],
            close: ['收盤價', 'Close', 'close'],
            volume: ['成交量', 'Volume', 'volume']
        };
        const $ = s => document.querySelector(s);
        let kChart = null;

        const get = (row, keys) => {
            for (const k of keys) {
                if (row != null && row[k] != null && row[k] !== "") return row[k];
            }
            return undefined;
        };
        const toNum = v => (v == null || v === '') ? null : +v;
        const parseDate = (v) => {
            if (v instanceof Date) return v;
            const s = String(v).replace(/-/g, '/').replace(/\./g, '/');
            const p = s.split('/');
            if (p.length === 3) {
                const [y, m, d] = p.map(n => parseInt(n, 10));
                return new Date(y < 100 ? 2000 + y : y, (m || 1) - 1, d || 1);
            }
            const t = Date.parse(s);
            return Number.isNaN(t) ? new Date() : new Date(t);
        };

        function loadMarketData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : (parsed?.data ?? []);
            } catch {
                return [];
            }
        }

        function codesFromData() {
            const data = loadMarketData();
            const codes = new Set();
            for (const r of data) {
                const c = get(r, SCHEMA.code);
                if (c != null && String(c).trim()) codes.add(String(c).toUpperCase());
            }
            return [...codes].sort();
        }

        function populateDatalist() {
            const dl = $('#codes');
            if (!dl) return;
            dl.innerHTML = codesFromData().map(c => `<option value="${c}"></option>`).join('');
        }

        function applyRange(rows, range) {
            if (range === 'ALL') return rows;
            if (['30D', '90D', '180D'].includes(range)) {
                const n = Number(range.replace('D', ''));
                return rows.slice(-n);
            }
            if (range === 'YTD') {
                const y0 = new Date(new Date().getFullYear(), 0, 1);
                return rows.filter(r => r.date >= y0);
            }
            return rows;
        }

        function normalizeForCode(code) {
            const data = loadMarketData();
            if (!data.length) return [];
            const norm = data.map(r => {
                const dateObj = parseDate(get(r, SCHEMA.date));
                const c = String(get(r, SCHEMA.code) || '').toUpperCase();
                return {
                    date: dateObj,
                    dateStr: dateObj instanceof Date && !Number.isNaN(+dateObj) ? dateObj.toISOString().slice(0, 10) : '',
                    code: c,
                    open: toNum(get(r, SCHEMA.open)),
                    high: toNum(get(r, SCHEMA.high)),
                    low: toNum(get(r, SCHEMA.low)),
                    close: toNum(get(r, SCHEMA.close)),
                    vol: toNum(get(r, SCHEMA.volume)),
                    h52: toNum(r['52H'] ?? r['52H價']),
                    avg3: toNum(r['平均價3[0]'] ?? r['均價[0+1+2]'] ?? r['平均價3']),
                    avg5: toNum(r['平均價5[1]'] ?? r['均價[1+2+3+4+5]'] ?? r['平均價5'])
                };
            }).filter(r =>
                r.code === code &&
                r.date instanceof Date &&
                !Number.isNaN(+r.date) &&
                r.open != null && r.high != null && r.low != null && r.close != null
            ).sort((a, b) => a.date - b.date);

            return norm;
        }

        function renderKLine(dates, ohlc, volumes, h52Arr, avg3Arr, avg5Arr) {
            const container = document.getElementById('kchart');
            if (!container) return;

            if (kChart) {
                kChart.dispose();
                kChart = null;
            }

            const styles = getComputedStyle(document.body);
            const textColor = (styles.getPropertyValue('--text') || '#333').trim();
            const dimColor = (styles.getPropertyValue('--dim') || '#666').trim();
            const gridColor = (styles.getPropertyValue('--panel-bd') || 'rgba(0,0,0,0.1)').trim();

            const upColor = '#ef4444';     // 漲：紅
            const downColor = '#22c55e';   // 跌：綠

            kChart = echarts.init(container);

            const series = [];

            series.push({
                name: 'K 線',
                type: 'candlestick',
                data: ohlc,
                itemStyle: {
                    color: upColor,
                    color0: downColor,
                    borderColor: upColor,
                    borderColor0: downColor
                }
            });

            if (h52Arr.some(v => v != null)) {
                series.push({
                    name: '52H',
                    type: 'line',
                    data: h52Arr,
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { width: 1.2 },
                    yAxisIndex: 0,
                    xAxisIndex: 0
                });
            }

            if (avg3Arr.some(v => v != null)) {
                series.push({
                    name: '平均價3[0]',
                    type: 'line',
                    data: avg3Arr,
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { width: 1.2, type: 'dashed' },
                    yAxisIndex: 0,
                    xAxisIndex: 0
                });
            }

            if (avg5Arr.some(v => v != null)) {
                series.push({
                    name: '平均價5[1]',
                    type: 'line',
                    data: avg5Arr,
                    smooth: true,
                    symbol: 'none',
                    lineStyle: { width: 1.2, type: 'dotted' },
                    yAxisIndex: 0,
                    xAxisIndex: 0
                });
            }

            series.push({
                name: '成交量',
                type: 'bar',
                data: volumes,
                xAxisIndex: 1,
                yAxisIndex: 1,
                barWidth: '60%',
                itemStyle: {
                    color: 'rgba(148, 163, 184, 0.8)'
                }
            });

            const option = {
                backgroundColor: 'transparent',
                animation: false,
                legend: {
                    textStyle: { color: textColor }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                axisPointer: {
                    link: [{ xAxisIndex: [0, 1] }],
                    label: {
                        backgroundColor: '#4b5563'
                    }
                },
                grid: [
                    { left: '10%', right: '8%', top: 50, height: '55%' },
                    { left: '10%', right: '8%', top: '75%', height: '15%' }
                ],
                xAxis: [
                    {
                        type: 'category',
                        data: dates,
                        boundaryGap: false,
                        axisLine: { lineStyle: { color: gridColor } },
                        axisLabel: { color: dimColor },
                        axisTick: { show: false },
                        min: 'dataMin',
                        max: 'dataMax'
                    },
                    {
                        type: 'category',
                        gridIndex: 1,
                        data: dates,
                        boundaryGap: false,
                        axisLine: { lineStyle: { color: gridColor } },
                        axisLabel: { show: false },
                        axisTick: { show: false },
                        min: 'dataMin',
                        max: 'dataMax'
                    }
                ],
                yAxis: [
                    {
                        scale: true,
                        splitArea: { show: true },
                        axisLine: { lineStyle: { color: gridColor } },
                        axisLabel: { color: dimColor },
                        splitLine: { lineStyle: { color: gridColor } }
                    },
                    {
                        gridIndex: 1,
                        scale: true,
                        axisLabel: { show: false },
                        axisTick: { show: false },
                        axisLine: { show: false },
                        splitLine: { show: false }
                    }
                ],
                dataZoom: [
                    {
                        type: 'inside',
                        xAxisIndex: [0, 1],
                        start: 60,
                        end: 100
                    },
                    {
                        show: true,
                        xAxisIndex: [0, 1],
                        type: 'slider',
                        top: '92%',
                        start: 60,
                        end: 100
                    }
                ],
                series
            };

            kChart.setOption(option);
            window.addEventListener('resize', () => {
                if (kChart) kChart.resize();
            });
        }

        function analyze() {
            const code = String($('#code').value || '').trim().toUpperCase();
            const out = $('#out');
            const allData = loadMarketData();

            if (!code || allData.length === 0) {
                out.innerHTML = `<div class="sec"><span class="muted">請輸入代碼，且先於首頁載入資料（stockMarketData_v3）。</span></div>`;
                return;
            }

            const norm = normalizeForCode(code);
            if (norm.length === 0) {
                out.innerHTML = `<div class="sec"><span class="muted">找不到該股票的有效 OHLC 資料。</span></div>`;
                return;
            }

            const range = document.querySelector('.chip[data-range].active')?.dataset.range || 'ALL';
            const sliced = applyRange(norm, range);
            if (sliced.length < 2) {
                out.innerHTML = `<div class="sec"><span class="muted">目前區間內資料筆數不足，無法繪製 K 線。</span></div>`;
                return;
            }

            const dates = sliced.map(r => r.dateStr || r.date.toISOString().slice(0, 10));
            const ohlc = sliced.map(r =>
                (r.open != null && r.close != null && r.low != null && r.high != null)
                    ? [r.open, r.close, r.low, r.high]    // ECharts K 線順序：open, close, low, high
                    : ['-', '-', '-', '-']
            );
            const volumes = sliced.map(r => r.vol != null ? r.vol : '-');
            const h52Arr = sliced.map(r => r.h52 != null ? r.h52 : null);
            const avg3Arr = sliced.map(r => r.avg3 != null ? r.avg3 : null);
            const avg5Arr = sliced.map(r => r.avg5 != null ? r.avg5 : null);

            const first = sliced[0];
            const last = sliced[sliced.length - 1];
            const hi = Math.max(...sliced.map(r => r.high ?? -Infinity));
            const lo = Math.min(...sliced.map(r => r.low ?? Infinity));
            const volSum = sliced.reduce((s, r) => s + (r.vol || 0), 0);

            out.innerHTML = `
        <div class="sec">
          <div class="row">
            <div class="card">
              <div class="k">起始日期</div>
              <div class="v">${first.dateStr}</div>
            </div>
            <div class="card">
              <div class="k">結束日期</div>
              <div class="v">${last.dateStr}</div>
            </div>
            <div class="card">
              <div class="k">最高價</div>
              <div class="v">${hi.toFixed(2)}</div>
            </div>
            <div class="card">
              <div class="k">最低價</div>
              <div class="v">${lo.toFixed(2)}</div>
            </div>
            <div class="card">
              <div class="k">區間筆數</div>
              <div class="v">${sliced.length}</div>
            </div>
            <div class="card">
              <div class="k">成交量總和</div>
              <div class="v">${volSum.toLocaleString()}</div>
            </div>
          </div>
          <div class="chart">
            <div id="kchart" style="width:100%;height:100%"></div>
          </div>
        </div>
      `;

            renderKLine(dates, ohlc, volumes, h52Arr, avg3Arr, avg5Arr);

            // 同步 URL 與本地狀態
            const url = new URL(location.href);
            url.searchParams.set('code', code);
            url.searchParams.set('range', range);
            history.replaceState(null, '', url);
            localStorage.setItem('kline_last_code', code);
            localStorage.setItem('kline_last_range', range);
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('theme_dark') === '1') {
                document.body.classList.add('dark');
            }

            populateDatalist();

            const p = new URLSearchParams(location.search);
            const code = p.get('code') || localStorage.getItem('kline_last_code') || '';
            const range = p.get('range') || localStorage.getItem('kline_last_range') || 'ALL';

            if (code) $('#code').value = code;
            document.querySelectorAll('#rangeChips .chip').forEach(ch => {
                ch.classList.toggle('active', ch.dataset.range === range);
            });

            $('#run').addEventListener('click', analyze);
            $('#code').addEventListener('keydown', e => {
                if (e.key === 'Enter') analyze();
            });
            document.getElementById('rangeChips').addEventListener('click', e => {
                const el = e.target.closest('.chip'); if (!el) return;
                document.querySelectorAll('#rangeChips .chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                if ($('#code').value.trim()) analyze();
            });
            document.getElementById('copyLink').addEventListener('click', () => {
                navigator.clipboard.writeText(location.href).then(() => {
                    const b = document.getElementById('copyLink');
                    const txt = b.textContent;
                    b.textContent = '✅ 已複製';
                    setTimeout(() => b.textContent = txt, 900);
                });
            });

            if ($('#code').value.trim()) analyze();
        });
    </script>
</body>

</html>
