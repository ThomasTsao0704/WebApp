<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資組合 - 股票分析系統</title>
    <style>
        :root {
            --bg-gradient-start: #667eea; --bg-gradient-end: #764ba2; --page-bg: #ffffff;
            --panel-bg: #ffffff; --panel-border: rgba(0, 0, 0, 0.05); --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            --header-text: #ffffff; --text-main: #333; --text-dim: #666; --btn-bg-start: #667eea;
            --btn-bg-end: #764ba2; --btn-text: #ffffff; --section-bg: #f8f9fa;
            --trend-pos: #e74c3c; --trend-neg: #27ae60;
        }
        body.dark {
            --bg-gradient-start: #1f2937; --bg-gradient-end: #111827; --page-bg: #1e1e2e;
            --panel-bg: #2a2a3a; --panel-border: rgba(255, 255, 255, 0.07);
            --panel-shadow: 0 20px 60px rgba(0, 0, 0, 0.8); --header-text: #f0f0f0;
            --text-main: #f0f0f0; --text-dim: #a0a0b8; --btn-bg-start: #4f46e5;
            --btn-bg-end: #6d28d9; --section-bg: #3a3a4a; --trend-pos: #ff6b6b; --trend-neg: #4ade80;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh; padding: 20px; color: var(--text-main); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--panel-bg); border-radius: 15px;
            padding: 30px; box-shadow: var(--panel-shadow); border: 1px solid var(--panel-border); }
        .header { background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            padding: 20px; border-radius: 10px; color: var(--header-text); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.8em; }
        .btn-back { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.3);
            color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 14px; }
        .btn { display: inline-block; padding: 10px 20px; background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: var(--btn-text); border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-right: 10px; }
        .section { background: var(--section-bg); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; color: var(--text-main); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; color: var(--text-main); font-size: 14px; }
        .form-group input { padding: 8px; border: 1px solid var(--panel-border); border-radius: 6px;
            background: var(--page-bg); color: var(--text-main); font-family: inherit; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        table th { background: linear-gradient(135deg, var(--btn-bg-start) 0%, var(--btn-bg-end) 100%);
            color: white; padding: 12px; text-align: left; font-weight: 600; font-size: 13px; }
        table td { padding: 10px 12px; border-bottom: 1px solid var(--panel-border); }
        table tr:hover { background: var(--section-bg); }
        .trend-positive { color: var(--trend-pos); }
        .trend-negative { color: var(--trend-neg); }
        .muted { color: var(--text-dim); }
        @media (max-width: 768px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💼 投資組合</h1>
            <a href="index.html" class="btn-back">← 返回首頁</a>
        </div>

        <div class="section">
            <h2>新增持股</h2>
            <div class="form-row">
                <div class="form-group">
                    <label>股票代碼</label>
                    <input type="text" id="portfolioCode" placeholder="如 2330" />
                </div>
                <div class="form-group">
                    <label>數量</label>
                    <input type="number" id="portfolioQty" placeholder="1000" />
                </div>
                <div class="form-group">
                    <label>成本價</label>
                    <input type="number" id="portfolioCost" placeholder="150.0" step="0.01" />
                </div>
            </div>
            <button class="btn" onclick="addPortfolio()">➕ 新增</button>
        </div>

        <div class="section" id="portfolioContent">
            <div class="muted">尚未新增持股</div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'stockMarketData_v3';
        const PORTFOLIO_KEY = 'stockPortfolio_v3';
        let portfolio = [];

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadPortfolio();
            updatePortfolioDisplay();
        });

        function initTheme() {
            if (localStorage.getItem('theme_dark') === '1') document.body.classList.add('dark');
        }

        function loadPortfolio() {
            try {
                portfolio = JSON.parse(localStorage.getItem(PORTFOLIO_KEY)) || [];
            } catch { portfolio = []; }
        }

        function savePortfolio() {
            localStorage.setItem(PORTFOLIO_KEY, JSON.stringify(portfolio));
        }

        function addPortfolio() {
            const code = document.getElementById('portfolioCode').value.trim().toUpperCase();
            const qty = parseFloat(document.getElementById('portfolioQty').value);
            const cost = parseFloat(document.getElementById('portfolioCost').value);

            if (!code || !qty || !cost) {
                alert('請填寫所有欄位');
                return;
            }

            portfolio.push({ code, qty, cost });
            savePortfolio();
            updatePortfolioDisplay();
            document.getElementById('portfolioCode').value = '';
            document.getElementById('portfolioQty').value = '';
            document.getElementById('portfolioCost').value = '';
        }

        function updatePortfolioDisplay() {
            const el = document.getElementById('portfolioContent');
            if (!portfolio.length) {
                el.innerHTML = '<div class="muted">尚未新增持股</div>';
                return;
            }

            const marketData = loadMarketData();
            const lastDate = [...new Set(marketData.map(d=>d.日期))].sort().slice(-1)[0];
            const today = marketData.filter(d=>d.日期===lastDate);
            const map = new Map(today.map(r=>[r.代碼, r]));

            let totalCost=0, totalValue=0;
            const rows = portfolio.map(p=>{
                const m = map.get(p.code);
                const price = m ? (+m.收盤價||0) : 0;
                const value = price * p.qty;
                const cost = p.cost * p.qty;
                totalCost += cost;
                totalValue += value;
                const pnl = value - cost;
                return { ...p, price, value, cost, pnl };
            });

            el.innerHTML = `
                <table>
                    <thead><tr><th>代碼</th><th>數量</th><th>平均成本</th><th>現價</th><th>現值</th><th>成本</th><th>損益</th><th>操作</th></tr></thead>
                    <tbody>
                        ${rows.map((r, i)=>`
                            <tr>
                                <td>${r.code}</td>
                                <td>${r.qty.toLocaleString()}</td>
                                <td>${r.cost.toFixed(2)}</td>
                                <td>${r.price.toFixed(2)}</td>
                                <td>${r.value.toLocaleString()}</td>
                                <td>${r.cost * r.qty}</td>
                                <td class="${r.pnl>=0?'trend-positive':'trend-negative'}">${r.pnl.toLocaleString()}</td>
                                <td><button class="btn" onclick="removePortfolio(${i})">刪</button></td>
                            </tr>
                        `).join('')}
                        <tr style="background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1)); font-weight: 700;">
                            <td colspan="4">合計</td>
                            <td>${totalValue.toLocaleString()}</td>
                            <td>${totalCost.toLocaleString()}</td>
                            <td class="${totalValue-totalCost>=0?'trend-positive':'trend-negative'}">${(totalValue-totalCost).toLocaleString()}</td>
                            <td></td>
                        </tr>
                    </tbody>
                </table>`;
        }

        function removePortfolio(idx) {
            portfolio.splice(idx, 1);
            savePortfolio();
            updatePortfolioDisplay();
        }

        function loadMarketData() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (!stored) return [];
                const parsed = JSON.parse(stored);
                return parsed?.data ?? (Array.isArray(parsed) ? parsed : []);
            } catch { return []; }
        }
    </script>
</body>
</html>
