<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票池每日觀察 · 儀表板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0F2A33; --ink-2:#163a45; --paper:#F6F4EE; --card:#FFFFFF;
    --line:#DFE4DE; --line-2:#E9ECE7;
    --text:#20343A; --muted:#6C7B7E; --faint:#96A2A2;
    --up:#CE3B2A; --down:#1E8A5B;
    --score:#B67B1B; --score-dn:#8794A0;
    --alert:#B3452B; --alert-bg:#FBEDE8;
    --buy:#B67B1B; --buy-bg:#FBF3DF;
    --teal:#1F4E5F; --brown:#7A4E1F;
    --shadow:0 1px 0 rgba(15,42,51,.04), 0 8px 24px -18px rgba(15,42,51,.35);
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--text);
    font-family:"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; line-height:1.55}
  .num{font-family:"Space Grotesk","Noto Sans TC",sans-serif; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--muted)}
  .wrap{max-width:1240px; margin:0 auto; padding:0 20px 64px}

  header{background:var(--ink); color:#EAF0EF}
  .hd{max-width:1240px; margin:0 auto; padding:20px 20px 22px; display:flex; flex-wrap:wrap; gap:18px 28px; align-items:flex-end; justify-content:space-between}
  .brand{display:flex; align-items:baseline; gap:14px}
  .brand h1{margin:0; font-size:21px; font-weight:900}
  .brand .sub{color:#9DB4B3; font-size:12.5px}

  /* 日期切換器 */
  .datewrap{text-align:right}
  .datewrap .cap{font-size:12px; color:#9DB4B3; margin-bottom:5px}
  .datectl{display:inline-flex; align-items:center; gap:6px; background:var(--ink-2); border:1px solid rgba(255,255,255,.08); border-radius:11px; padding:5px 6px}
  .datectl button{border:0; background:rgba(255,255,255,.06); color:#EAF0EF; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:15px; line-height:1}
  .datectl button:hover:not(:disabled){background:rgba(255,255,255,.14)}
  .datectl button:disabled{opacity:.3; cursor:default}
  .datectl select{background:transparent; border:0; color:#EAF0EF; font-family:"Space Grotesk"; font-size:16px; font-weight:700; padding:2px 6px; cursor:pointer; -webkit-appearance:none; appearance:none; text-align:center}
  .datectl select option{color:#111}
  .daynav{font-size:11px; color:#8FA6A5; margin-top:5px}

  .pulse{max-width:1240px; margin:0 auto; padding:0 20px 20px; display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
  .pchip{background:var(--ink-2); border:1px solid rgba(255,255,255,.06); border-radius:12px; padding:12px 14px; min-height:88px; display:flex; flex-direction:column; gap:6px}
  .pchip-t{font-size:12px; color:#9DB4B3; display:flex; align-items:center; gap:6px}
  .pchip-b .nm{font-size:15px; font-weight:700; color:#EAF0EF; display:block}
  .pchip-b .mt{font-size:12px; color:#B9C7C6}
  .pchip .dot{width:8px;height:8px;border-radius:50%}

  .toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:20px}
  .toolbar .spacer{flex:1}
  .tbtn{border:1px solid var(--line); background:#fff; color:var(--text); border-radius:10px; padding:7px 12px; font:inherit; font-size:12.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px}
  .tbtn:hover{background:#F3F5F1}
  .tbtn.primary{background:var(--teal); color:#fff; border-color:var(--teal)}
  .tbtn.primary:hover{background:#1a4353}
  .tbtn:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
  .srcpill{display:inline-flex; align-items:center; gap:7px; font-size:12px; color:var(--muted); background:#fff; border:1px solid var(--line); border-radius:999px; padding:5px 11px}
  .srcpill .dot{width:8px; height:8px; border-radius:50%; background:var(--score-dn)}
  .srcpill.live .dot{background:var(--down)}
  .srcpill.err .dot{background:var(--alert)}

  .grid{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:20px; margin-top:14px}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow)}
  .panel-hd{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border-bottom:1px solid var(--line-2)}
  .panel-hd h2{margin:0; font-size:15px; font-weight:700}
  .panel-hd .hint{font-size:12px; color:var(--faint)}

  .tools{display:flex; flex-wrap:wrap; gap:6px; padding:10px 12px; border-bottom:1px solid var(--line-2)}
  .seg{display:inline-flex; background:#EFEEE7; border-radius:9px; padding:3px}
  .seg button{border:0; background:transparent; padding:5px 10px; border-radius:7px; font:inherit; font-size:12.5px; color:var(--muted); cursor:pointer}
  .seg button[aria-pressed="true"]{background:#fff; color:var(--text); box-shadow:0 1px 2px rgba(0,0,0,.08); font-weight:700}

  .rows{padding:6px 6px 10px}
  .row{display:grid; grid-template-columns:26px 1fr auto; gap:12px; align-items:center; width:100%; text-align:left; background:transparent; border:0; border-radius:12px; padding:11px 12px; cursor:pointer; font:inherit}
  .row+.row{margin-top:2px}
  .row:hover{background:#F4F6F3}
  .row.sel{background:#EEF4F2; box-shadow:inset 0 0 0 1.5px #CBE0D8}
  .row:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
  .rk{font-family:"Space Grotesk",sans-serif; font-size:15px; font-weight:700; color:var(--faint); text-align:center}
  .rk.top{color:var(--score)}
  .r-main{min-width:0}
  .r-top{display:flex; align-items:center; gap:8px}
  .r-code{font-weight:700}
  .r-name{color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .r-badges{display:flex; gap:5px; margin-top:5px; flex-wrap:wrap}
  .bdg{font-size:11px; padding:1.5px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:#fff; white-space:nowrap}
  .bdg.good{color:var(--up); border-color:#EAC3BC; background:#FBEEEB}
  .bdg.warn{color:#96702A; border-color:#E7D4A6; background:#FBF4E1}
  .bdg.bad{color:var(--down); border-color:#B9DBC9; background:#EAF5EF}
  .r-right{text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:5px}
  .r-chg{font-size:14px; font-weight:700}
  .scorebar{width:112px; height:7px; background:#EDEBE3; border-radius:99px; overflow:hidden}
  .scorebar i{display:block; height:100%; border-radius:99px; background:linear-gradient(90deg,#D9A441,#B67B1B)}
  .r-score{font-size:11.5px; color:var(--muted)}
  .r-score b{color:var(--text); font-family:"Space Grotesk",sans-serif}
  .delta{font-size:11px; font-weight:700}
  .delta.u{color:var(--score)} .delta.d{color:var(--score-dn)}

  .det-hd{padding:16px}
  .det-topline{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .det-title{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .det-title .code{font-size:22px; font-weight:900}
  .det-title .name{font-size:16px; color:var(--muted)}
  .det-title .ind{font-size:12px; color:var(--faint); border:1px solid var(--line); border-radius:6px; padding:1px 7px}
  .det-price{display:flex; align-items:baseline; gap:12px; margin-top:8px}
  .det-price .px{font-size:30px; font-weight:700}
  .det-price .chg{font-size:15px; font-weight:700}
  .det-action{margin-top:10px; display:inline-flex; align-items:center; gap:8px; font-size:13px; padding:6px 12px; border-radius:10px; background:#F1F0EA; color:var(--text); font-weight:700}
  .det-body{padding:0 16px 16px}
  .block{padding:14px 0; border-top:1px solid var(--line-2)}
  .block h3{margin:0 0 10px; font-size:12.5px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .chart{width:100%; height:150px}
  .chart svg{width:100%; height:100%; display:block}
  .legend{display:flex; gap:14px; font-size:11.5px; color:var(--muted); margin-top:4px}
  .legend i{display:inline-block; width:14px; height:3px; border-radius:2px; vertical-align:middle; margin-right:5px}
  .scores{display:flex; flex-direction:column; gap:9px}
  .srow{display:grid; grid-template-columns:64px 1fr 30px; align-items:center; gap:10px; font-size:12.5px}
  .srow .track{height:9px; background:#EEECE4; border-radius:99px; overflow:hidden}
  .srow .track i{display:block; height:100%; border-radius:99px}
  .srow .v{text-align:right; font-family:"Space Grotesk",sans-serif; color:var(--text)}
  .thesis{border-radius:12px; padding:12px 14px; font-size:13px; line-height:1.6}
  .thesis.ok{background:#EFF6F1; border:1px solid #CDE6D8}
  .thesis.risk{background:var(--alert-bg); border:1px solid #E6C6BA}
  .thesis .tag{display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:12px; margin-bottom:6px}
  .thesis.ok .tag{color:var(--down)} .thesis.risk .tag{color:var(--alert)}
  .thesis .cond{margin-top:8px; font-size:12px; color:var(--muted)}
  .thesis .cond code{background:rgba(0,0,0,.05); padding:1px 6px; border-radius:5px; font-family:"Space Grotesk",monospace}
  .items{display:flex; flex-direction:column; gap:2px}
  .item{display:grid; grid-template-columns:52px 1fr; gap:12px; padding:9px 4px; border-bottom:1px dashed var(--line-2)}
  .item:last-child{border-bottom:0}
  .item .d{font-size:11.5px; color:var(--faint); font-family:"Space Grotesk",sans-serif; padding-top:1px}
  .item.today .d{color:var(--score); font-weight:700}
  .item .c{font-size:13px}
  .item .c .k{font-weight:700}
  .tone{display:inline-block; font-size:11px; padding:0 7px; border-radius:999px; margin-right:6px}
  .tone.pos{color:var(--up); background:#FBEEEB} .tone.neg{color:var(--down); background:#EAF5EF} .tone.neu{color:var(--muted); background:#F0EFE9}
  .dtype{display:inline-block; font-size:11px; font-weight:700; padding:0 7px; border-radius:6px; margin-right:6px; border:1px solid var(--line); color:var(--muted)}

  .foot{margin-top:26px; padding-top:16px; border-top:1px solid var(--line); color:var(--faint); font-size:12px; line-height:1.7}
  .foot code{background:#EDEBE3; padding:1px 6px; border-radius:5px; font-family:"Space Grotesk",monospace}

  .modal{position:fixed; inset:0; background:rgba(15,42,51,.42); display:none; align-items:flex-start; justify-content:center; padding:28px 16px; z-index:50; overflow:auto}
  .modal.open{display:flex}
  .sheet{background:var(--card); width:100%; max-width:680px; border-radius:18px; box-shadow:0 24px 60px -20px rgba(0,0,0,.5); overflow:hidden}
  .sheet-hd{display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border-bottom:1px solid var(--line-2); position:sticky; top:0; background:#fff}
  .sheet-hd h3{margin:0; font-size:16px; font-weight:800}
  .sheet-hd .sub{font-size:11.5px; color:var(--faint); font-weight:400; margin-left:8px}
  .x{border:0; background:#F0EFE9; width:30px; height:30px; border-radius:8px; cursor:pointer; font-size:16px; color:var(--muted)}
  .sheet-bd{padding:16px 18px 20px}
  .fsec{padding:12px 0; border-top:1px solid var(--line-2)}
  .fsec:first-child{border-top:0; padding-top:2px}
  .fsec > label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:8px}
  .fsec .scope{font-weight:400; color:var(--faint); font-size:11px; margin-left:6px}
  .fgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px}
  .fgrid.three{grid-template-columns:repeat(3,1fr)}
  .fgrid.five{grid-template-columns:repeat(5,1fr)}
  .field{display:flex; flex-direction:column; gap:4px}
  .field span{font-size:11px; color:var(--faint)}
  input,select,textarea{font:inherit; font-size:13px; color:var(--text); background:#fff; border:1px solid var(--line); border-radius:9px; padding:7px 9px; width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal)}
  textarea{resize:vertical; min-height:52px; line-height:1.5}
  .chk{display:flex; align-items:center; gap:8px; font-size:13px}
  .chk input{width:auto}
  .subrow{display:grid; gap:8px; align-items:start; margin-bottom:8px}
  .subrow.obs{grid-template-columns:96px 120px 1fr 30px}
  .subrow.news{grid-template-columns:96px 78px 90px 1fr 30px}
  .subrow.dec{grid-template-columns:96px 78px 1fr 30px}
  .subrow.badge{grid-template-columns:1fr 92px 30px}
  .del{border:1px solid var(--line); background:#fff; border-radius:8px; height:34px; cursor:pointer; color:var(--muted)}
  .del:hover{background:var(--alert-bg); color:var(--alert); border-color:#E6C6BA}
  .addbtn{border:1px dashed var(--line); background:#FbFbF9; color:var(--muted); border-radius:9px; padding:7px 12px; font:inherit; font-size:12.5px; cursor:pointer}
  .addbtn:hover{border-color:var(--teal); color:var(--teal)}
  .sheet-ft{display:flex; gap:10px; align-items:center; padding:14px 18px; border-top:1px solid var(--line-2); background:#FafAf7; position:sticky; bottom:0}
  .sheet-ft .spacer{flex:1}
  .ed-total{font-size:12px; color:var(--muted)} .ed-total b{font-family:"Space Grotesk"; color:var(--text); font-size:15px}
  .bigarea{width:100%; min-height:260px; font-family:"Space Grotesk",monospace; font-size:12px; line-height:1.5}
  .msg{font-size:12px; color:var(--teal)}

  @media (max-width:920px){
    .pulse{grid-template-columns:1fr 1fr}
    .grid{grid-template-columns:1fr}
    .subrow.obs{grid-template-columns:88px 1fr 30px}
    .subrow.news{grid-template-columns:88px 70px 1fr 30px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="hd">
    <div class="brand"><h1>股票池每日觀察</h1><span class="sub">客觀資料 → 觀察 → 判斷 → 決策</span></div>
    <div class="datewrap">
      <div class="cap">交易日</div>
      <div class="datectl">
        <button id="datePrev" title="前一交易日">◀</button>
        <select id="dateSel" aria-label="選擇交易日"></select>
        <button id="dateNext" title="後一交易日">▶</button>
      </div>
      <div class="daynav" id="dayNav"></div>
    </div>
  </div>
  <div class="pulse" id="pulse"></div>
</header>

<div class="wrap">
  <div class="toolbar">
    <button class="tbtn primary" id="btnAdd">＋ 新增股票</button>
    <span class="srcpill" id="srcPill" title="資料來源"><span class="dot"></span><span id="srcText">範例資料</span></span>
    <span class="spacer"></span>
    <button class="tbtn" id="btnConnect">連線 Sheet</button>
    <button class="tbtn" id="btnImport">匯入</button>
    <button class="tbtn" id="btnExport">匯出</button>
    <button class="tbtn" id="btnSync">同步寫回</button>
  </div>

  <div class="grid">
    <section class="panel">
      <div class="panel-hd"><h2>當日觀察清單</h2><span class="hint" id="listHint">點任一檔查看脈絡</span></div>
      <div class="tools">
        <div class="seg" id="sortSeg" role="group" aria-label="排序">
          <button data-sort="score" aria-pressed="true">綜合分數</button>
          <button data-sort="delta">評分變化</button>
          <button data-sort="chg">當日漲跌</button>
        </div>
        <div class="seg" id="filterSeg" role="group" aria-label="篩選">
          <button data-filter="all" aria-pressed="true">全部</button>
          <button data-filter="focus">重點</button>
          <button data-filter="buy">符合買進</button>
          <button data-filter="risk">邏輯失效</button>
        </div>
      </div>
      <div class="rows" id="rows"></div>
    </section>

    <section class="panel">
      <div class="det-hd" id="detHd"></div>
      <div class="det-body" id="detBody"></div>
    </section>
  </div>

  <div class="foot">
    切換上方交易日，即顯示「該日當下」的價量、五維評分、排名，以及累積到那天為止的觀察／事件／決策——對應你 <code>Daily_Market</code>／<code>Daily_Observation</code> 一天一列的資料。用 <code>連線 Sheet</code> 讀取即時資料（doGet）、<code>同步寫回</code> 回存（doPost）、<code>匯出／匯入</code> 存還原 JSON。目前未連線時顯示的是範例資料。
  </div>
</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ===== 交易日（ISO）；真實使用時由 Daily_Market 的日期清單決定 ===== */
const DATES = ["2026-08-22","2026-08-25","2026-08-26","2026-08-27","2026-08-28","2026-08-29","2026-09-01","2026-09-02"];
const SKEYS = ["技術","籌碼","基本面","消息","動能"];
const STATUS = {focus:"重點",watch:"觀察",wait:"等待訊號",exclude:"排除"};
const TONES  = {pos:"利多",neu:"中性",neg:"利空"};
const BTONES = {good:"偏多",warn:"留意",bad:"偏空"};

/* ===== 精簡的作者資料 → 由 buildModel() 展開成「每天一筆」 =====
   base   : 最近一日五維向量（形狀）
   totals : 每日綜合分（= 五維加總，用來把 base 縮放成當日五維）
   close/ma20 : 每日價量
   ov(erride): 只在最後一日不同的欄位（其餘沿用 default）
   obs/news/dec: 帶 ISO 日期，檢視時顯示「<= 所選日」的累積紀錄 */
const AUTHORED = [
  {id:"3661",name:"世芯-KY",industry:"IC設計",status:"focus",
   thesis:"ASIC 客戶擴大投片，訂單能見度到明年上半年。",
   cond:"買進條件：突破前高 且 外資連3日買超",
   base:[19,19,18,17,19], totals:[80,81,80,82,83,84,84,92],
   close:[3550,3610,3600,3705,3740,3810,3820,3985], ma20:[3480,3505,3525,3550,3580,3610,3645,3690],
   action:{default:"觀察", last:"⭐ 符合買進"},
   ok:{default:true}, buy:{default:false, last:true},
   note:{default:"突破前高、外資買超即符合買進，續觀察。", last:"買進條件已觸發：站上前高且外資連 3 日買超、量能放大。"},
   badges:{default:[["趨勢·多頭","good"],["外資買超","good"],["營收創高","good"]]},
   obs:[{d:"2026-09-02",k:"放量突破前高",t:"外資買超，站上所有均線，符合買進條件。"},{d:"2026-09-01",k:"沿5日線續強",t:"量能溫和放大，籌碼穩定。"},{d:"2026-08-29",k:"整理後轉強",t:"回測月線未破，續抱觀察。"}],
   news:[{d:"2026-09-02",tone:"pos",label:"利多",t:"傳大客戶追加 AI 加速器投片量。"},{d:"2026-08-28",tone:"neu",label:"中性",t:"外資調升目標價，但已反映部分。"}],
   dec:[{d:"2026-09-02",type:"買進",t:"觸發買進條件，建立基本持股，停損設 3600。"},{d:"2026-08-22",type:"觀察",t:"納入重點觀察，等突破前高再進場。"}]},

  {id:"2330",name:"台積電",industry:"晶圓代工",status:"focus",
   thesis:"先進製程需求穩定，客戶集中於 AI/HPC，定價力強。",
   cond:"減碼條件：跌破季線 或 先進製程報價轉弱",
   base:[18,18,20,16,18], totals:[88,88,87,89,89,89,89,90],
   close:[1135,1150,1145,1160,1165,1170,1170,1180], ma20:[1110,1118,1124,1132,1140,1148,1156,1164],
   action:{default:"持有"}, ok:{default:true}, buy:{default:false},

/* 把綜合分 target 依 base 的比例攤回五維整數，總和恰為 target */
function scaleVec(base,target){
  const s=base.reduce((a,b)=>a+b,0)||1;
  const raw=base.map(b=>b/s*target), fl=raw.map(Math.floor);
  let rem=target-fl.reduce((a,b)=>a+b,0);
  const order=raw.map((v,i)=>({i,f:v-fl[i]})).sort((a,b)=>b.f-a.f);
  const out=fl.slice();
  for(let k=0;k<rem;k++) out[order[k%out.length].i]++;
  const o={}; SKEYS.forEach((k,i)=>o[k]=Math.max(0,Math.min(20,out[i]))); return o;
}
function buildModel(){
  const stocks = AUTHORED.map(a=>{
    const days = DATES.map((d,i)=>{
      const isLast = i===DATES.length-1;
      const pick = o => (isLast && ('last' in o)) ? o.last : o.default;
      return { date:d, close:a.close[i], ma20:a.ma20[i], scores:scaleVec(a.base,a.totals[i]),
        action:pick(a.action), ok:pick(a.ok), buy:pick(a.buy), note:pick(a.note),
        badges:JSON.parse(JSON.stringify(pick(a.badges))) };
    });
    return { id:a.id,name:a.name,industry:a.industry,status:a.status,thesis:a.thesis,cond:a.cond,
      days, obs:a.obs.slice(), news:a.news.slice(), dec:a.dec.slice() };
  });
  return { as_of:DATES.at(-1), stocks };
}

const $ = (s,el=document)=>el.querySelector(s);
const total = rec => rec? Object.values(rec.scores).reduce((a,b)=>a+(+b||0),0) : 0;
const shortD = iso => `${+iso.slice(5,7)}/${+iso.slice(8,10)}`;
const fmtPx = v => (v>=100? Number(v).toLocaleString('en-US',{maximumFractionDigits:0}) : Number(v).toFixed(1));
const fmtChg = v => (v>0?'+':'') + Number(v).toFixed(2) + '%';
const chgCls = v => v>0?'up':(v<0?'down':'flat');
const arrow  = v => v>0?'▲':(v<0?'▼':'—');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let state = {sort:'score', filter:'all', selected:null, date:DATES.at(-1)};

const dIdx = () => DATES.indexOf(state.date);
const dayRec = (x,iso) => x.days.find(d=>d.date===iso);
const curr = x => dayRec(x,state.date);
function prevRec(x){ for(let j=dIdx()-1;j>=0;j--){ const r=dayRec(x,DATES[j]); if(r) return r; } return null; }
function chgOf(x){ const c=curr(x); if(!c) return 0; const p=prevRec(x); return p&&p.close? (c.close-p.close)/p.close*100 : 0; }
function deltaOf(x){ const c=curr(x); const p=prevRec(x); return (c&&p)? total(c)-total(p) : 0; }
const stocksOnDate = () => DATA.stocks.filter(x=>curr(x));
function seriesUpto(x){
  const days=x.days.filter(d=>DATES.indexOf(d.date)<=dIdx());
  return { labels:days.map(d=>shortD(d.date)), close:days.map(d=>d.close), ma20:days.map(d=>d.ma20), score:days.map(d=>total(d)) };
}
const eventsUpto = (arr) => arr.filter(e=>e.d<=state.date).sort((a,b)=>b.d.localeCompare(a.d));

/* ---------- 圖表 ---------- */
function lineChart(labels,close,ma20,up){
  const W=520,H=150,pad={l:6,r:6,t:14,b:20};
  if(close.length<2){ close=[close[0]??0,close[0]??0]; ma20=[ma20[0]??0,ma20[0]??0]; labels=[labels[0]||'',labels[0]||'']; }
  const xs=[...close,...ma20],min=Math.min(...xs),max=Math.max(...xs),rng=(max-min)||1;
  const X=i=>pad.l+i*(W-pad.l-pad.r)/(close.length-1), Y=v=>pad.t+(1-(v-min)/rng)*(H-pad.t-pad.b);
  const path=a=>a.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area=`${path(close)} L${X(close.length-1)} ${H-pad.b} L${X(0)} ${H-pad.b} Z`;
  const col=up?'var(--up)':'var(--down)', fill=up?'rgba(206,59,42,.10)':'rgba(30,138,91,.10)';
  const ticks=labels.map((d,i)=>(i%2===0||i===labels.length-1)?`<text x="${X(i)}" y="${H-6}" font-size="9" fill="var(--faint)" text-anchor="middle" font-family="Space Grotesk">${esc(d)}</text>`:'').join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="價格走勢">
    <path d="${area}" fill="${fill}"/><path d="${path(ma20)}" fill="none" stroke="#B9A15E" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="${path(close)}" fill="none" stroke="${col}" stroke-width="2.2"/>
    <circle cx="${X(close.length-1)}" cy="${Y(close.at(-1))}" r="3.2" fill="${col}"/>${ticks}</svg>`;
}
function sparkScore(arr){
  if(arr.length<2) arr=[arr[0]??0,arr[0]??0];
  const W=120,H=30,min=Math.min(...arr),max=Math.max(...arr),rng=(max-min)||1;
  const X=i=>i*W/(arr.length-1),Y=v=>4+(1-(v-min)/rng)*(H-8),up=arr.at(-1)>=arr[0];
  const p=arr.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const col=up?'var(--score)':'var(--score-dn)';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:120px;height:30px"><path d="${p}" fill="none" stroke="${col}" stroke-width="2"/><circle cx="${X(arr.length-1)}" cy="${Y(arr.at(-1))}" r="2.6" fill="${col}"/></svg>`;
}

    <div class="fsec"><label>投資邏輯與條件 <span class="scope">全期共用</span></label>

    <div class="fsec"><label>相關事件 <span class="scope">帶日期</span> <button class="addbtn" data-add="news">＋ 一筆</button></label>${news||'<span style="color:var(--faint);font-size:12px">尚無</span>'}</div>
    <div class="fsec"><label>決策紀錄 <span class="scope">帶日期</span> <button class="addbtn" data-add="dec">＋ 一筆</button></label>${dec||'<span style="color:var(--faint);font-size:12px">尚無</span>'}</div>
  </div>

    <span class="ed-total">當日綜合分 <b id="edTotal">${total(rec)}</b> / 100</span>
    <span class="spacer"></span>
    ${x.__new?'':'<button class="tbtn" data-delstock style="color:var(--alert);border-color:#E6C6BA">刪除此檔</button>'}

  </div>`;
}
function renderEditor(){ openModal(editorHTML(editing,editingDay)); bindEditor(); }

function openEditor(id){
  editing=DATA.stocks.find(s=>s.id===id); if(!editing) return;
  delete editing.__new; state.selected=id;
  editingDay=curr(editing);
  if(!editingDay){ editingDay={...blankDay()}; editing.days.push(editingDay); }
  renderEditor();
}
function openNew(){ editing=blankStock(); editing.__new=true; editingDay=editing.days[0]; renderEditor(); }

function setByPath(root,path,val){
  const parts=path.split('.'); let o=root;
  for(let i=0;i<parts.length-1;i++){ const k=parts[i]; o=o[/^\d+$/.test(k)?+k:k]; }
  const last=parts.at(-1); o[/^\d+$/.test(last)?+last:last]=val;
}
function commitNewIfNeeded(){
  if(editing&&editing.__new){ if(!editing.id) editing.id='NEW'+Date.now().toString().slice(-4);
    delete editing.__new; DATA.stocks.push(editing); state.selected=editing.id; }
}
function bindEditor(){
  const sheet=$('#sheet');
  sheet.addEventListener('input',e=>{
    const el=e.target, f=el.dataset.f; if(!f) return;
    let v;
    if(el.type==='checkbox') v=el.checked;
    else if(el.dataset.type==='num') v=parseFloat(el.value||'0')||0;
    else v=el.value;
    if(f.startsWith('day.')) setByPath(editingDay,f.slice(4),v);
    else if(f==='id'){ const old=state.selected; setByPath(editing,'id',v); if(state.selected===old) state.selected=v; }
    else setByPath(editing,f,v);
    if(!editing.__new){ renderPulse(); renderRows(); renderDetail(); renderDatePicker(); }
    const et=$('#edTotal'); if(et) et.textContent=total(editingDay);
  });
  sheet.addEventListener('click',e=>{
    const t=e.target;
    if(t.hasAttribute('data-close')){ commitNewIfNeeded(); closeModal(); refreshAll(); return; }
    if(t.hasAttribute('data-delstock')){ if(confirm('確定刪除 '+editing.id+' '+editing.name+'？')){ DATA.stocks=DATA.stocks.filter(s=>s!==editing); state.selected=null; closeModal(); refreshAll(); } return; }
    const add=t.getAttribute('data-add');
    if(add){
      if(add==='badges') editingDay.badges.push(["新標籤","warn"]);
      if(add==='obs')  editing.obs.unshift({d:state.date,k:"",t:""});
      if(add==='news') editing.news.unshift({d:state.date,tone:"neu",label:"中性",t:""});
      if(add==='dec')  editing.dec.unshift({d:state.date,type:"觀察",t:""});
      renderEditor(); return;
    }
    const del=t.getAttribute('data-del');
    if(del){
      if(del.startsWith('day.badges.')){ editingDay.badges.splice(+del.split('.')[2],1); }
      else { const [arr,idx]=del.split('.'); editing[arr].splice(+idx,1); }
      renderEditor(); return;
    }
  });
}
function refreshAll(){ renderDatePicker(); renderPulse(); renderRows(); renderDetail(); }

/* ===================== 匯出 / 匯入 / 同步 ===================== */
function serialize(){ return JSON.stringify({as_of:DATA.as_of, dates:DATES, stocks:DATA.stocks.map(({__new,...r})=>r)}, null, 2); }
function exportJSON(){
  const json=serialize();
  openModal(`<div class="sheet-hd"><h3>匯出資料</h3><button class="x" data-close-generic>✕</button></div>
    <div class="sheet-bd"><p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">複製下方 JSON 保存，或按「下載檔案」。這份 JSON 也能貼進「匯入資料」還原。</p>
    <textarea class="bigarea" id="exp" readonly>${esc(json)}</textarea></div>
    <div class="sheet-ft"><span class="msg" id="expMsg"></span><span class="spacer"></span><button class="tbtn" id="expCopy">複製</button><button class="tbtn primary" id="expDl">下載檔案</button></div>`);
  $('#modal').classList.add('open');
  $('[data-close-generic]').addEventListener('click',closeModal);
  $('#expCopy').addEventListener('click',async()=>{const ta=$('#exp');ta.select();try{await navigator.clipboard.writeText(ta.value);}catch(_){document.execCommand('copy');}$('#expMsg').textContent='已複製到剪貼簿';});
  $('#expDl').addEventListener('click',()=>{try{const b=new Blob([json],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='stock_pool_data.json';document.body.appendChild(a);a.click();a.remove();$('#expMsg').textContent='已觸發下載';}catch(_){$('#expMsg').textContent='此環境不允許下載，請改用「複製」';}});
}
function importJSON(){
  openModal(`<div class="sheet-hd"><h3>匯入資料</h3><button class="x" data-close-generic>✕</button></div>
    <div class="sheet-bd"><p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">貼上先前匯出的 JSON，或選擇檔案。載入會覆蓋目前資料。</p>
    <input type="file" id="impFile" accept="application/json" style="margin-bottom:10px">
    <textarea class="bigarea" id="imp" placeholder='{ "as_of":"...", "dates":[...], "stocks":[...] }'></textarea></div>
    <div class="sheet-ft"><span class="msg" id="impMsg"></span><span class="spacer"></span><button class="tbtn primary" id="impLoad">載入</button></div>`);
  $('#modal').classList.add('open');
  $('[data-close-generic]').addEventListener('click',closeModal);
  $('#impFile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imp').value=r.result;};r.readAsText(f);});
  $('#impLoad').addEventListener('click',()=>{try{
    const obj=JSON.parse($('#imp').value);
    if(!Array.isArray(obj.stocks)) throw new Error('格式需含 stocks 陣列');
    if(Array.isArray(obj.dates)&&obj.dates.length){ DATES.length=0; obj.dates.forEach(d=>DATES.push(d)); }
    DATA.as_of=obj.as_of||DATES.at(-1); DATA.stocks=obj.stocks; state.selected=null;
    if(!DATES.includes(state.date)) state.date=DATES.at(-1);
    closeModal(); refreshAll();
  }catch(err){$('#impMsg').textContent='解析失敗：'+err.message;}});
}
/* 若想開檔即自動連線，把你的 /exec 網址填在這裡（留空則預設載入範例資料） */
let API_URL = "";

function setSource(kind, text){
  const pill=$('#srcPill'), txt=$('#srcText');
  pill.classList.remove('live','err');
  if(kind==='live') pill.classList.add('live');
  if(kind==='err')  pill.classList.add('err');
  txt.textContent=text;
}

/* 從 Apps Script Web App 讀取即時資料（doGet） */
async function loadLive(url, statusEl){
  const say = m => { if(statusEl) statusEl.textContent=m; };
  try{
    say('讀取中…'); setSource('', '讀取中…');
    const res = await fetch(url, {method:'GET'});
    const j = await res.json();
    if(j.error) throw new Error(j.error);
    if(!Array.isArray(j.stocks) || !j.stocks.length) throw new Error('回傳沒有股票資料');
    if(Array.isArray(j.dates) && j.dates.length){ DATES.length=0; j.dates.forEach(d=>DATES.push(d)); }
    DATA.as_of = j.as_of || DATES.at(-1);
    DATA.stocks = j.stocks;
    state.selected=null;
    if(!DATES.includes(state.date)) state.date = DATES.at(-1);
    API_URL = url;
    refreshAll();
    setSource('live', '已連線 · '+DATA.stocks.length+' 檔');
    say('讀取成功，共 '+DATA.stocks.length+' 檔');
    return true;
  }catch(err){
    setSource('err', '連線失敗（顯示範例）');
    say('讀取失敗：'+err.message+'。預覽視窗常因跨網域被擋，請下載本檔於自己環境開啟。');
    return false;
  }
}

/* 連線設定：填網址 → 讀取即時資料 */
function connectModal(){
  openModal(`<div class="sheet-hd"><h3>連線 Google Sheet</h3><button class="x" data-close-generic>✕</button></div>
    <div class="sheet-bd"><p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">貼上你 Apps Script 網頁應用程式的 <code>/exec</code> 網址（已佈署 <code>doGet</code>／<code>doPost</code>）。讀取＝doGet，同步寫回＝doPost，兩者共用這個網址。</p>
    <input id="apiUrl" placeholder="https://script.google.com/macros/s/XXXX/exec" value="${esc(API_URL)}">
    <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">若在此預覽視窗因跨網域限制失敗，請下載本檔於自己環境（或你的網站）開啟；本機檔案讀取 Apps Script 通常正常。</p></div>
    <div class="sheet-ft"><span class="msg" id="connMsg"></span><span class="spacer"></span>
    <button class="tbtn" id="connSave">只儲存網址</button><button class="tbtn primary" id="connLoad">讀取即時資料</button></div>`);
  $('#modal').classList.add('open');
  $('[data-close-generic]').addEventListener('click',closeModal);
  $('#connSave').addEventListener('click',()=>{ API_URL=$('#apiUrl').value.trim(); $('#connMsg').textContent='已儲存，可用「同步寫回」'; });
  $('#connLoad').addEventListener('click',async()=>{
    const url=$('#apiUrl').value.trim(); if(!url){ $('#connMsg').textContent='請先填入網址'; return; }
    const ok=await loadLive(url, $('#connMsg')); if(ok) setTimeout(closeModal, 700);
  });
}

/* 同步寫回（doPost）：共用 API_URL，未設定則引導去連線 */
function syncSheet(){
  openModal(`<div class="sheet-hd"><h3>同步寫回試算表</h3><button class="x" data-close-generic>✕</button></div>
    <div class="sheet-bd"><p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">把目前資料 POST 回 Google Sheet（doPost）。網址沿用「連線 Sheet」設定的那組。</p>
    <input id="syncUrl" placeholder="https://script.google.com/macros/s/XXXX/exec" value="${esc(API_URL)}">
    <p style="font-size:11.5px;color:var(--faint);margin:10px 0 0">寫回只更新程式負責的欄位，不會蓋掉你手填的其他欄位；找不到對應列就新增。預覽視窗若被跨網域擋下，請下載後於自己環境操作，或改用「匯出」貼回。</p></div>
    <div class="sheet-ft"><span class="msg" id="syncMsg"></span><span class="spacer"></span><button class="tbtn primary" id="syncGo">同步</button></div>`);
  $('#modal').classList.add('open');
  $('[data-close-generic]').addEventListener('click',closeModal);
  $('#syncGo').addEventListener('click',async()=>{
    const url=$('#syncUrl').value.trim(); if(!url){$('#syncMsg').textContent='請先填入網址';return;}
    API_URL=url; $('#syncMsg').textContent='同步中…';
    try{const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:serialize()});const txt=await res.text();$('#syncMsg').textContent='完成：'+txt.slice(0,80);}
    catch(err){$('#syncMsg').textContent='失敗：'+err.message+'（可改用匯出）';}});
}

/* ---------- 綁定 ---------- */
function bindSeg(id,key){
  const seg=$('#'+id);
  seg.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{
    seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed','false'));
    btn.setAttribute('aria-pressed','true');
    state[key]=btn.dataset[key==='sort'?'sort':'filter'];
    renderRows(); renderDetail();
  }));
}
$('#dateSel').addEventListener('change',e=>setDate(e.target.value));
$('#datePrev').addEventListener('click',()=>{ if(dIdx()>0) setDate(DATES[dIdx()-1]); });
$('#dateNext').addEventListener('click',()=>{ if(dIdx()<DATES.length-1) setDate(DATES[dIdx()+1]); });
$('#btnAdd').addEventListener('click',openNew);
$('#btnConnect').addEventListener('click',connectModal);
$('#btnExport').addEventListener('click',exportJSON);
$('#btnImport').addEventListener('click',importJSON);
$('#btnSync').addEventListener('click',syncSheet);

function init(){ renderDatePicker(); bindSeg('sortSeg','sort'); bindSeg('filterSeg','filter'); refreshAll(); }
init();
// 開檔即連線（若已在頂端填入 API_URL），否則維持範例資料
if(API_URL) loadLive(API_URL); else setSource('', '範例資料');

/* =====================================================================
   接真實資料（日期驅動）
   ---------------------------------------------------------------------
   doGet 回傳結構（每檔含 days 陣列，一天一筆）：
     { as_of, dates:[...],
       stocks:[ { id,name,industry,status,thesis,cond,
                  days:[ {date,close,ma20,scores:{技術..動能},action,ok,buy,note,badges:[[文字,tone]]} ],
                  obs:[{d,k,t}], news:[{d,tone,label,t}], dec:[{d,type,t}] } ] }
   前端載入：已內建 loadLive(url) 與「連線 Sheet」按鈕。
     • 想開檔即自動連線：把 /exec 網址填到腳本最上方的  let API_URL = "…";
     • 或執行時按「連線 Sheet」貼上網址讀取；「同步寫回」共用同一組網址。

   Apps Script 端組 days 的做法：
     • 對每檔，掃 Daily_Observation 各日列 → 一筆 day（scores/action/note/ok/buy）
     • 用 Daily_Market 對應日 → 補 close/ma20
     • Stock_Pool → id/name/industry/status/thesis/cond（全期共用）
     • News / Decision_Log → 各自 obs/news/dec（帶日期）

   回寫（doPost）：
     function doPost(e){
       const body=JSON.parse(e.postData.contents);   // {as_of,dates,stocks:[{...,days}]}
       writeBack_(SpreadsheetApp.getActiveSpreadsheet(), body); // 把每檔 days 攤回 Daily_* 各日列
       return ContentService.createTextOutput('OK '+body.stocks.length+' 檔');
     }
   佈署：部署 → 新增部署作業 → 網頁應用程式 → 存取權「任何人」。
   ===================================================================== */
</script>
</body>
